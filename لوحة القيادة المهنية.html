م تحديث المجال ✅');\n            } else {\n                domainDefs.push({\n                    id: 'dm_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),\n                    cat: name, name, emoji: d.emoji, icon: d.icon, color: d.color,\n                    kind: d.kind, unit: d.unit, target: d.target, desc: (d.desc || '').trim(),\n                    created: getTodayStr(), order: domainDefs.length\n                });\n                saveDomains();\n                showToast(d.emoji + ' تم إنشاء مجال «' + name + '» بنجاح');\n            }\n            domainDraft = domainBlankDraft();\n            syncDomainForm();\n            recalculateSystem();\n        }\n\n        function cancelDomainEdit() {\n            domainDraft = domainBlankDraft();\n            syncDomainForm();\n        }\n\n        function openDomainEditor(id) {\n            const d = domainById(id);\n            if (!d) return;\n            domainDraft = { id: d.id, name: d.name, emoji: d.emoji, icon: d.icon, color: d.color, kind: d.kind, unit: d.unit, target: d.target, desc: d.desc };\n            switchTab('domains');\n            syncDomainForm();\n            setTimeout(() => {\n                const el = document.getElementById('domFormCard');\n                if (el) el.scrollIntoView({ block: 'start' });\n            }, 160);\n        }\n\n        function moveDomain(id, dir) {\n            const i = domainDefs.findIndex(d => d.id === id);\n            const j = i + dir;\n            if (i < 0 || j < 0 || j >= domainDefs.length) return;\n            const tmp = domainDefs[i]; domainDefs[i] = domainDefs[j]; domainDefs[j] = tmp;\n            saveDomains();\n            recalculateSystem();\n        }\n\n        // حذف المجال مع الإبقاء على تاريخه: السجلات تنتقل تلقائياً إلى «الأنشطة الحرة»\n        // لأن أي فئة غير معروفة تُعرض هناك — فلا يضيع للمستخدم رقم واحد.\n        function removeDomain(id) {\n            const d = domainById(id);\n            if (!d) return;\n            const n = domainLogs(d).length;\n            openConfirmModal(\n                `سيُحذف مجال «${d.name}» من القائمة الجانبية.\\n\\n${n ? `سجلاته (${n}) ستبقى محفوظة بالكامل وتظهر ضمن «الأنشطة الحرة».` : 'لا توجد له سجلات.'}`,\n                () => {\n                    domainDefs = domainDefs.filter(x => x.id !== id);\n                    delete hubTargets['dom_' + id];\n                    saveBalanceConfig(); saveDomains();\n                    rebuildHubSections();\n                    if (activeTab === 'dom-' + id) switchTab('domains');\n                    recalculateSystem();\n                    showToast('تم حذف المجال والإبقاء على سجلاته');\n                });\n        }\n\n        function purgeDomain(id) {\n            const d = domainById(id);\n            if (!d) return;\n            const logs = domainLogs(d);\n            openConfirmModal(\n                `حذف نهائي لمجال «${d.name}» ولكل سجلاته (${logs.length} سجلاً).\\n\\nهذا الإجراء لا يمكن التراجع عنه، وستختفي أرقامه من كل التقارير.`,\n                () => {\n                    logs.forEach(l => recordDeletion(l.id));\n                    globalActivityLogs = globalActivityLogs.filter(l => l.category !== d.cat);\n                    domainDefs = domainDefs.filter(x => x.id !== id);\n                    delete hubTargets['dom_' + id];\n                    saveBalanceConfig(); saveLocalData(); saveDomains();\n                    rebuildHubSections();\n                    if (activeTab === 'dom-' + id) switchTab('domains');\n                    recalculateSystem();\n                    showToast('تم الحذف النهائي للمجال وسجلاته');\n                });\n        }\n\n        /* ---------- قائمة المجالات القائمة داخل المركز ---------- */\n\n        function renderDomainList() {\n            const box = document.getElementById('domList');\n            const stat = document.getElementById('domHubStats');\n            if (!box) return;\n\n            if (stat) {\n                const totalMins = domainDefs.reduce((s, d) => s + domainMeasure(d, '0000-01-01').mins, 0);\n                const totalLogs = domainDefs.reduce((s, d) => s + domainLogs(d).length, 0);\n                const activeToday = domainDefs.filter(d => domainMeasure(d, getTodayStr(), getTodayStr()).sessions > 0).length;\n                const chip = (icon, v, c, color) => `<div class=\"glass-panel rounded-2xl border border-white/10 p-3.5\">\n                    <div class=\"flex items-center gap-1.5 mb-1.5\" style=\"color:${ink(color)}\"><i data-lucide=\"${icon}\" class=\"w-3.5 h-3.5 shrink-0\"><\u002Fi><span class=\"text-[10px] font-bold leading-tight\">${c}<\u002Fspan><\u002Fdiv>\n                    <div class=\"text-lg font-black text-white leading-none\">${v}<\u002Fdiv>\n                <\u002Fdiv>`;\n                stat.innerHTML =\n                    chip('blocks', domainDefs.length, 'مجالاتك الخاصة', '#38bdf8') +\n                    chip('badge-check', activeToday, 'نشطة اليوم', '#10b981') +\n                    chip('clock', fmtDuration(totalMins), 'إجمالي وقتها', '#f59e0b') +\n                    chip('list-checks', totalLogs, 'سجلاً مدوّناً', '#a855f7');\n            }\n\n            if (!domainDefs.length) {\n                box.innerHTML = `<div class=\"glass-panel rounded-2xl border border-white/10 p-8 text-center\">\n                    <div class=\"w-16 h-16 mx-auto rounded-3xl bg-sky-500/10 border border-sky-500/25 text-sky-300 flex items-center justify-center mb-4\"><i data-lucide=\"blocks\" class=\"w-8 h-8\"><\u002Fi><\u002Fdiv>\n                    <p class=\"text-sm text-slate-300 font-bold mb-1\">لم تُنشئ أي مجال خاص بعد<\u002Fp>\n                    <p class=\"text-xs text-slate-400 leading-relaxed max-w-md mx-auto\" style=\"text-wrap:pretty\">ابدأ بقالب جاهز من الأعلى، أو صمّم مجالك من الصفر. سيظهر فوراً في القائمة الجانبية، وتدخل أرقامه تلقائياً في لوحة التوازن والتقارير ووقفة الجمعة وانطلاقة الإثنين.<\u002Fp>\n                <\u002Fdiv>`;\n                safeCreateIcons();\n                return;\n            }\n\n            box.innerHTML = domainDefs.map((d, i) => {\n                const kd = domainKind(d.kind);\n                const s = domainStats(d);\n                const weekVal = domainValueIn(s.week, d.unit);\n                const goal = d.target * 7;\n                const pct = goal > 0 ? Math.min(100, (weekVal / goal) * 100) : (weekVal > 0 ? 100 : 0);\n                return `<div class=\"glass-panel rounded-2xl border p-4\" style=\"border-color:${d.color}33\">\n                    <div class=\"flex items-start gap-3\">\n                        <span class=\"w-11 h-11 shrink-0 rounded-2xl flex items-center justify-center text-lg border\" style=\"background:${d.color}1a;border-color:${d.color}40\">${d.emoji}<\u002Fspan>\n                        <div class=\"flex-1 min-w-0\">\n                            <div class=\"flex items-center gap-2 flex-wrap\">\n                                <button onclick=\"switchTab('dom-${d.id}')\" class=\"text-sm font-black truncate hover:underline\" style=\"color:${ink(d.color)}\">${escAttr(d.name)}<\u002Fbutton>\n                                <span class=\"text-[9px] font-black px-1.5 py-0.5 rounded-md border border-white/10 bg-white/5 text-slate-400\">${kd.label}<\u002Fspan>\n                            <\u002Fdiv>\n                            <p class=\"text-[10px] text-slate-400 mt-1 leading-snug line-clamp-2\">${escAttr(d.desc) || kd.desc}<\u002Fp>\n                        <\u002Fdiv>\n                        <div class=\"flex items-center gap-1 shrink-0\">\n                            <button onclick=\"moveDomain('${d.id}',-1)\" ${i === 0 ? 'disabled' : ''} title=\"تحريك لأعلى\" class=\"w-7 h-7 rounded-lg bg-white/5 border border-white/10 text-slate-400 flex items-center justify-center disabled:opacity-25 transition\"><i data-lucide=\"chevron-up\" class=\"w-3.5 h-3.5\"><\u002Fi><\u002Fbutton>\n                            <button onclick=\"moveDomain('${d.id}',1)\" ${i === domainDefs.length - 1 ? 'disabled' : ''} title=\"تحريك لأسفل\" class=\"w-7 h-7 rounded-lg bg-white/5 border border-white/10 text-slate-400 flex items-center justify-center disabled:opacity-25 transition\"><i data-lucide=\"chevron-down\" class=\"w-3.5 h-3.5\"><\u002Fi><\u002Fbutton>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n\n                    <div class=\"grid grid-cols-3 gap-2 mt-3.5\">\n                        <div class=\"rounded-xl border border-white/10 bg-white/5 px-2.5 py-2\">\n                            <p class=\"text-[9px] text-slate-500 font-bold mb-0.5\">هذا الأسبوع<\u002Fp>\n                            <p class=\"text-xs font-black text-white truncate\">${domainUnitFmt(weekVal, d.unit)}<\u002Fp>\n                        <\u002Fdiv>\n                        <div class=\"rounded-xl border border-white/10 bg-white/5 px-2.5 py-2\">\n                            <p class=\"text-[9px] text-slate-500 font-bold mb-0.5\">سلسلة<\u002Fp>\n                            <p class=\"text-xs font-black text-white truncate\">${s.streak} يوم<\u002Fp>\n                        <\u002Fdiv>\n                        <div class=\"rounded-xl border border-white/10 bg-white/5 px-2.5 py-2\">\n                            <p class=\"text-[9px] text-slate-500 font-bold mb-0.5\">الإجمالي<\u002Fp>\n                            <p class=\"text-xs font-black text-white truncate\">${s.all.sessions} جلسة<\u002Fp>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n\n                    <div class=\"flex items-center gap-2 mt-3\">\n                        <span class=\"text-[10px] font-black shrink-0\" style=\"color:${ink(d.color)}\">${Math.round(pct)}%<\u002Fspan>\n                        <div class=\"flex-1 h-1.5 rounded-full overflow-hidden mw-track\"><div class=\"h-full rounded-full transition-all\" style=\"width:${pct}%;background:${d.color}\"><\u002Fdiv><\u002Fdiv>\n                        <span class=\"text-[9px] text-slate-500 shrink-0\">من ${domainUnitFmt(goal, d.unit)} أسبوعياً<\u002Fspan>\n                    <\u002Fdiv>\n\n                    <div class=\"flex items-center gap-2 mt-3.5 pt-3 border-t border-white/10\">\n                        <button onclick=\"openDomainEditor('${d.id}')\" class=\"flex-1 py-2 rounded-xl text-[11px] font-bold bg-white/5 hover:bg-white/10 border border-white/10 text-slate-200 transition flex items-center justify-center gap-1.5\"><i data-lucide=\"pencil\" class=\"w-3.5 h-3.5\"><\u002Fi> تعديل<\u002Fbutton>\n                        <button onclick=\"removeDomain('${d.id}')\" class=\"flex-1 py-2 rounded-xl text-[11px] font-bold bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300 transition flex items-center justify-center gap-1.5\"><i data-lucide=\"archive\" class=\"w-3.5 h-3.5\"><\u002Fi> حذف المجال<\u002Fbutton>\n                        <button onclick=\"purgeDomain('${d.id}')\" title=\"حذف المجال وكل سجلاته نهائياً\" class=\"w-9 h-9 shrink-0 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 text-rose-400 flex items-center justify-center transition\"><i data-lucide=\"trash-2\" class=\"w-3.5 h-3.5\"><\u002Fi><\u002Fbutton>\n                    <\u002Fdiv>\n                <\u002Fdiv>`;\n            }).join('');\n            safeCreateIcons();\n        }\n\n        /* ---------- دمج المجالات في محرّكات النظام القائمة ---------- */\n\n        // لوحة التوازن: المجالات الأصلية ثابتة، ومجالات المستخدم تُلحَق بها بمفتاح مشتق\n        // من المعرّف لا من الاسم، حتى لا تضيع أهدافه المحفوظة عند إعادة تسمية المجال.\n        function rebuildHubSections() {\n            const keepPeriod = hubPeriodIndex;\n            HUB_SECTIONS = HUB_BASE_SECTIONS.concat(domainDefs.map(d => {\n                const kd = domainKind(d.kind);\n                return {\n                    k: 'dom_' + d.id, label: d.name, icon: d.icon, color: d.color, cat: d.cat,\n                    units: kd.units.slice(), def: { unit: d.unit, target: d.target || kd.defTarget }\n                };\n            }));\n            loadBalanceConfig();\n            hubPeriodIndex = keepPeriod;\n            renderBalanceHub();\n        }\n\n        // الإضافة السريعة: كل مجال جديد يصير خياراً أصيلاً في نافذة «إضافة نشاط ذكي»\n        function populateQuickDomainOptions() {\n            const sel = document.getElementById('quickActivityType');\n            if (!sel) return;\n            const keep = sel.value;\n            const old = document.getElementById('quickDomainGroup');\n            if (old) old.remove();\n            if (domainDefs.length) {\n                const g = document.createElement('optgroup');\n                g.id = 'quickDomainGroup';\n                g.label = 'مجالاتك الخاصة';\n                domainDefs.forEach(d => {\n                    const o = document.createElement('option');\n                    o.value = 'dom:' + d.id;\n                    o.text = `${d.emoji} ${d.name}`;\n                    g.appendChild(o);\n                });\n                sel.appendChild(g);\n            }\n            sel.value = Array.from(sel.options).some(o => o.value === keep) ? keep : 'custom';\n            toggleDynamicActivityFields();\n        }\n\n        // لافتة المجال داخل نموذج الإضافة السريعة + ضبط الحقول بحسب نوعه\n        function syncQuickDomainFields() {\n            const sel = document.getElementById('quickActivityType');\n            if (!sel || !String(sel.value).startsWith('dom:')) return;\n            const d = domainById(String(sel.value).slice(4));\n            if (!d) return;\n            const kd = domainKind(d.kind);\n            const banner = document.getElementById('q_domainBanner');\n            if (banner) banner.innerHTML = `<div class=\"flex items-center gap-2.5 rounded-xl border px-3 py-2.5\" style=\"border-color:${d.color}40;background:${d.color}0f\">\n                <span class=\"w-8 h-8 shrink-0 rounded-xl flex items-center justify-center text-base border\" style=\"background:${d.color}1a;border-color:${d.color}40\">${d.emoji}<\u002Fspan>\n                <div class=\"min-w-0\">\n                    <p class=\"text-[11px] font-black truncate\" style=\"color:${ink(d.color)}\">${escAttr(d.name)}<\u002Fp>\n                    <p class=\"text-[9px] text-slate-400 truncate\">${kd.label} · الهدف اليومي ${domainUnitFmt(d.target, d.unit)}<\u002Fp>\n                <\u002Fdiv>\n            <\u002Fdiv>`;\n            const t = document.getElementById('q_domainTime');\n            const c = document.getElementById('q_domainCount');\n            if (t) { t.placeholder = kd.timeRequired ? 'المدة بالدقائق' : 'دقائق (اختياري)'; t.toggleAttribute('required', kd.timeRequired); }\n            if (c) { c.placeholder = kd.countPh; c.toggleAttribute('required', !kd.timeRequired); }\n        }\n\n        // فئات المجالات المخصّصة مجتمعة — تُستخدم لاستبعادها من «الأنشطة الحرة»\n        function isDomainCat(cat) { return domainDefs.some(d => d.cat === cat); }\n\n        // ألوان السلاسل في التقارير: المجالات الأصلية بألوانها التاريخية، والجديدة بلونها\n        function domainSeriesColor(cat) {\n            const d = domainByCat(cat);\n            return d ? d.color : '#ec4899';\n        }\n\n        /* ========== المطلب 2: انطلاقة الإثنين ==========\n           قسم مقابل لوقفة الجمعة، يظهر تلقائياً كل يوم إثنين. الفارق الجوهري:\n           • الجمعة تُغلق الأسبوع الجاري بمراجعة هادئة.\n           • الإثنين يفتح الأسبوع الجديد بحصاد «الأسبوع الماضي المكتمل» (السبت → الجمعة\n             المنقضيين) — وليس الأسبوع الحالي الذي يُعرض فيه التقرير — ثم يقارنه بالأسبوع\n             الذي قبله، ويشخّص الأداء برقم واحد، ثم يحوّل التشخيص إلى تعهدات رقمية محسوبة،\n             ثم يختم بوقود انطلاق عملي. */\n\n        /* أسماء أيام الأسبوع تأتي الآن من تاريخ اليوم نفسه عبر dayNameOf()، لا من ترتيب ثابت\n           يفترض أن الأسبوع يبدأ بيوم معيّن — فلا ينزاح اسم اليوم عن عموده بعد تحويل البداية إلى السبت. */\n\n\n        // أسماء المجالات كما يفهمها المستخدم (البيانات تُخزَّن بمفاتيح إنجليزية تاريخياً)\n        function mondayCatLabel(k) {\n            const map = { 'Photography': 'مشروع التصوير', 'Business': 'إدارة الأعمال', 'AI': 'تقنيات الذكاء', 'قراءة': 'القراءة والمعرفة', 'تصميم': 'تصميم ومونتاج', 'رياضة': 'رياضة وصحة' };\n            return map[k] || domainLabel(k);\n        }\n\n        // صيغ الجمع العربية الصحيحة (مفرد/مثنى/جمع قلة/جمع كثرة) — تفصيل صغير يصنع فرق الاحترافية\n        function mondayPluralDays(n) {\n            n = Math.max(0, Math.round(Number(n) || 0));\n            if (n === 0) return 'لم تبدأ بعد';\n            if (n === 1) return 'يوم واحد';\n            if (n === 2) return 'يومان';\n            if (n >= 3 && n <= 10) return `${n} أيام`;\n            return `${n} يوماً`;\n        }\n        function mondayPluralSessions(n) {\n            n = Math.max(0, Math.round(Number(n) || 0));\n            if (n === 0) return 'بلا جلسات';\n            if (n === 1) return 'جلسة واحدة';\n            if (n === 2) return 'جلستان';\n            if (n <= 10) return `${n} جلسات`;\n            return `${n} جلسة`;\n        }\n\n        const MONDAY_CORE_DOMAINS = [\n            { k: 'Business', label: 'إدارة الأعمال', icon: 'briefcase', color: '#6366f1' },\n            { k: 'Photography', label: 'مشروع التصوير', icon: 'camera', color: '#f59e0b' },\n            { k: 'AI', label: 'تقنيات الذكاء', icon: 'cpu', color: '#8b5cf6' },\n            { k: 'قراءة', label: 'القراءة والمعرفة', icon: 'book-open', color: '#10b981' }\n        ];\n\n        // المطلب 1 + 4: التشخيص الأسبوعي يشمل مجالات المستخدم بنفس عمق المجالات الأصلية\n        function mondayAllDomains() {\n            return MONDAY_CORE_DOMAINS.concat(domainDefs.map(d => ({\n                k: d.cat, label: d.name, icon: d.icon, color: d.color, custom: true, def: d\n            })));\n        }\n\n        // وقود الانطلاق: خمس مجموعات تدور بحسب أسبوع الشهر، بمحتوى مستقل تماماً عن نصائح\n        // الجمعة — الجمعة تُراجِع، والإثنين يُنفِّذ.\n        const MONDAY_FUEL = [\n            {\n                icon: 'sunrise',\n                title: 'ابدأ ثقيلاً لتنتهي خفيفاً',\n                text: 'أصعب مهمة في أسبوعك لن تصير أسهل يوم الخميس. ضعها في صباح الإثنين وأنت في أصفى ساعاتك، وستكتشف أن بقية الأسبوع تسير خلفها منقادة. التأجيل لا يوفّر عليك طاقة، بل يقترضها منك بفائدة مركّبة.',\n                tools: [\n                    { d: 'التخطيط', i: 'notebook-pen', t: 'اكتب ثلاث نتائج فقط لهذا الأسبوع، لا ثلاثين مهمة. النتيجة تُقاس وتُغلق، والمهمة تُستهلك وتتكاثر.' },\n                    { d: 'التنفيذ', i: 'rocket', t: 'امنح أول تسعين دقيقة اليوم لأهم عمل عندك قبل أن تفتح أي رسالة. من يبدأ يومه ببريده يعمل ببقية يومه لا بأوله.' },\n                    { d: 'الحماية', i: 'shield', t: 'احجز موعدين مغلقين في أسبوعك باسم «عمل عميق»، وتعامل معهما كموعد مع أهم عميل. ما لا يُحجز يُسرق.' },\n                    { d: 'المراجعة', i: 'flag', t: 'حدّد الآن علامة نجاح واحدة تعرف بها يوم الجمعة أن أسبوعك نجح. الغموض هو ما يجعل الأسابيع تتشابه وتمضي بلا أثر.' }\n                ],\n                closing: 'أسبوع واحد مُتقَن يكفي ليغيّر اتجاه شهر كامل. ابدأ الآن وأنت في ذروة صفائك.'\n            },\n            {\n                icon: 'compass',\n                title: 'السرعة تأتي من الوضوح لا من العجلة',\n                text: 'معظم ما نسميه تأجيلاً هو في حقيقته غموض: مهمة غير معرّفة بدقة تستهلك في التفكير أضعاف ما تستهلكه في العمل. اكتب الخطوة التالية بفعلٍ واضح محدد، وستتحرك يدك قبل أن يتردد ذهنك.',\n                tools: [\n                    { d: 'الوضوح', i: 'crosshair', t: 'حوّل كل بند في قائمتك إلى فعل أمر صريح: «اكتب»، «اتصل»، «صمّم». البنود الاسمية الغامضة تبقى معلّقة إلى الأبد.' },\n                    { d: 'الطاقة', i: 'battery-charging', t: 'رتّب أسبوعك على منحنى طاقتك لا على ترتيب وصول المهام. المهمة الصعبة في وقت هبوطك تكلّفك ضعف الوقت وربع الجودة.' },\n                    { d: 'التركيز', i: 'focus', t: 'اجعل الصمت هو الأصل والإشعار هو الاستثناء. كل مقاطعة واحدة تكلّفك دقائق طويلة لتستعيد بها عمقك الذهني.' },\n                    { d: 'التقدّم', i: 'trending-up', t: 'أنهِ شيئاً واحداً كل يوم بالكامل. التقدّم المرئي أقوى وقود نفسي عرفه الإنسان، وأصدق من أي تحفيز خارجي.' }\n                ],\n                closing: 'لا تحتاج أسبوعاً مثالياً، بل أسبوعاً واضحاً. الوضوح وحده سيصنع لك نصف النتيجة.'\n            },\n            {\n                icon: 'layers',\n                title: 'أنت لا ترتفع إلى مستوى أهدافك، بل تهبط إلى مستوى أنظمتك',\n                text: 'الهدف يمنحك الاتجاه، لكن النظام هو ما يوصلك فعلاً. اسأل نفسك هذا الإثنين سؤالاً واحداً: ما النظام الصغير الذي إن ثبت هذا الأسبوع جعل النتيجة تحدث تلقائياً دون أن أصارع نفسي كل يوم؟',\n                tools: [\n                    { d: 'العادة', i: 'repeat', t: 'اربط العادة الجديدة بعادة قائمة: «بعد أن أشرب قهوتي، أفتح مشروعي عشرين دقيقة». الربط أقوى وأدوم من العزيمة.' },\n                    { d: 'التبسيط', i: 'scissors', t: 'اجعل بداية العمل تستغرق أقل من دقيقة: الملف مفتوح، الأدوات جاهزة، وأول سطر مكتوب من الأمس.' },\n                    { d: 'القياس', i: 'activity', t: 'قِس مؤشراً واحداً فقط هذا الأسبوع وتابعه يومياً. عشرة مؤشرات تعني عملياً صفر انتباه.' },\n                    { d: 'المرونة', i: 'heart-pulse', t: 'ضع خطة «الحد الأدنى» ليومك السيئ: عشر دقائق تكفي لحفظ السلسلة. الاستمرار المتواضع يهزم التوقف المثالي.' }\n                ],\n                closing: 'ابنِ النظام هذا الأسبوع ودع النتيجة تأتي في وقتها. الأنظمة تعمل حتى حين تفتر الحماسة.'\n            },\n            {\n                icon: 'radar',\n                title: 'ما يُقاس يتحسّن، وما يُراجَع يتضاعف',\n                text: 'الفارق بين من يتقدّم ومن يدور في مكانه ليس الجهد، بل التغذية الراجعة. أنت تملك الآن أرقام أسبوعك كاملة أمامك؛ ومن يقرأ أرقامه بصدق يكفيه شهر ليسبق من يعمل بلا مرآة سنة كاملة.',\n                tools: [\n                    { d: 'التحليل', i: 'pie-chart', t: 'اسأل «لماذا؟» ثلاث مرات متتالية حين يتعثر شيء. الإجابة الثالثة هي السبب الحقيقي في الغالب، والأولى مجرد عذر لائق.' },\n                    { d: 'التوثيق', i: 'folder-check', t: 'وثّق ما تنجزه أولاً بأول. الذاكرة تُجمّل وتُقلّل بحسب مزاجك، والسجل المكتوب وحده هو الذي ينصفك.' },\n                    { d: 'التحسين', i: 'trending-up', t: 'اختر عملية واحدة تكررها أسبوعياً وحسّنها بنسبة عشرة بالمئة فقط. التحسين المركّب يسبق الجهد المتفرّق بمراحل.' },\n                    { d: 'الحسم', i: 'check-circle', t: 'القرار المؤجَّل يستهلك طاقة يومية صامتة لا تشعر بها. احسم هذا الإثنين قراراً واحداً معلّقاً منذ أسابيع.' }\n                ],\n                closing: 'أرقامك ليست حكماً عليك، بل خريطة لك. اقرأها بهدوء، ثم تحرّك بثقة.'\n            },\n            {\n                icon: 'gem',\n                title: 'الإتقان عادة، لا لحظة إلهام',\n                text: 'الاحتراف أن تُسلّم بنفس المستوى في الأسبوع الذي لا تشعر فيه بشيء. المزاج ضيف عابر، والنظام صاحب البيت؛ فلا تسلّم مفاتيح أسبوعك كلّه لضيف لا تضمن حضوره.',\n                tools: [\n                    { d: 'الجودة', i: 'award', t: 'حدّد معيار «تم» قبل أن تبدأ. العمل بلا تعريف واضح للاكتمال إما يُهمَل مبكراً أو لا ينتهي أبداً.' },\n                    { d: 'التسليم', i: 'upload', t: 'أطلق نسخة ناقصة قليلاً اليوم بدل نسخة كاملة متأخرة شهراً. الواقع مرجع أصدق من رأسك، وأسرع في التصحيح.' },\n                    { d: 'التعلّم', i: 'graduation-cap', t: 'خصّص ساعتين أسبوعياً لمهارة تخدم دخلك أو أثرك مباشرة، وطبّقها فوراً في مشروع حقيقي لا في تمرين نظري.' },\n                    { d: 'الاستعادة', i: 'moon', t: 'اجعل نومك وتمرينك بندين في خطة الإنجاز لا خصماً منها. الجسد المُتعَب لا ينتج أفكاراً كبيرة مهما اجتهد.' }\n                ],\n                closing: 'لن يُذكر لك أسبوع تحمّست فيه، بل أسبوع أتقنت فيه. ابدأ من هذه اللحظة.'\n            }\n        ];\n\n        /* ---------- محرك القياس والتشخيص ---------- */\n\n        // نطاقات الإثنين: الأسبوع الماضي المكتمل، والأسبوع الذي قبله للمقارنة\n        function mondayRanges() {\n            const today = getTodayStr();\n            const curStart = getWeekStartStr(today);          // بداية الأسبوع الحالي (السبت)\n            const lastEnd = addDaysStr(curStart, -1);         // الجمعة المنقضية — آخر يوم في الأسبوع المكتمل\n            const lastStart = addDaysStr(curStart, -7);       // السبت قبل الماضي — أول يوم فيه\n            const prevEnd = addDaysStr(lastStart, -1);\n            const prevStart = addDaysStr(lastStart, -7);\n            return { today, curStart, lastStart, lastEnd, prevStart, prevEnd };\n        }\n\n        function mondayDelta(cur, prv) {\n            cur = Number(cur) || 0; prv = Number(prv) || 0;\n            if (prv === 0 && cur === 0) return { txt: 'بلا تغيير', dir: 0 };\n            if (prv === 0) return { txt: 'انطلاقة جديدة', dir: 1 };\n            const p = Math.round(((cur - prv) / prv) * 100);\n            if (p === 0) return { txt: 'ثابت', dir: 0 };\n            return { txt: (p > 0 ? '+' : '') + p + '%', dir: p > 0 ? 1 : -1, pct: p };\n        }\n\n        function mondayAnalyze() {\n            const R = mondayRanges();\n            const last = getRangeAchievements(R.lastStart, R.lastEnd);\n            const prev = getRangeAchievements(R.prevStart, R.prevEnd);\n\n            const days = [];\n            for (let i = 0; i < 7; i++) {\n                const ds = addDaysStr(R.lastStart, i);\n                days.push({ date: ds, name: dayNameOf(ds), mins: Math.round(last.dayMins[ds] || 0) });\n            }\n\n            // أطول انقطاع متصل داخل الأسبوع الماضي\n            let gap = 0, run = 0;\n            days.forEach(d => { if (d.mins <= 0) { run++; gap = Math.max(gap, run); } else run = 0; });\n\n            const best = days.reduce((a, b) => (b.mins > a.mins ? b : a), days[0]);\n            const avgSession = last.sessions ? last.mins / last.sessions : 0;\n            const domains = Object.keys(last.catMins).filter(k => (last.catMins[k] || 0) > 0);\n            const topShare = (last.mins > 0 && last.topCat) ? last.topCat[1] / last.mins : 0;\n\n            // مؤشر الأسبوع (من 100): استمرارية 30 · حجم 25 · عمق 20 · اتزان 15 · معرفة 10\n            const pillars = [\n                { k: 'الاستمرارية', v: Math.min(1, last.activeDays / 7), w: 30, icon: 'calendar-check' },\n                { k: 'حجم العمل', v: Math.min(1, last.mins / 600), w: 25, icon: 'clock' },\n                { k: 'عمق الجلسة', v: Math.min(1, avgSession / 45), w: 20, icon: 'hourglass' },\n                { k: 'اتزان المجالات', v: Math.min(1, domains.length / 3), w: 15, icon: 'radar' },\n                { k: 'المعرفة', v: Math.min(1, (last.pages + last.booksDone * 40) / 70), w: 10, icon: 'book-open' }\n            ];\n            const score = Math.round(pillars.reduce((s, p) => s + p.v * p.w, 0));\n\n            const allDomains = mondayAllDomains();\n            const domainRows = allDomains.map(d => {\n                const m = Math.round(last.catMins[d.k] || 0);\n                const pm = Math.round(prev.catMins[d.k] || 0);\n                return { d, m, pm, delta: mondayDelta(m, pm), share: last.mins > 0 ? m / last.mins : 0 };\n            }).sort((a, b) => b.m - a.m);\n            const weakest = domainRows.slice().sort((a, b) => a.m - b.m)[0];\n\n            return {\n                R, last, prev, days, gap, best, avgSession, domains, topShare, pillars, score, weakest, domainRows,\n                streak: calculateStreak(),\n                dMins: mondayDelta(last.mins, prev.mins),\n                dTasks: mondayDelta(last.tasks, prev.tasks),\n                dPages: mondayDelta(last.pages, prev.pages),\n                dDays: mondayDelta(last.activeDays, prev.activeDays),\n                dPoints: mondayDelta(last.points, prev.points),\n                dSessions: mondayDelta(last.sessions, prev.sessions),\n                empty: last.mins <= 0 && last.sessions <= 0 && last.tasks <= 0\n            };\n        }\n\n        function mondayRank(score) {\n            if (score >= 85) return { t: 'أسبوع استثنائي', c: '#10b981' };\n            if (score >= 70) return { t: 'أسبوع قوي', c: '#22d3ee' };\n            if (score >= 55) return { t: 'أسبوع متماسك', c: '#38bdf8' };\n            if (score >= 40) return { t: 'أسبوع متوسط', c: '#f59e0b' };\n            if (score >= 20) return { t: 'أسبوع متذبذب', c: '#fb923c' };\n            if (score > 0) return { t: 'أسبوع خافت', c: '#f43f5e' };\n            return { t: 'أسبوع صامت', c: '#64748b' };\n        }\n\n        function mondayVerdict(A) {\n            const s = A.score;\n            if (A.empty) return 'أسبوع بلا تسجيل ليس بالضرورة أسبوعاً بلا عمل — لكنه أسبوع بلا مرآة. ابدأ اليوم بتسجيل إنجاز واحد مهما بدا صغيراً؛ ما يُسجَّل يُدار، وما يُدار يتحسّن.';\n            if (s >= 85) return 'أنت في منطقة الأداء العالي. الخطر هنا ليس التراجع بل الإرهاق: ثبّت ما بنيته ولا تزد الحمل هذا الأسبوع، واستثمر الفائض في جودة المخرجات لا في كميتها.';\n            if (s >= 70) return 'إيقاعك قوي ومتماسك. أنت تحتاج تحسيناً واحداً دقيقاً لا خطة جديدة كاملة — اختر أضعف ركن في مؤشرك أدناه وارفعه وحده هذا الأسبوع.';\n            if (s >= 55) return 'أساسك سليم لكنه غير مستقر بعد. الثبات هنا أثمن من الزيادة: كرّر نفس الإيقاع أسبوعاً آخر دون أي إضافة، حتى يتحول من مجهود إلى عادة.';\n            if (s >= 40) return 'أنت تعمل فعلاً، لكن جهدك يتسرّب بين الأيام. المشكلة غالباً في التوزيع لا في الكمية — وزّع نفس الوقت على أيام أكثر وستشعر بقفزة دون أن تزيد دقيقة واحدة.';\n            if (s >= 20) return 'أسبوع متذبذب، وهذا طبيعي في فترات الضغط. لا تحاول التعويض بأسبوع بطولي؛ اختر التزاماً واحداً صغيراً جداً تضمن الوفاء به سبعة أيام متتالية، فالثقة تُبنى بالوفاء لا بالطموح.';\n            if (s > 0) return 'الأسبوع الماضي كان خافتاً، والاعتراف بذلك بلا جلد للذات هو أول خطوة صحيحة. ابدأ اليوم بثلاثين دقيقة فقط — البداية الصادقة الصغيرة تسبق النية الكبيرة المؤجَّلة.';\n            return 'لا شيء مسجّل، ولا شيء ضائع. أمامك أسبوع كامل نظيف؛ سجّل أول إنجاز اليوم وستجد أن الاستمرار أسهل بكثير من البداية.';\n        }\n\n\n        // نقطة دعم صادقة تُستخدم حين لا تُنتج البيانات أي نقطة قوة: الدعم لا يعني المجاملة،\n        // بل انتزاع الحقيقة الإيجابية الموجودة فعلاً في الرقم مهما كان صغيراً.\n        function mondayEncouragement(A) {\n            if (A.last.mins > 0) return {\n                tone: 'قوة', icon: 'sparkles', title: 'الخيط لم ينقطع',\n                text: `رغم ضعف الأسبوع سجّلت ${fmtDuration(A.last.mins)}. العودة من خيط رفيع أسهل بمراحل من البداية من الصفر — وهذا وحده يستحق أن تُكمل عليه اليوم.`,\n                w: 0\n            };\n            return {\n                tone: 'قوة', icon: 'sunrise', title: 'صفحة نظيفة أمامك',\n                text: 'لا شيء مسجّل يعني أيضاً لا شيء يثقلك. أمامك أسبوع كامل بلا تاريخ سيئ تحمله — ابدأ بإنجاز واحد اليوم وستتغير نبرة هذا التقرير الإثنين القادم.',\n                w: 0\n            };\n        }\n\n        // محرك الملاحظات: قواعد مرجّحة تُنتج قراءة صادقة ومحددة لأداء الأسبوع الماضي\n        function mondayInsights(A) {\n            const L = A.last, out = [];\n            const push = (tone, icon, title, text, w) => out.push({ tone, icon, title, text, w });\n\n            if (L.activeDays >= 6) push('قوة', 'flame', 'الاستمرارية صارت بنية', `حضرت ${L.activeDays} من سبعة أيام. هذا لم يعد حماساً عابراً بل نظاماً يعمل؛ مهمتك الآن حمايته لا زيادته.`, 95);\n            if (L.booksDone > 0) push('قوة', 'award', 'أغلقت كتاباً بالكامل', `أنهيت ${L.booksDone} كتاباً الأسبوع الماضي. الإنهاء مهارة مستقلة تماماً عن القراءة، وقليل من يتقنها.`, 92);\n            if (A.avgSession >= 45) push('قوة', 'hourglass', 'جلساتك عميقة', `متوسط جلستك ${fmtDuration(Math.round(A.avgSession))} — أنت تعمل بعمق لا بتشتت، وهذا أندر ما يملكه المنتجون اليوم.`, 90);\n            if (A.dMins.dir > 0 && A.dMins.pct >= 20) push('قوة', 'trending-up', 'منحنى صاعد بوضوح', `زمنك المركّز ارتفع ${A.dMins.pct}% عن الأسبوع الذي قبله. التصاعد الهادئ أثبت من القفزات المفاجئة.`, 88);\n            if (A.streak >= 14) push('قوة', 'shield-check', 'سلسلة تستحق الحماية', `سلسلتك الحالية ${mondayPluralDays(A.streak)} دون انقطاع. ما بُني في أسابيع يمكن أن يُهدم في يوم تهاون — ضع لنفسك حداً أدنى يومياً لا تنزل تحته أبداً.`, 85);\n            if (L.pages >= 70) push('قوة', 'book-open', 'المعرفة تتراكم', `${L.pages} صفحة الأسبوع الماضي. أثر القراءة لا يظهر في أسبوع، لكنه لا يُخطئ موعده بعد أشهر.`, 78);\n            if (A.domains.length >= 4) push('قوة', 'radar', 'اتزانك واسع', `وزّعت جهدك على ${A.domains.length} مجالات دون أن يسقط أحدها. التوازن أصعب من التركيز، وأنت تحققه.`, 76);\n\n            if (A.dMins.dir < 0 && A.dMins.pct <= -20) push('فرصة', 'alert-triangle', 'تراجع يستحق الانتباه', `انخفض زمنك ${Math.abs(A.dMins.pct)}% عن الأسبوع السابق. لا تَلُم نفسك، ابحث عن السبب البنيوي: ما الذي تغيّر فعلاً في جدولك أو طاقتك؟`, 96);\n            if (L.activeDays > 0 && L.activeDays <= 3) push('فرصة', 'calendar-check', 'التكرار قبل الكمية', `عدد أيام عملك الأسبوع الماضي: ${mondayPluralDays(L.activeDays)} فقط. أضف يوماً واحداً هذا الأسبوع — أربعة أيام تصنع إيقاعاً، ويومان يصنعان صدفة.`, 94);\n            if (A.gap >= 3) push('فرصة', 'alert-triangle', 'انقطاع متصل', `مرّت ${mondayPluralDays(A.gap)} متتالية بلا أي تسجيل. الانقطاع المتصل هو ما يكسر العادة فعلاً، لا اليوم الواحد المتفرق.`, 93);\n            if (L.sessions > 0 && A.avgSession < 20) push('فرصة', 'hourglass', 'جلساتك مجزّأة', `متوسط جلستك ${fmtDuration(Math.round(A.avgSession))}. الدخول والخروج المتكرر يستهلك طاقتك في التسخين لا في الإنتاج؛ اجعل حدك الأدنى خمساً وعشرين دقيقة متصلة.`, 91);\n            if (L.pages === 0 && L.mins > 0) push('فرصة', 'book-open', 'معرفتك توقفت هذا الأسبوع', 'لم تُسجّل صفحة واحدة بينما سجّلت وقتاً في مجالات أخرى. عشرون صفحة يومياً تصنع اثني عشر كتاباً في السنة بجهد لا يكاد يُذكر.', 86);\n            if (A.topShare >= 0.7 && A.domains.length > 1) push('ملاحظة', 'crown', 'تركيز شديد في مجال واحد', `${L.topCat ? mondayCatLabel(L.topCat[0]) : 'مجال واحد'} استحوذ على ${Math.round(A.topShare * 100)}% من وقتك. إن كان اختياراً واعياً فهو تميّز، وإن كان انجرافاً فهو خلل — احسمها بوعي هذا الأسبوع.`, 74);\n            if (L.tasks === 0 && L.mins > 0) push('ملاحظة', 'check-check', 'وقت بلا مخرجات معدودة', 'سجّلت وقتاً دون أي مهمة مكتملة. قِس نفسك بالمُخرَج الملموس لا بالساعة المنقضية؛ الساعة تمضي سواء أنتجت أم لا.', 72);\n            if (L.sessions > 0 && A.best && A.best.mins > 0) push('ملاحظة', 'sparkles', 'يومك الأقوى', `${A.best.name} كان أقوى أيامك بـ ${fmtDuration(A.best.mins)}. ابحث عن ظروف ذلك اليوم تحديداً وأعد إنتاجها عمداً، فالصدفة لا تتكرر بالتمني.`, 68);\n\n            out.sort((a, b) => b.w - a.w);\n            const strengths = out.filter(x => x.tone === 'قوة');\n            const others = out.filter(x => x.tone !== 'قوة');\n\n            // توازن التوجيه: لا تقرير يخلو من نقطة دعم، ولا تقرير يخلو من نقطة تطوير.\n            // فإن لم تُنتج البيانات أي قوة، نختم بنقطة دعم صادقة بدل أربع ملاحظات متتالية.\n            let picked;\n            if (!strengths.length) {\n                picked = others.slice(0, 3);\n                picked.push(mondayEncouragement(A));\n            } else if (!others.length) {\n                picked = strengths.slice(0, 4);\n            } else {\n                picked = out.slice(0, 4);\n                if (!picked.some(x => x.tone === 'قوة')) picked[picked.length - 1] = strengths[0];\n                else if (!picked.some(x => x.tone !== 'قوة')) picked[picked.length - 1] = others[0];\n            }\n            return picked;\n        }\n\n        // تعهدات رقمية مشتقة من أرقامك أنت، لا أهداف عامة\n        function mondayCommitments(A) {\n            const L = A.last;\n            const list = [];\n\n            const dTarget = L.activeDays === 0 ? 3 : (L.activeDays >= 6 ? 7 : L.activeDays + 1);\n            list.push({\n                icon: 'calendar-check', color: 'emerald', label: 'الأيام النشطة',\n                from: `${L.activeDays} من 7`, to: L.activeDays >= 7 ? 'تثبيت 7 من 7' : `${dTarget} من 7`,\n                text: L.activeDays >= 6 ? 'ثبّت حضورك كما هو تماماً. الحفاظ على القمة أصعب من بلوغها.' : 'يوم إضافي واحد فقط — لا تزد. الزيادة الصغيرة المضمونة تسبق القفزة غير المستدامة.'\n            });\n\n            const mTarget = L.mins === 0 ? 150 : Math.min(Math.max(Math.ceil((L.mins * 1.12) / 15) * 15, L.mins + 15), L.mins + 180);\n            list.push({\n                icon: 'clock', color: 'sky', label: 'الزمن المركّز',\n                from: fmtDuration(L.mins), to: fmtDuration(mTarget),\n                text: `زيادة محسوبة تعادل نحو ${fmtDuration(Math.max(1, Math.round((mTarget - L.mins) / 7)))} يومياً فقط — قابلة للتحقيق دون أن تقلب جدولك.`\n            });\n\n            const sTarget = Math.min(90, Math.max(30, Math.round((A.avgSession + 10) / 5) * 5));\n            list.push({\n                icon: 'hourglass', color: 'violet', label: 'عمق الجلسة الواحدة',\n                from: A.avgSession > 0 ? fmtDuration(Math.round(A.avgSession)) : 'لا جلسات',\n                to: fmtDuration(sTarget),\n                text: 'جلسة أطول بقليل تعني وقتاً أقل في التسخين ووقتاً أكثر في الإنتاج الحقيقي.'\n            });\n\n            if (A.weakest) {\n                list.push({\n                    icon: A.weakest.d.icon, color: 'amber', label: 'المجال الأقل نصيباً',\n                    from: `${A.weakest.d.label} · ${fmtDuration(A.weakest.m)}`, to: fmtDuration(90),\n                    text: 'ثلاث جلسات قصيرة تكفي. المجال المهمَل لا يحتاج بطولة، يحتاج موعداً ثابتاً في التقويم.'\n                });\n            }\n            return list;\n        }\n\n        /* ---------- العرض والتفاعل ---------- */\n\n        let mondayStepIdx = 0;\n        let mondayData = null;\n\n        function openMondayModal(manual) {\n            const m = document.getElementById('mondayModal');\n            if (!m) return;\n            mondayStepIdx = 0;\n            mondayData = mondayAnalyze();\n            const sub = document.getElementById('mondaySubtitle');\n            if (sub) sub.innerText = `حصاد الأسبوع الماضي · ${manual ? 'عرض يدوي' : 'انطلاقتك الأسبوعية'}`;\n            renderMondayStep();\n            m.classList.remove('hidden');\n            setTimeout(() => { m.classList.remove('opacity-0'); document.getElementById('mondayBox').classList.remove('scale-95'); }, 10);\n            if (!manual) localStorage.setItem('prod_monday_seen', getTodayStr());\n        }\n\n        function closeMondayModal() {\n            const m = document.getElementById('mondayModal');\n            if (!m) return;\n            m.classList.add('opacity-0');\n            document.getElementById('mondayBox').classList.add('scale-95');\n            setTimeout(() => m.classList.add('hidden'), 450);\n        }\n\n        function mondayStep(dir) {\n            const next = mondayStepIdx + dir;\n            if (next < 0) return;\n            if (next > 3) { closeMondayModal(); return; }\n            mondayStepIdx = next;\n            renderMondayStep();\n        }\n\n        function mondayDeltaBadge(d) {\n            if (!d) return '';\n            const cls = d.dir > 0 ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/25'\n                : d.dir < 0 ? 'text-rose-400 bg-rose-500/10 border-rose-500/25'\n                    : 'text-slate-400 bg-white/5 border-white/10';\n            const ic = d.dir > 0 ? '▲' : d.dir < 0 ? '▼' : '=';\n            return `<span class=\"shrink-0 text-[9px] font-black px-1.5 py-0.5 rounded-md border ${cls}\" title=\"مقارنة بالأسبوع الذي قبله\">${ic} ${d.txt}<\u002Fspan>`;\n        }\n\n        function renderMondayStep() {\n            const body = document.getElementById('mondayBody');\n            if (!body) return;\n            if (!mondayData) mondayData = mondayAnalyze();\n            const A = mondayData, L = A.last;\n            const wIdx = weekOfMonthIndex(getTodayStr());\n            const fuel = MONDAY_FUEL[wIdx % MONDAY_FUEL.length];\n            // المطلبان 3 و4: نفس محرك الشرح والنصيحة الذي تستخدمه وقفة الجمعة\n            setStatCtx('monday', L, A.prev, `الأسبوع الماضي المكتمل · ${toDMY(A.R.lastStart)} — ${toDMY(A.R.lastEnd)}`, 'الأسبوع الذي قبله');\n\n            if (mondayStepIdx === 0) {\n                const maxD = Math.max(1, ...A.days.map(d => d.mins));\n                const bars = A.days.map((d, i) => {\n                    const h = d.mins > 0 ? Math.max(6, Math.round((d.mins / maxD) * 100)) : 0;\n                    return `<div class=\"flex-1 min-w-0 flex flex-col items-center gap-1\">\n                        <span class=\"text-[8px] md:text-[9px] font-black ${d.mins > 0 ? 'text-amber-300' : 'text-slate-600'} whitespace-nowrap\">${d.mins > 0 ? formatDuration(d.mins) : '—'}<\u002Fspan>\n                        <div class=\"w-full h-16 md:h-28 mw-track rounded-lg border border-white/5 flex items-end overflow-hidden\">\n                            ${h ? `<div class=\"mw-bar w-full rounded-lg bg-gradient-to-t from-amber-500 to-emerald-400\" style=\"height:${h}%; animation-delay:${(i * 0.07).toFixed(2)}s\"><\u002Fdiv>` : ''}\n                        <\u002Fdiv>\n                        <span class=\"text-[8px] md:text-[9px] font-bold ${d.mins > 0 ? 'text-slate-300' : 'text-slate-600'} whitespace-nowrap\">${d.name.replace('ال', '')}<\u002Fspan>\n                    <\u002Fdiv>`;\n                }).join('');\n\n                body.innerHTML = `<div class=\"monday-slide-enter max-w-4xl mx-auto\">\n                    <div class=\"flex flex-wrap items-center gap-2 mb-2\">\n                        <span class=\"text-[10px] md:text-[11px] font-black text-amber-400 bg-amber-500/10 border border-amber-500/25 rounded-lg px-2.5 py-1\">الأسبوع الماضي المكتمل<\u002Fspan>\n                        <span class=\"text-[11px] md:text-xs text-slate-400\">${toDMY(A.R.lastStart)} — ${toDMY(A.R.lastEnd)} · من السبت إلى الجمعة<\u002Fspan>\n                    <\u002Fdiv>\n                    <h2 class=\"mw-h2 font-black text-white mb-2 leading-snug\">حصاد أسبوعك الذي انتهى<\u002Fh2>\n                    <p class=\"text-xs md:text-sm text-slate-400 mb-5 md:mb-7 leading-relaxed\" style=\"text-wrap:pretty\">هذه أرقام <b class=\"text-slate-200\">الأسبوع المنقضي كاملاً<\u002Fb> — لا الأسبوع الذي بدأ اليوم. الشارات الصغيرة تقارنها بالأسبوع الذي قبله، و<b class=\"text-slate-200\">الضغط على أي بطاقة<\u002Fb> يشرح ما تقيسه وماذا تعني نسبتها وكيف تستفيد منها.<\u002Fp>\n\n                    ${mwTiles(['mins', 'tasks', 'pages', 'activeDays', 'sessions', 'points'])}\n\n                    <div class=\"mt-3 md:mt-4 glass-panel rounded-2xl border border-white/10 p-3.5 md:p-4\">\n                        <div class=\"flex items-center justify-between gap-2 mb-3 flex-wrap\">\n                            <span class=\"flex items-center gap-2 text-[11px] md:text-xs font-bold text-slate-300\"><i data-lucide=\"bar-chart-3\" class=\"w-4 h-4 text-amber-400\"><\u002Fi> توزيع أيام الأسبوع الماضي<\u002Fspan>\n                            <span class=\"text-[10px] text-slate-500\">${A.gap > 0 ? `أطول انقطاع: ${mondayPluralDays(A.gap)}` : 'بلا انقطاع'}<\u002Fspan>\n                        <\u002Fdiv>\n                        <div class=\"flex items-end gap-1 md:gap-2\">${bars}<\u002Fdiv>\n                        <p class=\"text-[10px] md:text-[11px] text-slate-400 leading-relaxed mt-3 pt-3 border-t border-white/10\" style=\"text-wrap:pretty\">${A.best && A.best.mins > 0\n                            ? `<b class=\"text-amber-300\">نصيحة التوزيع:<\u002Fb> ${A.best.name} كان أقوى أيامك بـ ${fmtDuration(A.best.mins)}${A.gap >= 2 ? `، لكن ${mondayPluralDays(A.gap)} مرّت بلا تسجيل. وزّع نفس الوقت على أيام أكثر وستشعر بقفزة دون أن تزيد دقيقة واحدة.` : `. ابحث عن ظروف ذلك اليوم تحديداً وأعد إنتاجها عمداً، فالصدفة لا تتكرر بالتمني.`}`\n                            : '<b class=\"text-amber-300\">نصيحة التوزيع:<\u002Fb> لا أعمدة تُقرأ بعد. سجّل ثلاثة أيام هذا الأسبوع فقط، وسيتحول هذا الرسم إلى مرآة تُريك أين تذهب طاقتك فعلاً.'}<\u002Fp>\n                    <\u002Fdiv>\n\n                    ${L.topCat ? `<div class=\"mt-3 glass-panel rounded-2xl border border-white/10 px-4 py-3.5 flex items-start gap-3\">\n                        <span class=\"w-8 h-8 shrink-0 rounded-xl bg-amber-500/15 text-amber-300 border border-amber-400/25 flex items-center justify-center\"><i data-lucide=\"crown\" class=\"w-4 h-4\"><\u002Fi><\u002Fspan>\n                        <p class=\"text-xs md:text-sm text-slate-300\" style=\"text-wrap:pretty\">أكثر مجال استحوذ على تركيزك: <b class=\"text-white\">${mondayCatLabel(L.topCat[0])}<\u002Fb> بـ <b class=\"text-white\">${fmtDuration(L.topCat[1])}<\u002Fb> (${Math.round(A.topShare * 100)}% من وقتك)${L.booksDone ? ` · وأغلقت <b class=\"text-emerald-400\">${L.booksDone}<\u002Fb> كتاباً 🎉` : ''}<\u002Fp>\n                    <\u002Fdiv>` : `<div class=\"mt-3 glass-panel rounded-2xl border border-white/10 px-4 py-3.5 text-xs md:text-sm text-slate-400\" style=\"text-wrap:pretty\">لم يُسجَّل أي نشاط في الأسبوع الماضي. لا تجعل هذا حكماً على قدرتك — اجعله خط بداية نظيفاً لأسبوع بدأ للتو.<\u002Fdiv>`}\n\n                    ${mwDomainBoard(A.domainRows, L.mins, 'كل مجال على حدة — ونصيحته', 'مقارنة بالأسبوع الذي قبله')}\n\n                    ${mwHeroAdvice('أفضل نصيحة لحالتك الآن', mwTopAdvice(['activeDays', 'mins', 'sessions', 'tasks', 'pages']))}\n                <\u002Fdiv>`;\n\n            } else if (mondayStepIdx === 1) {\n                const rank = mondayRank(A.score);\n                const C = 326.73; // محيط الدائرة (2π × 52)\n                const offset = C - (C * Math.min(100, Math.max(0, A.score)) / 100);\n                const insights = mondayInsights(A);\n                const toneCls = { 'قوة': 'emerald', 'فرصة': 'amber', 'ملاحظة': 'sky' };\n                const weakPillar = A.pillars.slice().sort((a, b) => a.v - b.v)[0];\n\n                body.innerHTML = `<div class=\"monday-slide-enter max-w-4xl mx-auto\">\n                    <p class=\"text-[11px] md:text-xs text-amber-400 font-bold mb-2\">قراءة صادقة لأدائك<\u002Fp>\n                    <h2 class=\"mw-h2 font-black text-white mb-2 leading-snug\">ماذا تقول أرقامك فعلاً؟<\u002Fh2>\n                    <p class=\"text-xs md:text-sm text-slate-400 mb-5 leading-relaxed\" style=\"text-wrap:pretty\">مؤشر واحد يلخّص أسبوعك الماضي عبر خمسة أركان، ثم ملاحظات محددة مستخرجة من بياناتك أنت — لا نصائح عامة.<\u002Fp>\n\n                    <div class=\"glass-panel rounded-3xl border border-white/10 p-4 md:p-6 flex flex-col md:flex-row items-center gap-4 md:gap-7\">\n                        <div class=\"relative shrink-0\">\n                            <svg viewBox=\"0 0 120 120\" class=\"mw-ring w-24 h-24 md:w-32 md:h-32 -rotate-90\">\n                                <circle cx=\"60\" cy=\"60\" r=\"52\" fill=\"none\" stroke=\"rgba(148,163,184,.18)\" stroke-width=\"10\"><\u002Fcircle>\n                                <circle id=\"mwRingArc\" cx=\"60\" cy=\"60\" r=\"52\" fill=\"none\" stroke=\"${rank.c}\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-dasharray=\"${C}\" stroke-dashoffset=\"${C}\"><\u002Fcircle>\n                            <\u002Fsvg>\n                            <div class=\"absolute inset-0 flex flex-col items-center justify-center\">\n                                <span class=\"text-3xl md:text-4xl font-black text-white leading-none\">${A.score}<\u002Fspan>\n                                <span class=\"text-[9px] font-bold text-slate-500 mt-0.5\">من 100<\u002Fspan>\n                            <\u002Fdiv>\n                        <\u002Fdiv>\n                        <div class=\"min-w-0 flex-1 text-center md:text-right\">\n                            <span class=\"inline-block text-[11px] font-black px-2.5 py-1 rounded-lg mb-2\" style=\"color:${ink(rank.c)};background:${rank.c}1f;border:1px solid ${rank.c}4d\">${rank.t}<\u002Fspan>\n                            <p class=\"text-xs md:text-sm text-slate-300 leading-relaxed\" style=\"text-wrap:pretty\">${mondayVerdict(A)}<\u002Fp>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n\n                    <div class=\"grid grid-cols-2 md:grid-cols-5 gap-2 mt-3\">\n                        ${A.pillars.map(p => {\n                            const pv = Math.round(p.v * 100);\n                            return `<div class=\"glass-panel rounded-2xl border ${p === weakPillar ? 'border-amber-500/40' : 'border-white/10'} px-3 py-2.5\">\n                                <div class=\"flex items-center gap-1.5 mb-1.5 text-slate-400\"><i data-lucide=\"${p.icon}\" class=\"w-3.5 h-3.5 shrink-0\"><\u002Fi><span class=\"text-[10px] font-bold leading-tight\">${p.k}<\u002Fspan><\u002Fdiv>\n                                <div class=\"h-1.5 mw-track rounded-full overflow-hidden\"><div class=\"h-full rounded-full\" style=\"width:${pv}%;background:${rank.c}\"><\u002Fdiv><\u002Fdiv>\n                                <span class=\"text-[9px] font-black text-slate-500 mt-1 block\">${pv}% · وزنه ${p.w}<\u002Fspan>\n                            <\u002Fdiv>`;\n                        }).join('')}\n                    <\u002Fdiv>\n\n                    ${mwHeroAdvice('نصيحة الركن الأضعف في مؤشرك', mondayPillarAdvice(weakPillar, A))}\n\n                    <div class=\"grid grid-cols-1 md:grid-cols-2 gap-2.5 md:gap-3 mt-4 monday-stagger\">\n                        ${insights.length ? insights.map(n => `<div class=\"glass-panel rounded-2xl border border-${toneCls[n.tone]}-500/20 p-4 flex items-start gap-3\">\n                            <span class=\"w-9 h-9 shrink-0 rounded-xl bg-${toneCls[n.tone]}-500/15 text-${toneCls[n.tone]}-300 border border-${toneCls[n.tone]}-400/25 flex items-center justify-center\"><i data-lucide=\"${n.icon}\" class=\"w-4 h-4\"><\u002Fi><\u002Fspan>\n                            <div class=\"min-w-0\">\n                                <div class=\"flex items-center gap-2 flex-wrap\">\n                                    <span class=\"text-[9px] font-black px-1.5 py-0.5 rounded-md bg-${toneCls[n.tone]}-500/10 text-${toneCls[n.tone]}-300 border border-${toneCls[n.tone]}-500/25\">${n.tone}<\u002Fspan>\n                                    <span class=\"text-xs font-black text-white\">${n.title}<\u002Fspan>\n                                <\u002Fdiv>\n                                <p class=\"text-[11px] md:text-xs text-slate-300 leading-relaxed mt-1.5\" style=\"text-wrap:pretty\">${n.text}<\u002Fp>\n                            <\u002Fdiv>\n                        <\u002Fdiv>`).join('') : `<div class=\"md:col-span-2 glass-panel rounded-2xl border border-white/10 p-4 text-xs text-slate-400 leading-relaxed\" style=\"text-wrap:pretty\">لا توجد بيانات كافية لاستخراج ملاحظات دقيقة عن الأسبوع الماضي. سجّل نشاطك هذا الأسبوع، وسيصير هذا القسم مرآتك الحقيقية يوم الإثنين القادم.<\u002Fdiv>`}\n                <\u002Fdiv>`;\n                setTimeout(() => { const arc = document.getElementById('mwRingArc'); if (arc) arc.setAttribute('stroke-dashoffset', String(offset)); }, 120);\n\n            } else if (mondayStepIdx === 2) {\n                const cms = mondayCommitments(A);\n                const firstTask = A.weakest && A.weakest.m <= 0\n                    ? `افتح «${A.weakest.d.label}» الآن وامنحه ٢٥ دقيقة متصلة قبل أي شيء آخر. المجال الذي لم يأخذ دقيقة واحدة الأسبوع الماضي هو أسرع مكان لتشعر فيه بفارق حقيقي.`\n                    : (L.mins > 0\n                        ? `ابدأ اليوم بأصعب مهمة عندك ولو لخمس وعشرين دقيقة فقط. إنجاز الإثنين المبكر يصنع زخماً يحمل بقية أسبوعك.`\n                        : `سجّل أول نشاط لك اليوم مهما كان صغيراً. أول تسجيل في الأسبوع هو أصعب خطوة، وما بعده انحدار سهل.`);\n\n                body.innerHTML = `<div class=\"monday-slide-enter max-w-4xl mx-auto\">\n                    <p class=\"text-[11px] md:text-xs text-emerald-400 font-bold mb-2\">أسبوعك الذي بدأ للتو<\u002Fp>\n                    <h2 class=\"mw-h2 font-black text-white mb-2 leading-snug\">تعهدات محسوبة من أرقامك أنت<\u002Fh2>\n                    <p class=\"text-xs md:text-sm text-slate-400 mb-5 leading-relaxed\" style=\"text-wrap:pretty\">ليست أهدافاً عامة، بل أرقاماً مشتقة من أدائك الفعلي الأسبوع الماضي ومضبوطة لتكون أعلى منه بقدر تستطيع الوفاء به. اختر منها ما تلتزم به بصدق — وتجاهل الباقي بلا ذنب.<\u002Fp>\n\n                    <div class=\"grid grid-cols-1 md:grid-cols-2 gap-2.5 md:gap-3 monday-stagger\">\n                        ${cms.map(c => `<div class=\"glass-panel rounded-2xl border border-${c.color}-500/25 p-4\">\n                            <div class=\"flex items-center gap-2 mb-3 text-${c.color}-400\">\n                                <span class=\"w-8 h-8 shrink-0 rounded-xl bg-${c.color}-500/15 border border-${c.color}-400/25 flex items-center justify-center\"><i data-lucide=\"${c.icon}\" class=\"w-4 h-4\"><\u002Fi><\u002Fspan>\n                                <span class=\"text-xs font-black leading-tight\">${c.label}<\u002Fspan>\n                            <\u002Fdiv>\n                            <div class=\"flex items-center gap-2 mb-2.5 flex-wrap\">\n                                <span class=\"text-[11px] font-bold text-slate-500\">${c.from}<\u002Fspan>\n                                <span class=\"text-slate-600 shrink-0\">←<\u002Fspan>\n                                <span class=\"text-sm md:text-base font-black text-white\">${c.to}<\u002Fspan>\n                            <\u002Fdiv>\n                            <p class=\"text-[11px] text-slate-400 leading-relaxed\" style=\"text-wrap:pretty\">${c.text}<\u002Fp>\n                        <\u002Fdiv>`).join('')}\n                    <\u002Fdiv>\n\n                    <div class=\"mt-4 rounded-2xl border border-amber-500/30 p-4 md:p-5\" style=\"background:rgba(245,158,11,.07)\">\n                        <div class=\"flex items-center gap-2 mb-2 text-amber-300 flex-wrap\"><i data-lucide=\"rocket\" class=\"w-4 h-4 shrink-0\"><\u002Fi><span class=\"text-[11px] font-black\">مهمة الإثنين الأولى — ابدأ بها قبل أن تغلق هذه النافذة<\u002Fspan><\u002Fdiv>\n                        <p class=\"text-xs md:text-sm text-slate-200 leading-relaxed\" style=\"text-wrap:pretty\">${firstTask}<\u002Fp>\n                    <\u002Fdiv>\n\n                    ${A.weakest ? mwHeroAdvice('نصيحة المجال الأقل نصيباً', mwDomainAdvice(A.weakest, L.mins)) : ''}\n                <\u002Fdiv>`;\n\n            } else {\n                body.innerHTML = `<div class=\"monday-slide-enter max-w-4xl mx-auto\">\n                    <div class=\"text-center mb-6 md:mb-9\">\n                        <div class=\"w-14 h-14 md:w-20 md:h-20 mx-auto rounded-3xl bg-gradient-to-tr from-amber-500/20 to-emerald-500/20 border border-amber-400/30 text-amber-300 flex items-center justify-center mb-4\"><i data-lucide=\"${fuel.icon}\" class=\"w-7 h-7 md:w-10 md:h-10\"><\u002Fi><\u002Fdiv>\n                        <p class=\"text-[11px] md:text-xs text-amber-400 font-bold mb-2\">وقود الانطلاق · الأسبوع ${wIdx + 1} من الشهر<\u002Fp>\n                        <h2 class=\"mw-h2 font-black text-white mb-3 leading-snug\">${fuel.title}<\u002Fh2>\n                        <p class=\"text-sm md:text-base text-slate-300 leading-relaxed max-w-3xl mx-auto\" style=\"text-wrap:pretty\">${fuel.text}<\u002Fp>\n                    <\u002Fdiv>\n\n                    <div class=\"grid grid-cols-1 md:grid-cols-2 gap-2.5 md:gap-3 monday-stagger\">\n                        ${fuel.tools.map(t => `<div class=\"glass-panel rounded-2xl border border-white/10 p-4 flex items-start gap-3\">\n                            <span class=\"w-9 h-9 shrink-0 rounded-xl bg-emerald-500/15 text-emerald-300 border border-emerald-400/25 flex items-center justify-center\"><i data-lucide=\"${t.i}\" class=\"w-4 h-4\"><\u002Fi><\u002Fspan>\n                            <div class=\"min-w-0\">\n                                <span class=\"text-[10px] font-black text-emerald-300 tracking-wide\">${t.d}<\u002Fspan>\n                                <p class=\"text-xs md:text-sm text-slate-200 leading-relaxed mt-1\" style=\"text-wrap:pretty\">${t.t}<\u002Fp>\n                            <\u002Fdiv>\n                        <\u002Fdiv>`).join('')}\n                    <\u002Fdiv>\n\n                    ${mwHeroAdvice('وأفضل نصيحة لحالتك أنت قبل أن تبدأ', mwTopAdvice(['activeDays', 'mins', 'sessions', 'points', 'streak']))}\n\n                    <div class=\"mt-4 glass-panel rounded-2xl border border-amber-500/25 p-4 md:p-5 text-center\">\n                        <p class=\"text-sm md:text-base font-bold text-white leading-relaxed\" style=\"text-wrap:pretty\">${fuel.closing}<\u002Fp>\n                        <p class=\"text-[11px] text-slate-500 mt-3 leading-relaxed\">سلسلتك الحالية ${mondayPluralDays(A.streak)} · ${L.sessions ? `الأسبوع الماضي ${mondayPluralSessions(L.sessions)} بإجمالي ${fmtDuration(L.mins)}` : 'الأسبوع الماضي بلا نشاط مسجّل'} · مؤشر الأسبوع ${A.score}/100<\u002Fp>\n                    <\u002Fdiv>\n                <\u002Fdiv>`;\n            }\n\n            const dots = document.getElementById('mondayDots');\n            if (dots) dots.innerHTML = [0, 1, 2, 3].map(i => `<span class=\"h-1.5 rounded-full transition-all duration-500 ${i === mondayStepIdx ? 'w-7 bg-amber-400' : 'w-1.5 bg-slate-600'}\"><\u002Fspan>`).join('');\n            const counter = document.getElementById('mondayCounter');\n            if (counter) counter.textContent = `${mondayStepIdx + 1} من 4`;\n            const prev = document.getElementById('mondayPrevBtn');\n            const next = document.getElementById('mondayNextBtn');\n            if (prev) prev.style.visibility = mondayStepIdx === 0 ? 'hidden' : 'visible';\n            if (next) next.innerText = mondayStepIdx === 3 ? 'لننطلق' : 'التالي';\n            mwResetScroll('mondayBody');\n            bindWindowSwipe('mondayBody', mondayStep);\n            safeCreateIcons();\n        }\n\n        // نصيحة مخصّصة لكل ركن من أركان مؤشر الأسبوع الخمسة\n        function mondayPillarAdvice(p, A) {\n            if (!p) return { t: 'فرصة', x: 'سجّل نشاطك هذا الأسبوع ليصير لمؤشرك معنى.' };\n            const pv = Math.round(p.v * 100);\n            const strong = pv >= 80;\n            const map = {\n                'الاستمرارية': strong\n                    ? 'ركن الاستمرارية شبه مكتمل عندك، وهو أثقل الأركان وزناً (30 من 100). احمِ هذا الحضور بحدٍّ أدنى يومي لا تنزل تحته مهما ضغط يومك.'\n                    : `الاستمرارية هي أثقل أركان مؤشرك (30 من 100) وأنت عند ${pv}% منها. أسرع نقطة تكسبها ليست ساعات إضافية بل يوماً نشطاً إضافياً — ولو بعشر دقائق.`,\n                'حجم العمل': strong\n                    ? 'حجم عملك عالٍ. لا تزد عليه؛ وجّه الفائض إلى جودة المخرجات، فالزيادة بعد هذا الحد تشتري إرهاقاً لا نتيجة.'\n                    : `حجم عملك عند ${pv}% من السقف المرجعي (10 ساعات أسبوعياً). لا تقفز إليه دفعة واحدة — أضف نصف ساعة في ثلاثة أيام فقط وستتحرك النسبة بوضوح.`,\n                'عمق الجلسة': strong\n                    ? 'جلساتك عميقة، وهذا أندر ما يملكه المنتجون. احمِ هذا العمق بإغلاق الإشعارات، فمقاطعة واحدة تكلّفك دقائق طويلة لتستعيد تركيزك.'\n                    : `عمق جلستك عند ${pv}%. المرجع 45 دقيقة متصلة؛ ارفع حدك الأدنى إلى 25 دقيقة أولاً، فالدخول والخروج المتكرر يستهلك طاقتك في التسخين لا في الإنتاج.`,\n                'اتزان المجالات': strong\n                    ? 'اتزانك واسع وأنت توزّع جهدك دون أن يسقط مجال. التوازن أصعب من التركيز، فحافظ عليه بموعد ثابت لكل مجال.'\n                    : `اتزانك عند ${pv}%. المرجع ثلاثة مجالات نشطة أسبوعياً؛ أعطِ مجالاً مهمَلاً جلسة قصيرة واحدة وسترتفع النسبة فوراً دون أن تُنقص من غيره.`,\n                'المعرفة': strong\n                    ? 'ركن المعرفة قوي. حوّله إلى أثر: لخّص ما قرأته في صفحة واحدة، فالقراءة بلا تلخيص تتبخّر.'\n                    : `ركن المعرفة عند ${pv}%. المرجع 70 صفحة أسبوعياً (أو كتاب مكتمل)؛ عشر صفحات يومية تكفي لتقفز هذه النسبة دون أن تشعر بثقلها.`\n            };\n            return { t: strong ? 'قوة' : 'فرصة', x: map[p.k] || 'واصل على إيقاعك الحالي.' };\n        }\n\n        function maybeShowMondayWindow() {\n            const today = getTodayStr();\n            if (parseLocalDate(today).getDay() !== 1) return; // الإثنين فقط\n            if (localStorage.getItem('prod_monday_seen') === today) return;\n            // لا نزاحم نافذة الجمعة أبداً (يوماهما مختلفان)، ونمنح الواجهة وقتاً لتستقر\n            setTimeout(() => openMondayModal(false), 1400);\n        }\n\n        /* ============ المطلبان 3 و4: محرك تفسير المؤشرات والنصيحة ============\n           كل رقم يظهر في وقفة الجمعة أو انطلاقة الإثنين صار قابلاً للضغط، ويفتح بطاقة\n           تشرح: ما هذا الرقم؟ كيف يُحسب بالضبط؟ ماذا تعني النسبة المئوية بجانبه؟ كيف\n           أستفيد منه؟ ثم أفضل نصيحة لحالتك أنت الآن — مشتقّة من قيمتك الفعلية لا من قالب.\n\n           المصدر واحد لكلتا النافذتين، فلا يختلف تعريف «الزمن المركّز» بين شاشة وأخرى. */\n\n        // فارق مع حفظ الطرفين، حتى يتمكّن الشرح من ذكر الرقمين لا النسبة وحدها\n        function mwDelta(cur, prv) {\n            const d = mondayDelta(cur, prv);\n            d.cur = Number(cur) || 0;\n            d.prv = Number(prv) || 0;\n            return d;\n        }\n\n        function mwTone(t) {\n            return t === 'قوة' ? { c: 'emerald', i: 'check-circle' }\n                : t === 'تنبيه' ? { c: 'rose', i: 'alert-triangle' }\n                    : { c: 'amber', i: 'lightbulb' };\n        }\n\n        const MW_METRICS = {\n            mins: {\n                label: 'زمن العمل المركّز', icon: 'clock', color: 'amber',\n                unit: 'وقت',\n                val: s => fmtDuration(s.mins), raw: s => s.mins,\n                what: 'مجموع الدقائق التي سجّلتها فعلاً في كل مجالاتك خلال الفترة — العمل المُوثَّق وحده، لا الوقت الذي مرّ عليك.',\n                how: 'تُجمع دقائق كل سجلات الأنشطة (بما فيها مجالاتك الخاصة) مع دقائق كل سجلات القراءة الواقعة داخل الفترة، ثم تُعرض بصيغة ساعات ودقائق.',\n                use: 'هذا رأس مالك الحقيقي وأصدق مؤشر على جدّيتك. لا تقارنه بأحد، قارنه بنفسك الأسبوع الماضي: الاتجاه أهم من الرقم المطلق.',\n                advice(c) {\n                    const m = c.v, d = c.d;\n                    if (m <= 0) return { t: 'تنبيه', x: 'لا وقت مسجّلاً في هذه الفترة. لا تبدأ بخطة كبيرة — سجّل جلسة واحدة مدتها ٢٥ دقيقة اليوم، فالرقم الأول هو أصعب رقم، وما بعده يجري وحده.' };\n                    if (d.dir < 0 && d.pct <= -25) return { t: 'تنبيه', x: `زمنك نزل ${Math.abs(d.pct)}% (من ${fmtDuration(d.prv)} إلى ${fmtDuration(d.cur)}). قبل أن تلوم نفسك ابحث عن السبب البنيوي: ما الذي تغيّر في جدولك؟ أعد أحد المواعيد الثابتة التي كانت تعمل، ولا تحاول استعادة الفارق كله دفعة واحدة.` };\n                    if (m < 180) return { t: 'فرصة', x: `${fmtDuration(m)} بداية حقيقية لكنها ما تزال تحت عتبة التراكم. استهدف ${fmtDuration(Math.max(240, m + 90))} بزيادة نصف ساعة في ثلاثة أيام فقط — زيادة لا تُشعِرك بثقل ويُشعرك أثرُها.` };\n                    if (m < 420) return { t: 'فرصة', x: `أنت في المنطقة المتوسطة. المكسب الأكبر الآن ليس في إضافة ساعات، بل في حماية ساعة واحدة يومية بلا مقاطعة — الساعة المحمية تنتج ضعف ثلاث ساعات مبعثرة.` };\n                    if (m < 720) return { t: 'قوة', x: `${fmtDuration(m)} حجم عمل قوي ومتماسك. ثبّته أسبوعاً آخر دون زيادة، ووجّه انتباهك إلى جودة المخرجات بدل كمية الساعات — هنا يبدأ الفرق الحقيقي.` };\n                    return { t: 'قوة', x: `${fmtDuration(m)} رقم عالٍ جداً. الخطر الآن ليس التراجع بل الإرهاق: احجز يوم استعادة كاملاً هذا الأسبوع، فالراحة المخطط لها جزء من الخطة لا خروجاً عنها.` };\n                }\n            },\n\n            tasks: {\n                label: 'مهمة مكتملة', icon: 'check-check', color: 'emerald',\n                unit: 'مهمة',\n                val: s => s.tasks, raw: s => s.tasks,\n                what: 'عدد المخرجات الملموسة التي أغلقتها فعلاً — لا ما بدأته ولا ما نويته.',\n                how: 'تُجمع قيمة «المهام/المخرجات» من كل سجل نشاط، ويُحتسب كل سجل قراءة بمهمة واحدة لأنه إنجاز مكتمل بذاته.',\n                use: 'الوقت يمضي سواء أنتجت أم لا، والمهمة المغلقة هي ما يبقى. إن ارتفع وقتك وثبت هذا الرقم فمشكلتك في الإغلاق لا في الجهد.',\n                advice(c) {\n                    const t = c.v, mins = c.s.mins;\n                    if (t <= 0 && mins > 0) return { t: 'تنبيه', x: 'سجّلت وقتاً دون أي مهمة مغلقة. عرّف «تم» قبل أن تبدأ أي جلسة، وأنهِ شيئاً واحداً بالكامل كل يوم — التقدّم المرئي أقوى وقود نفسي عرفه الإنسان.' };\n                    if (t <= 0) return { t: 'فرصة', x: 'لا مهام مغلقة بعد. اختر أصغر مهمة في قائمتك وأغلقها اليوم؛ الإغلاق الأول يكسر الجمود أكثر من أي تحفيز.' };\n                    if (mins > 0 && (mins / t) > 150) return { t: 'فرصة', x: `كل مهمة تكلّفك نحو ${fmtDuration(Math.round(mins / t))} وسطياً. جزّئ مهامك إلى وحدات أصغر تُغلق في جلسة واحدة — المهمة التي لا تُغلق في جلسة تتحوّل إلى عبء مؤجَّل.` };\n                    if (c.d.dir > 0) return { t: 'قوة', x: `أغلقت ${t} مهمة، بارتفاع عن الفترة السابقة. حافظ على معيار الجودة نفسه وأنت ترفع العدد، فالسرعة بلا معيار تُنتج عملاً يُعاد.` };\n                    return { t: 'قوة', x: `${t} مهمة مغلقة إيقاع محترم. وثّق ما أنجزته أولاً بأول — الأثر غير الموثَّق يضيع كأنه لم يكن، وأنت ستحتاجه لاحقاً.` };\n                }\n            },\n\n            pages: {\n                label: 'صفحات مقروءة', icon: 'book-open', color: 'violet',\n                unit: 'صفحة',\n                val: s => s.pages + ' صفحة', raw: s => s.pages,\n                what: 'مجموع الصفحات التي سجّلتها في مكتبة القراءة خلال الفترة.',\n                how: 'تُجمع «الصفحات المقروءة» من كل سجل قراءة داخل النطاق. الكتاب المكتمل يُحتسب في مؤشر منفصل.',\n                use: 'القراءة هي المجال الوحيد الذي يغذّي بقية مجالاتك. عشرون صفحة يومياً تعني اثني عشر كتاباً في السنة بجهد لا يكاد يُذكر.',\n                advice(c) {\n                    const p = c.v;\n                    if (p <= 0 && c.s.mins > 0) return { t: 'تنبيه', x: 'وقتك ذهب كله إلى مجالات أخرى ولم تُسجَّل صفحة واحدة. اربط القراءة بعادة قائمة: «بعد صلاة الفجر عشر صفحات» — الربط أدوم من العزيمة.' };\n                    if (p <= 0) return { t: 'فرصة', x: 'لا قراءة في هذه الفترة. ابدأ بخمس صفحات فقط اليوم؛ الهدف الصغير المضمون يبني السلسلة، والهدف الكبير يكسرها في أول يوم ضاغط.' };\n                    if (p < 40) return { t: 'فرصة', x: `${p} صفحة بداية. ارفعها إلى ${Math.max(70, p + 30)} بزيادة خمس صفحات يومياً فقط — لن تشعر بالفارق في يومك، وستشعر به بعد شهر.` };\n                    if (p < 120) return { t: 'قوة', x: `${p} صفحة إيقاع معرفي سليم. اجعل لكل كتاب صفحة تلخيص بخط يدك؛ ما لا تستطيع تلخيصه لم تفهمه بعد.` };\n                    return { t: 'قوة', x: `${p} صفحة رقم ممتاز. الخطر هنا هو الجمع بلا تطبيق — اختر فكرة واحدة فقط من قراءتك وطبّقها هذا الأسبوع.` };\n                }\n            },\n\n            activeDays: {\n                label: 'أيام نشطة', icon: 'calendar-check', color: 'sky',\n                unit: 'يوم',\n                val: s => s.activeDays + ' من 7', raw: s => s.activeDays,\n                what: 'عدد الأيام التي سجّلت فيها نشاطاً واحداً على الأقل، من أصل سبعة أيام في الأسبوع (من السبت إلى الجمعة).',\n                how: 'تُجمع التواريخ المميّزة من سجلات الأنشطة والقراءة معاً داخل الفترة، ويُحتسب اليوم مرة واحدة مهما تعدّدت جلساته.',\n                use: 'هذا أهم مؤشر في النظام كله ويحمل أعلى وزن في مؤشر الأسبوع. الانتظام يهزم الشدّة دائماً: أربعة أيام متوسطة أنفع من يومين بطوليين.',\n                advice(c) {\n                    const d = c.v;\n                    if (d === 0) return { t: 'تنبيه', x: 'لا يوم نشطاً واحداً. لا تستهدف سبعة أيام الآن — استهدف ثلاثة فقط، وحدّد لها ساعة ثابتة في اليوم. الثقة تُبنى بالوفاء لا بالطموح.' };\n                    if (d <= 2) return { t: 'تنبيه', x: `${mondayPluralDays(d)} فقط. يومان يصنعان صدفة، وأربعة تصنع إيقاعاً. أضف يوماً واحداً هذا الأسبوع ولا تزد — الزيادة الصغيرة المضمونة تسبق القفزة غير المستدامة.` };\n                    if (d <= 4) return { t: 'فرصة', x: `${mondayPluralDays(d)} من سبعة. أنت على بُعد يوم واحد من تحويل هذا إلى نظام. اختر أضعف أيامك وضع فيه حدّاً أدنى لا تنزل تحته: عشر دقائق تكفي لحفظ السلسلة.` };\n                    if (d <= 6) return { t: 'قوة', x: `${mondayPluralDays(d)} حضوراً قوياً. لا تزد الحمل — ثبّت هذا الإيقاع أسبوعاً آخر حتى يتحوّل من مجهود واعٍ إلى عادة تلقائية.` };\n                    return { t: 'قوة', x: 'حضور كامل سبعة من سبعة. احرص على أن يكون أحد الأيام يوم استعادة خفيفاً لا يوم توقف — الاستمرار بلا راحة مخطط لها ينتهي بانقطاع مفاجئ.' };\n                }\n            },\n\n            sessions: {\n                label: 'جلسة مسجّلة', icon: 'timer', color: 'rose',\n                unit: 'جلسة',\n                val: s => s.sessions, raw: s => s.sessions,\n                what: 'عدد مرات الجلوس للعمل التي وثّقتها — كل سجل نشاط أو قراءة يُعدّ جلسة واحدة.',\n                how: 'يُحسب عدد سجلات الأنشطة مضافاً إليه عدد سجلات القراءة داخل الفترة.',\n                use: 'وحده لا يقول شيئاً؛ قيمته في قسمة الزمن عليه. عدد جلسات كبير مع زمن صغير يعني تشتتاً، والعكس يعني عمقاً.',\n                advice(c) {\n                    const n = c.v, avg = n ? c.s.mins / n : 0;\n                    if (n <= 0) return { t: 'فرصة', x: 'لا جلسات مسجّلة. افتح المؤقت الآن واعمل خمساً وعشرين دقيقة متصلة — التسجيل نفسه يغيّر سلوكك لأن ما يُقاس يتحسّن.' };\n                    if (avg > 0 && avg < 20) return { t: 'تنبيه', x: `${n} جلسة بمتوسط ${fmtDuration(Math.round(avg))} فقط. الدخول والخروج المتكرر يستهلك طاقتك في التسخين لا في الإنتاج؛ اجعل حدك الأدنى خمساً وعشرين دقيقة متصلة.` };\n                    if (avg >= 45) return { t: 'قوة', x: `${n} جلسة بمتوسط ${fmtDuration(Math.round(avg))} — أنت تعمل بعمق لا بتشتت، وهذا أندر ما يملكه المنتجون اليوم. احمِ هذه الجلسات من أي إشعار.` };\n                    return { t: 'فرصة', x: `${n} جلسة بمتوسط ${fmtDuration(Math.round(avg))}. ارفع المتوسط عشر دقائق فقط دون زيادة عدد الجلسات؛ ستكسب وقت إنتاج صافياً بلا أي إضافة على جدولك.` };\n                }\n            },\n\n            points: {\n                label: 'نقطة إنجاز', icon: 'zap', color: 'cyan',\n                unit: 'نقطة',\n                val: s => s.points, raw: s => s.points,\n                what: 'رقم واحد يدمج الوقت والمخرجات معاً، ليمنحك مقارنة عادلة بين أسبوع طويل الساعات وأسبوع كثير الإنجازات.',\n                how: 'نقطة لكل عشر دقائق عمل، وخمس نقاط لكل مهمة مكتملة. المعادلة تُكافئ الإغلاق أكثر من مجرد قضاء الوقت.',\n                use: 'استخدمه للمقارنة بين أسابيعك فقط، لا كهدف بذاته. ارتفاعه مع ثبات ساعاتك يعني أنك صرت تُغلق أكثر بنفس الجهد — وهذا هو التحسّن الحقيقي.',\n                advice(c) {\n                    const p = c.v;\n                    if (p <= 0) return { t: 'تنبيه', x: 'صفر نقطة يعني غياب التسجيل لا غياب العمل بالضرورة. سجّل إنجازاً واحداً اليوم؛ ما يُسجَّل يُدار، وما يُدار يتحسّن.' };\n                    if (p < 60) return { t: 'فرصة', x: `${p} نقطة انطلاقة متواضعة وصادقة. أسرع طريق لرفعها ليس ساعات إضافية بل إغلاق مهمة واحدة إضافية — المهمة تساوي خمسين دقيقة عمل في هذه المعادلة.` };\n                    if (p < 150) return { t: 'فرصة', x: `${p} نقطة إيقاع متماسك. استهدف ${Math.round(p * 1.15)} الأسبوع القادم عبر مهمتين إضافيتين فقط، لا عبر إطالة يومك.` };\n                    if (p < 250) return { t: 'قوة', x: `${p} نقطة أداء قوي. حافظ على المعادلة متوازنة: إن جاءت نقاطك كلها من الوقت دون مهام فأنت تعمل كثيراً وتُغلق قليلاً.` };\n                    return { t: 'قوة', x: `${p} نقطة منطقة أداء عالٍ. ثبّت ولا تزد؛ الاستمرار على هذا المستوى ثلاثة أشهر يفعل ما لا يفعله أسبوع استثنائي واحد.` };\n                }\n            },\n\n            streak: {\n                label: 'سلسلة الالتزام', icon: 'flame', color: 'cyan',\n                unit: 'يوم',\n                // قياس لحظي لا فترة: مقارنته بنسبة مئوية بين أسبوعين تضلّل أكثر مما تفيد\n                noDelta: true,\n                noDeltaNote: 'لا تحمل هذه البطاقة نسبة مئوية لأن السلسلة ليست حصيلة فترة بل حالة لحظية متصلة منذ آخر انقطاع. الرقم نفسه هو الرسالة: كلما طال ارتفعت كلفة كسره، وهذا في صالحك.',\n                val: s => (s.streak || 0) + ' يوم', raw: s => s.streak || 0,\n                what: 'عدد الأيام المتصلة التي لم تنقطع فيها عن تسجيل أي نشاط، محسوبة من بداية النظام حتى اليوم.',\n                how: 'يمشي النظام يوماً بيوم من تاريخ البدء؛ أي يوم بلا سجل ولم تُسامح نفسك عليه يكسر السلسلة ويعيد العد.',\n                use: 'السلسلة تحمي العادة أكثر مما تقيس الإنتاج. كلما طالت ارتفعت كلفة كسرها نفسياً، وهذا في صالحك.',\n                advice(c) {\n                    const s = c.v;\n                    if (s <= 0) return { t: 'فرصة', x: 'سلسلتك عند الصفر، وهذه أنظف نقطة بداية. سجّل اليوم ثم غداً فقط — يومان متتاليان يكفيان لتشعر أن الخيط بدأ.' };\n                    if (s < 7) return { t: 'فرصة', x: `${mondayPluralDays(s)} متصلة. أخطر يوم عليك هو اليوم الذي لا تشعر فيه بشيء — ضع لنفسك حداً أدنى (عشر دقائق) تحفظ به السلسلة في أسوأ أيامك.` };\n                    if (s < 30) return { t: 'قوة', x: `${mondayPluralDays(s)} دون انقطاع. تذكّر القاعدة: الانقطاع مرة واحدة لا يهدم شيئاً، والانقطاع مرتين متتاليتين هو ما يهدم العادة فعلاً.` };\n                    return { t: 'قوة', x: `${mondayPluralDays(s)} متصلة — هذا لم يعد حماساً بل بنية. ما بُني في أشهر يمكن أن يُهدم في يوم تهاون، فاحمِ الحدّ الأدنى مهما ضغط يومك.` };\n                }\n            },\n\n            booksDone: {\n                label: 'كتاب مكتمل', icon: 'award', color: 'emerald',\n                unit: 'كتاب',\n                val: s => s.booksDone, raw: s => s.booksDone,\n                what: 'عدد الكتب التي بلغت صفحتها الأخيرة داخل هذه الفترة تحديداً.',\n                how: 'يتتبّع النظام تراكم صفحات كل كتاب زمنياً، ويُحتسب الكتاب في الفترة التي تجاوز فيها إجمالي صفحاته لأول مرة.',\n                use: 'الإنهاء مهارة مستقلة تماماً عن القراءة، وقليل من يتقنها. كتاب واحد مُنهى أنفع من خمسة مفتوحة.',\n                advice(c) {\n                    if (c.v <= 0) return { t: 'فرصة', x: 'لم يكتمل كتاب في هذه الفترة. اختر الكتاب الأقرب إلى النهاية وأغلقه هذا الأسبوع؛ إغلاق كتاب واحد يعيد لك شعور الإنجاز أكثر من بدء ثلاثة.' };\n                    return { t: 'قوة', x: `أغلقت ${c.v} كتاباً بالكامل. خصّص عشرين دقيقة لتلخيصه في صفحة واحدة الآن — التلخيص بعد الإنهاء مباشرة هو ما يحوّل القراءة إلى أثر باقٍ.` };\n                }\n            }\n        };\n\n        /* ---------- سياق الأرقام المعروضة حالياً (يخدم بطاقة الشرح) ---------- */\n\n        // تُضبط عند رسم أي خطوة، فتعرف بطاقة الشرح أي فترة تتحدث عنها وبأي مقارنة\n        let mwStatCtx = null;\n\n        function setStatCtx(scope, s, prev, periodLabel, compareLabel) {\n            mwStatCtx = { scope, s, prev, periodLabel, compareLabel };\n        }\n\n        function mwMetricCtx(key) {\n            if (!mwStatCtx) return null;\n            const M = MW_METRICS[key];\n            if (!M) return null;\n            const s = mwStatCtx.s, p = mwStatCtx.prev;\n            return {\n                key, M, s, prev: p,\n                v: M.raw(s),\n                d: M.noDelta ? null : mwDelta(M.raw(s), p ? M.raw(p) : 0),\n                periodLabel: mwStatCtx.periodLabel,\n                compareLabel: mwStatCtx.compareLabel\n            };\n        }\n\n        // شرح النسبة المئوية بلغة الأرقام نفسها، لا بعبارة عامة\n        function mwPctExplain(c) {\n            const M = M_of(c), d = c.d;\n            const fmt = v => (M.unit === 'وقت' ? fmtDuration(v) : v + ' ' + M.unit);\n            if (d.txt === 'انطلاقة جديدة') return `الشارة تقول «انطلاقة جديدة» لأن ${c.compareLabel} كان صفراً في هذا المؤشر، فلا توجد قاعدة تُحسب عليها نسبة. المقارنة الحقيقية ستبدأ من الفترة القادمة.`;\n            if (d.dir === 0) return `الشارة تقول «ثابت» لأن رقمك (${fmt(d.cur)}) لم يتغيّر عن ${c.compareLabel}. الثبات ليس ركوداً: تكرار نفس الأداء مرتين متتاليتين هو أول دليل على أن الأمر صار نظاماً لا مزاجاً.`;\n            const dir = d.dir > 0 ? 'ارتفاع' : 'انخفاض';\n            const diff = Math.abs(d.cur - d.prv);\n            return `النسبة ${d.txt} تعني ${dir} قدره ${fmt(diff)} مقارنةً بـ${c.compareLabel} (كان ${fmt(d.prv)} وصار ${fmt(d.cur)}). النسبة تُحسب من الفترة السابقة نفسها، فهي تقيس <b class=\"text-white\">اتجاهك<\u002Fb> لا مستواك المطلق — والاتجاه هو ما يُتنبّأ به، أما الرقم فيصف الماضي فقط.`;\n        }\n\n        function M_of(c) { return c.M; }\n\n        function openStatInfo(key) {\n            const c = mwMetricCtx(key);\n            if (!c) return;\n            const M = c.M, adv = M.advice(c), tone = mwTone(adv.t);\n            const box = document.getElementById('statInfoBody');\n            const head = document.getElementById('statInfoTitle');\n            const sub = document.getElementById('statInfoSub');\n            const ico = document.getElementById('statInfoIcon');\n            if (head) head.textContent = M.label;\n            if (sub) sub.textContent = c.periodLabel;\n            if (ico) ico.innerHTML = `<i data-lucide=\"${M.icon}\" class=\"w-5 h-5\"><\u002Fi>`;\n\n            const block = (icon, title, body, cls) => `<div class=\"glass-panel rounded-2xl border ${cls || 'border-white/10'} p-4\">\n                <div class=\"flex items-center gap-2 mb-2 text-${M.color}-400\"><i data-lucide=\"${icon}\" class=\"w-4 h-4 shrink-0\"><\u002Fi><span class=\"text-[11px] font-black\">${title}<\u002Fspan><\u002Fdiv>\n                <p class=\"text-xs md:text-[13px] text-slate-300 leading-relaxed\" style=\"text-wrap:pretty\">${body}<\u002Fp>\n            <\u002Fdiv>`;\n\n            if (box) box.innerHTML = `\n                <div class=\"rounded-2xl border border-${M.color}-500/30 p-4 mb-3\" style=\"background:rgba(148,163,184,.06)\">\n                    <div class=\"flex items-end justify-between gap-3 flex-wrap\">\n                        <div class=\"min-w-0\">\n                            <p class=\"text-[10px] font-black text-${M.color}-400 mb-1\">قيمتك الحالية<\u002Fp>\n                            <p class=\"text-3xl font-black text-white leading-none\">${M.val(c.s)}<\u002Fp>\n                        <\u002Fdiv>\n                        ${mondayDeltaBadge(c.d)}\n                    <\u002Fdiv>\n                <\u002Fdiv>\n                ${block('help-circle', 'ما هذا الرقم؟', M.what)}\n                <div class=\"h-2\"><\u002Fdiv>\n                ${block('calculator', 'كيف يُحسب بالضبط؟', M.how)}\n                <div class=\"h-2\"><\u002Fdiv>\n                ${block('percent', 'ماذا تعني النسبة المئوية بجانبه؟', c.d ? mwPctExplain(c) : M.noDeltaNote)}\n                <div class=\"h-2\"><\u002Fdiv>\n                ${block('target', 'كيف تستفيد منه؟', M.use)}\n                <div class=\"h-2\"><\u002Fdiv>\n                <div class=\"rounded-2xl border border-${tone.c}-500/30 p-4\" style=\"background:rgba(148,163,184,.05)\">\n                    <div class=\"flex items-center gap-2 mb-2 text-${tone.c}-300\">\n                        <i data-lucide=\"${tone.i}\" class=\"w-4 h-4 shrink-0\"><\u002Fi>\n                        <span class=\"text-[11px] font-black\">أفضل نصيحة لحالتك الآن<\u002Fspan>\n                        <span class=\"text-[9px] font-black px-1.5 py-0.5 rounded-md bg-${tone.c}-500/10 border border-${tone.c}-500/25\">${adv.t}<\u002Fspan>\n                    <\u002Fdiv>\n                    <p class=\"text-xs md:text-[13px] text-slate-200 leading-relaxed\" style=\"text-wrap:pretty\">${adv.x}<\u002Fp>\n                <\u002Fdiv>`;\n\n            const m = document.getElementById('statInfo');\n            if (!m) return;\n            m.classList.remove('hidden');\n            const sheet = document.getElementById('statInfoBox');\n            if (box) box.scrollTop = 0;\n            setTimeout(() => { m.classList.remove('opacity-0'); if (sheet) sheet.classList.remove('translate-y-6', 'scale-95'); }, 10);\n            safeCreateIcons();\n        }\n\n        function closeStatInfo() {\n            const m = document.getElementById('statInfo');\n            if (!m) return;\n            m.classList.add('opacity-0');\n            const sheet = document.getElementById('statInfoBox');\n            if (sheet) sheet.classList.add('translate-y-6', 'scale-95');\n            setTimeout(() => m.classList.add('hidden'), 320);\n        }\n\n        /* ---------- بطاقة رقم موحّدة: قابلة للضغط + نصيحة مختصرة ---------- */\n\n        // المطلبان 3 و4: كل بطاقة تعرض رقمها وشارتها ونصيحة سطر واحد لحالتها، والضغط\n        // عليها يفتح الشرح الكامل. تصميمها مرن: العنوان يلتفّ ولا يُقصّ على الجوال.\n        function mwTile(key) {\n

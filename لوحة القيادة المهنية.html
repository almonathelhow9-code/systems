document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

48566b;\n            --border-color: #d9e0ea;\n        }\n\n        body.theme-frameiym {\n            --bg-main: #1c3459;\n            --bg-panel: rgba(21, 39, 67, 0.85);\n            --text-main: #fee2ab;\n            --text-muted: rgba(254, 226, 171, 0.6);\n            --border-color: rgba(249, 157, 84, 0.2);\n            --accent-primary: #f99d54;\n        }\n\n        body { \n            font-family: 'Cairo', sans-serif; \n            -webkit-tap-highlight-color: transparent; \n            background-color: var(--bg-main);\n            color: var(--text-main);\n            transition: background-color 0.4s ease, color 0.4s ease;\n        }\n        \n        .glass-panel, .bg-slate-900, .bg-slate-950 { \n            background: var(--bg-panel) !important; \n            border-color: var(--border-color) !important;\n            color: var(--text-main);\n        }\n        \n        body.theme-frameiym .text-slate-400 { color: var(--text-muted) !important; }\n        body.theme-frameiym .text-white { color: var(--text-main) !important; }\n        body.theme-frameiym .text-blue-400 { color: var(--accent-primary) !important; }\n        body.theme-frameiym .bg-blue-600 { background-color: var(--accent-primary) !important; }\n\n        ::-webkit-scrollbar { width: 6px; height: 6px; }\n        ::-webkit-scrollbar-track { background: transparent; }\n        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }\n        ::-webkit-scrollbar-thumb:hover { background: var(--accent-primary); }\n        .glass-panel { backdrop-filter: blur(12px); border: 1px solid var(--border-color); }\n        canvas#advancedTrendChart { filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.1)); }\n        .custom-scrollbar { -webkit-overflow-scrolling: touch; }\n        .smart-greeting-enter { animation: fadeUp 0.5s ease-out forwards; }\n        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }\n\n        #timerTabBtn-countdown.timer-tab-active, #timerTabBtn-stopwatch.timer-tab-active { background: var(--accent-primary); color: #fff; }\n        #timerTabBtn-countdown:not(.timer-tab-active), #timerTabBtn-stopwatch:not(.timer-tab-active) { color: var(--text-muted); }\n        .timer-preset-btn.timer-preset-active { border-color: var(--accent-primary) !important; color: var(--accent-primary); background: rgba(59,130,246,0.12); }\n        @keyframes congratsPop { from { opacity: 0; transform: scale(0.9) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }\n        .congrats-pop-enter { animation: congratsPop 0.4s ease-out forwards; }\n\n        /* المطلب 5: تنبيه اكتمال المؤقت التنازلي على حواف لوحة المؤقت نفسها (نيون منظم وهادئ) */\n        #timerPanel.timer-edge-alert { animation: timerEdgeGlow 2.4s ease-in-out infinite; }\n        @keyframes timerEdgeGlow {\n            0%   { border-color: #10b981 !important; box-shadow: 0 0 0 1px #10b981, 0 0 24px 2px rgba(16,185,129,.45), inset 0 0 30px rgba(16,185,129,.10); }\n            25%  { border-color: #3b82f6 !important; box-shadow: 0 0 0 1px #3b82f6, 0 0 32px 4px rgba(59,130,246,.50), inset 0 0 30px rgba(59,130,246,.10); }\n            50%  { border-color: #8b5cf6 !important; box-shadow: 0 0 0 1px #8b5cf6, 0 0 28px 3px rgba(139,92,246,.50), inset 0 0 30px rgba(139,92,246,.10); }\n            75%  { border-color: #f59e0b !important; box-shadow: 0 0 0 1px #f59e0b, 0 0 32px 4px rgba(245,158,11,.50), inset 0 0 30px rgba(245,158,11,.10); }\n            100% { border-color: #10b981 !important; box-shadow: 0 0 0 1px #10b981, 0 0 24px 2px rgba(16,185,129,.45), inset 0 0 30px rgba(16,185,129,.10); }\n        }\n\n        /* المطلب 2: نافذة الجمعة التحفيزية — إطار نيون يتنفس بهدوء */\n        .neon-frame { animation: neonBreathe 7s ease-in-out infinite; }\n        @keyframes neonBreathe {\n            0%, 100% { box-shadow: 0 0 0 1px rgba(56,189,248,.55), 0 0 50px rgba(56,189,248,.22), 0 0 120px rgba(56,189,248,.10), inset 0 0 80px rgba(56,189,248,.05); }\n            50%      { box-shadow: 0 0 0 1px rgba(167,139,250,.60), 0 0 60px rgba(167,139,250,.26), 0 0 140px rgba(236,72,153,.12), inset 0 0 90px rgba(167,139,250,.06); }\n        }\n        .friday-slide-enter { animation: fridaySlideIn 0.85s cubic-bezier(.22,.68,.16,1) both; }\n        @keyframes fridaySlideIn { from { opacity: 0; transform: translateY(18px) scale(.99); filter: blur(3px); } to { opacity: 1; transform: none; filter: blur(0); } }\n        .friday-stagger > * { animation: fridaySlideIn 0.8s cubic-bezier(.22,.68,.16,1) both; }\n        .friday-stagger > *:nth-child(1) { animation-delay: .05s; }\n        .friday-stagger > *:nth-child(2) { animation-delay: .12s; }\n        .friday-stagger > *:nth-child(3) { animation-delay: .19s; }\n        .friday-stagger > *:nth-child(4) { animation-delay: .26s; }\n        .friday-stagger > *:nth-child(5) { animation-delay: .33s; }\n        .friday-stagger > *:nth-child(6) { animation-delay: .40s; }\n        .friday-stagger > *:nth-child(7) { animation-delay: .47s; }\n        .friday-stagger > *:nth-child(8) { animation-delay: .54s; }\n\n        /* ========== محتسب المدة الذكي: زر مدمج داخل كل حقل زمني ==========\n           الزر يوضع بشكل مطلق داخل الحقل نفسه (يسار الحقل في الاتجاه العربي) حتى لا\n           يغيّر أي شبكة تخطيط قائمة ولا يقلّص عرض الحقول داخل الأعمدة المزدوجة. */\n        .trp-host { position: relative; display: block; width: 100%; }\n        .trp-input { -moz-appearance: textfield; appearance: textfield; padding-left: 3rem !important; }\n        .trp-input::-webkit-outer-spin-button, .trp-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }\n        .trp-btn {\n            position: absolute; left: .45rem; top: 50%; transform: translateY(-50%);\n            width: 1.95rem; height: 1.95rem; border-radius: .7rem;\n            display: flex; align-items: center; justify-content: center;\n            border-width: 1px; border-style: solid; cursor: pointer;\n            transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;\n        }\n        .trp-btn:hover { filter: brightness(1.35); transform: translateY(-50%) scale(1.08); }\n        .trp-btn:active { transform: translateY(-50%) scale(.93); }\n        .trp-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(148,163,184,.35); }\n        .trp-flash { animation: trpFlash 1.2s cubic-bezier(.22,.68,.16,1); }\n        @keyframes trpFlash {\n            0%   { box-shadow: 0 0 0 0 rgba(16,185,129,.60); border-color: #10b981 !important; }\n            60%  { box-shadow: 0 0 0 8px rgba(16,185,129,.06); border-color: #10b981 !important; }\n            100% { box-shadow: 0 0 0 14px rgba(16,185,129,0); }\n        }\n        .trp-time { direction: ltr; text-align: center; font-variant-numeric: tabular-nums; }\n        .trp-time::-webkit-calendar-picker-indicator { filter: invert(.65); cursor: pointer; }\n        body.theme-light .trp-time::-webkit-calendar-picker-indicator { filter: none; }\n        .trp-chip { transition: transform .16s ease, background-color .16s ease, border-color .16s ease; }\n        .trp-chip:hover { transform: translateY(-1px); }\n\n        /* ========== انطلاقة الإثنين — هوية بصرية دافئة (فجر) تقابل زُرقة الجمعة ========== */\n        .monday-frame { animation: mondayBreathe 8s ease-in-out infinite; }\n        @keyframes mondayBreathe {\n            0%, 100% { box-shadow: 0 0 0 1px rgba(245,158,11,.55), 0 0 50px rgba(245,158,11,.20), 0 0 120px rgba(245,158,11,.09), inset 0 0 80px rgba(245,158,11,.05); }\n            50%      { box-shadow: 0 0 0 1px rgba(16,185,129,.60), 0 0 60px rgba(16,185,129,.24), 0 0 140px rgba(56,189,248,.10), inset 0 0 90px rgba(16,185,129,.06); }\n        }\n        .monday-slide-enter { animation: mondayRise 0.9s cubic-bezier(.22,.68,.16,1) both; }\n        @keyframes mondayRise { from { opacity: 0; transform: translateY(26px) scale(.985); filter: blur(4px); } to { opacity: 1; transform: none; filter: blur(0); } }\n        .monday-stagger > * { animation: mondayRise 0.85s cubic-bezier(.22,.68,.16,1) both; }\n        .monday-stagger > *:nth-child(1) { animation-delay: .05s; }\n        .monday-stagger > *:nth-child(2) { animation-delay: .12s; }\n        .monday-stagger > *:nth-child(3) { animation-delay: .19s; }\n        .monday-stagger > *:nth-child(4) { animation-delay: .26s; }\n        .monday-stagger > *:nth-child(5) { animation-delay: .33s; }\n        .monday-stagger > *:nth-child(6) { animation-delay: .40s; }\n        .monday-stagger > *:nth-child(7) { animation-delay: .47s; }\n        .monday-stagger > *:nth-child(8) { animation-delay: .54s; }\n        /* أعمدة أيام الأسبوع الماضي */\n        .mw-bar { transform-origin: bottom; animation: mwGrow .95s cubic-bezier(.22,.68,.16,1) both; }\n        @keyframes mwGrow { from { transform: scaleY(0); opacity: .2; } to { transform: scaleY(1); opacity: 1; } }\n\n        /* تباين مضمون للمكوّنين الجديدين في الأوضاع الفاتحة (النظام يعيد تعريف\n           text-slate-400 وtext-white عالمياً فقط، فنكمل النطاق هنا محلياً) */\n        .mw-track { background: rgba(148,163,184,.16); }\n        body.theme-frameiym #mondayModal .text-slate-200,\n        body.theme-frameiym #mondayModal .text-slate-300,\n        body.theme-frameiym #timeRangeBox .text-slate-200,\n        body.theme-frameiym #timeRangeBox .text-slate-300 { color: var(--text-main) !important; }\n        body.theme-frameiym #mondayModal .text-slate-500,\n        body.theme-frameiym #mondayModal .text-slate-600,\n        body.theme-frameiym #timeRangeBox .text-slate-500 { color: var(--text-muted) !important; }\n\n\n        /* ========== المطلب 1: مركز المجالات ========== */\n        .dom-step { display: flex; align-items: center; gap: .5rem; font-size: .75rem; font-weight: 800;\n            color: var(--text-main); margin-bottom: .65rem; }\n        .dom-num { width: 1.25rem; height: 1.25rem; flex: none; border-radius: .5rem; font-size: .625rem;\n            display: flex; align-items: center; justify-content: center;\n            background: rgba(34,211,238,.14); color: #22d3ee; border: 1px solid rgba(34,211,238,.3); }\n\n        /* حالة الاختيار موحّدة لكل الملتقطات: حلقة واضحة لا تعتمد على اللون وحده */\n        .dom-kind, .dom-icon, .dom-emoji, .dom-tpl { cursor: pointer; }\n        .dom-kind:hover, .dom-icon:hover, .dom-emoji:hover { background: rgba(148,163,184,.14); }\n        .dom-icon.dom-sel, .dom-emoji.dom-sel {\n            border-color: #22d3ee !important; background: rgba(34,211,238,.18); color: #22d3ee;\n            transform: scale(1.08);\n        }\n        .dom-kind.dom-sel { border-color: #22d3ee !important; box-shadow: 0 0 0 1px #22d3ee inset; }\n        .dom-color { cursor: pointer; border-color: transparent; }\n        .dom-color:hover { filter: brightness(1.15); }\n        .dom-tpl:hover { transform: translateY(-2px); }\n        .dom-tpl { transition: transform .18s ease, filter .18s ease; }\n\n        /* قصّ النص على سطرين — مستخدم في بطاقات القوالب والمجالات */\n        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }\n        .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }\n\n        /* تباين مضمون للمركز في الوضعين الفاتح وFRAMEIYM */\n        body.theme-frameiym #tab-domains .text-slate-200,\n        body.theme-frameiym #tab-domains .text-slate-300 { color: var(--text-main) !important; }\n        body.theme-frameiym #tab-domains .text-slate-500 { color: var(--text-muted) !important; }\n\n\n        /* ========== المطلب 5: تنظيم نافذتي الجمعة والإثنين للجوال ==========\n           الجوال: النافذة تملأ الشاشة بلا هوامش ضائعة، وتحترم مناطق الأمان في\n           الأجهزة ذات الحافة المنحنية. الشاشات الأكبر: تعود بطاقةً وسطية بإطارها. */\n        .mw-modal { padding: 0; }\n        .mw-box { border-radius: 0; }\n        .mw-head {\n            padding: max(.75rem, env(safe-area-inset-top)) 1rem .75rem 1rem;\n        }\n        .mw-body { padding: 1.15rem 1rem 1.4rem 1rem; overscroll-behavior: contain; }\n        .mw-foot {\n            padding: .7rem 1rem max(.7rem, env(safe-area-inset-bottom)) 1rem;\n            gap: .65rem;\n        }\n        /* أزرار التنقّل: مساحة لمس مريحة على الجوال، ومقاس مضغوط على الشاشات الكبيرة */\n        .mw-btn {\n            border-radius: .85rem; font-size: .75rem; font-weight: 700;\n            padding: .7rem 1rem; transition: background-color .18s ease, filter .18s ease;\n            white-space: nowrap;\n        }\n        .mw-btn-main { min-width: 6.5rem; }\n        @media (min-width: 640px) {\n            .mw-modal { padding: 1rem; }\n            .mw-box { border-radius: 26px; }\n            .mw-head { padding: 1rem 1.5rem; }\n            .mw-body { padding: 1.6rem 1.5rem; }\n            .mw-foot { padding: .9rem 1.5rem; }\n            .mw-btn { padding: .55rem 1.1rem; }\n        }\n        @media (min-width: 768px) {\n            .mw-modal { padding: 1.5rem; }\n            .mw-box { border-radius: 28px; }\n            .mw-head { padding: 1rem 2rem; }\n            .mw-body { padding: 2rem 2.5rem; }\n            .mw-foot { padding: 1rem 2rem; }\n        }\n\n        /* عناوين الخطوات: تتدرّج مع عرض الشاشة بدل قفزة واحدة عند md */\n        .mw-h2 { font-size: clamp(1.25rem, 5.2vw, 2.25rem); }\n\n        /* بطاقة الرقم: العنوان يلتفّ على سطرين بدل أن يُقصّ بثلاث نقاط على الجوال */\n        .mw-tile { transition: transform .16s ease, border-color .16s ease, background-color .16s ease; }\n        .mw-tile:hover { transform: translateY(-2px); }\n        .mw-tile:active { transform: scale(.985); }\n        .mw-tile:focus-visible { outline: none; box-shadow: 0 0 0 2px rgba(148,163,184,.5); }\n        .mw-tile .mw-tip { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }\n        @media (min-width: 768px) { .mw-tile .mw-tip { -webkit-line-clamp: 4; } }\n\n        /* بطاقة شرح المؤشر: ورقة تصعد من الأسفل على الجوال، ونافذة وسطية فوق ذلك */\n        .si-box { border-radius: 24px 24px 0 0; max-height: 88vh; max-height: 88dvh; }\n        .si-box > :last-child { padding-bottom: max(.75rem, env(safe-area-inset-bottom)); }\n        @media (min-width: 640px) {\n            .si-box { border-radius: 24px; max-height: 84vh; max-height: 84dvh; }\n            .si-box > :last-child { padding-bottom: .75rem; }\n        }\n\n        /* تباين مضمون لنافذة الجمعة وبطاقة الشرح في الوضعين الفاتح وFRAMEIYM\n           (النظام يعيد تعريف text-slate-400 وtext-white عالمياً فقط) */\n        body.theme-frameiym #fridayModal .text-slate-200,\n        body.theme-frameiym #fridayModal .text-slate-300,\n        body.theme-frameiym #statInfo .text-slate-200,\n        body.theme-frameiym #statInfo .text-slate-300 { color: var(--text-main) !important; }\n        body.theme-frameiym #fridayModal .text-slate-500,\n        body.theme-frameiym #statInfo .text-slate-500 { color: var(--text-muted) !important; }\n\n        /* الشاشات القصيرة جداً (جوال أفقي): نضغط الرأس والتذييل لتبقى مساحة للمحتوى */\n        @media (max-height: 520px) {\n            .mw-head { padding-top: .5rem; padding-bottom: .5rem; }\n            .mw-foot { padding-top: .5rem; padding-bottom: .5rem; }\n            .mw-body { padding-top: .9rem; padding-bottom: .9rem; }\n        }\n\n        /* احترام تفضيل تقليل الحركة: النوافذ تظهر بلا نبض ولا انزلاق */\n        @media (prefers-reduced-motion: reduce) {\n            .neon-frame, .monday-frame { animation: none; }\n            .friday-slide-enter, .monday-slide-enter,\n            .friday-stagger > *, .monday-stagger > *, .mw-bar { animation: none !important; }\n        }\n\n\n        /* ================== المطلب 1: شاشة الإقلاع ==================\n           تُرسم في أول إطار قبل أي جزء من الواجهة، وتبقى حتى يكتمل تجهيز النظام فعلاً\n           (لا بمؤقّت وهمي)، ثم تتلاشى بنعومة. ألوانها مبنية على متغيرات الطابع نفسها،\n           والطابع المحفوظ يُطبَّق على body قبل هذه الشاشة مباشرةً، فلا يرى مستخدم الوضع\n           الفاتح ومضةً داكنة قبل نظامه. */\n        #bootScreen {\n            position: fixed; inset: 0; z-index: 9999;\n            display: flex; flex-direction: column; align-items: center; justify-content: center;\n            gap: 0; padding: 24px;\n            background: var(--boot-bg, #020617);\n            /* الغلاف الخارجي يبدأ بخلفية داكنة؛ هذا الانتقال يذيب الفرق بدل أن يومض */\n            animation: bootWash .45s ease-out both;\n            -webkit-user-select: none; user-select: none;\n            transition: opacity .55s cubic-bezier(.4,0,.2,1), visibility .55s;\n        }\n        @keyframes bootWash { from { background: #020617; } to { background: var(--boot-bg, #020617); } }\n        #bootScreen.boot-out { opacity: 0; visibility: hidden; pointer-events: none; }\n        #bootScreen.boot-out .boot-core, #bootScreen.boot-out .boot-text { transform: translateY(-8px) scale(.97); }\n\n        /* هالة لونية هادئة خلف العلامة تمنح العمق دون ضجيج */\n        .boot-aura {\n            position: absolute; width: min(70vw, 460px); aspect-ratio: 1; border-radius: 50%;\n            background: radial-gradient(circle, var(--boot-glow, rgba(59,130,246,.22)) 0%, transparent 68%);\n            filter: blur(14px); animation: bootPulse 3.6s ease-in-out infinite; pointer-events: none;\n        }\n        @keyframes bootPulse { 0%,100% { transform: scale(.94); opacity: .75; } 50% { transform: scale(1.06); opacity: 1; } }\n\n        .boot-core {\n            position: relative; width: 132px; height: 132px;\n            display: flex; align-items: center; justify-content: center;\n            transition: transform .55s cubic-bezier(.4,0,.2,1);\n        }\n        .boot-ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }\n        .boot-ring-bg { stroke: var(--boot-track, rgba(148,163,184,.22)); stroke-width: 2.5; }\n        .boot-ring-arc {\n            stroke: var(--boot-accent, #3b82f6); stroke-linecap: round; stroke-width: 4;\n            /* 2π × 54 ≈ 339.29 — المحيط كاملاً، والإزاحة تتحرك مع التقدّم الحقيقي */\n            stroke-dasharray: 339.29; stroke-dashoffset: 339.29;\n            transition: stroke-dashoffset .6s cubic-bezier(.22,.68,.16,1);\n            filter: drop-shadow(0 0 6px var(--boot-glow, rgba(59,130,246,.45)));\n        }\n        /* حلقة خارجية رفيعة تدور ببطء: إشارة حياة حتى لو توقّف التقدّم لحظة */\n        .boot-spin { position: absolute; inset: -11px; animation: bootSpin 2.8s linear infinite; }\n        .boot-spin circle {\n            fill: none; stroke: var(--boot-accent, #3b82f6); stroke-width: 2; stroke-linecap: round;\n            stroke-dasharray: 30 334; opacity: .5;\n        }\n        @keyframes bootSpin { to { transform: rotate(360deg); } }\n\n        .boot-mark {\n            width: 58px; height: 58px; border-radius: 20px;\n            display: flex; align-items: center; justify-content: center;\n            color: #fff; background: var(--boot-mark, linear-gradient(135deg, #2563eb, #4f46e5));\n            box-shadow: 0 10px 28px -8px var(--boot-glow, rgba(59,130,246,.55));\n            animation: bootFloat 3.2s ease-in-out infinite;\n        }\n        .boot-mark svg { width: 28px; height: 28px; }\n        @keyframes bootFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }\n\n        .boot-text { text-align: center; margin-top: 26px; transition: transform .55s cubic-bezier(.4,0,.2,1); }\n        .boot-title {\n            font-size: 26px; font-weight: 900; letter-spacing: -.01em; line-height: 1.2;\n            color: var(--boot-title, #f1f5f9); animation: bootRise .7s .05s cubic-bezier(.22,.68,.16,1) both;\n        }\n        .boot-sub {\n            font-size: 11px; font-weight: 700; letter-spacing: .12em; margin-top: 6px;\n            color: var(--boot-accent, #3b82f6); animation: bootRise .7s .14s cubic-bezier(.22,.68,.16,1) both;\n        }\n        @keyframes bootRise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }\n\n        .boot-bar {\n            width: min(72vw, 240px); height: 3px; border-radius: 99px; margin-top: 26px; overflow: hidden;\n            background: var(--boot-track, rgba(148,163,184,.22));\n            animation: bootRise .7s .22s cubic-bezier(.22,.68,.16,1) both;\n        }\n        #bootBar {\n            height: 100%; width: 0%; border-radius: 99px;\n            background: var(--boot-mark, linear-gradient(135deg, #2563eb, #4f46e5));\n            transition: width .6s cubic-bezier(.22,.68,.16,1);\n        }\n        .boot-stage {\n            font-size: 11px; font-weight: 700; margin-top: 12px; min-height: 1.2em;\n            color: var(--boot-stage, #94a3b8);\n            animation: bootRise .7s .3s cubic-bezier(.22,.68,.16,1) both;\n        }\n        .boot-stage span { display: inline-block; animation: bootFade .45s ease-out both; }\n        @keyframes bootFade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }\n\n        /* ألوان الشاشة في كل طابع — تُشتقّ من هوية الطابع نفسه لا من قيم ثابتة */\n        body.theme-dark {\n            --boot-bg: #020617; --boot-title: #f1f5f9; --boot-stage: #94a3b8;\n            --boot-accent: #60a5fa; --boot-glow: rgba(59,130,246,.30);\n            --boot-track: rgba(148,163,184,.20); --boot-mark: linear-gradient(135deg, #2563eb, #4f46e5);\n        }\n        body.theme-light {\n            --boot-bg: #eef1f7; --boot-title: #0d1526; --boot-stage: #64748b;\n            --boot-accent: #2563eb; --boot-glow: rgba(37,99,235,.20);\n            --boot-track: rgba(15,23,42,.10); --boot-mark: linear-gradient(135deg, #2563eb, #4f46e5);\n        }\n        body.theme-frameiym {\n            --boot-bg: #1c3459; --boot-title: #fee2ab; --boot-stage: rgba(254,226,171,.65);\n            --boot-accent: #f99d54; --boot-glow: rgba(249,157,84,.28);\n            --boot-track: rgba(254,226,171,.18); --boot-mark: linear-gradient(135deg, #f99d54, #e07a3a);\n        }\n\n        @media (prefers-reduced-motion: reduce) {\n            #bootScreen, .boot-aura, .boot-mark, .boot-spin,\n            .boot-title, .boot-sub, .boot-bar, .boot-stage, .boot-stage span { animation: none !important; }\n        }\n\n        /* قوس مؤشر الأسبوع */\n        .mw-ring circle { transition: stroke-dashoffset 1.3s cubic-bezier(.22,.68,.16,1); }\n\n        /* ============ المطلب 2: الوضع الفاتح «نهار» ============\n           كان الوضع الفاتح يضع لوحات بيضاء فوق خلفية بيضاء، فتختفي الحدود ويذوب كل شيء\n           في كل شيء — وهذا سبب البهتان، لا ضعف الألوان.\n\n           أُعيد بناؤه على مبدأين:\n           • التباين: العمق يأتي من ثلاث طبقات سطحية (لوح أبيض فوق قماش رمادي مزرقّ فوق\n             غائر أفتح) مع ظلال طبقية، ومن حبرٍ لكل عائلة لونية مضبوط ليتجاوز 4.5:1.\n           • التناغم: لا أبيض ناصع يُجهد العين كخلفية، ولا حدود قاسية. كل الحياديات من\n             عائلة واحدة بميل أزرق خفيف، وكل حبر لوني مشتقّ من درجة 700 لعائلته — فتبقى\n             الهوية كما هي ويتغيّر وضوحها وحده. */\n        body.theme-light {\n            --bg-main: #e8ecf3;        /* القماش: رمادي مزرقّ هادئ، لا أبيض يبهر */\n            --bg-panel: #ffffff;       /* اللوح المرتفع */\n            --bg-inset: #f1f4f9;       /* الغائر: المسارات والشارات والصناديق الداخلية */\n            --bg-subtle: #e3e9f1;      /* عناصر التحكم والرقائق */\n            --text-main: #0d1526;      /* 18:1 فوق الأبيض */\n            --text-body: #1f2a3d;      /* نص المتن */\n            --text-muted: #48566b;     /* 7.2:1 */\n            --text-subtle: #5b6b80;    /* 5.5:1 — بهامشٍ يكفي فوق الأسطح الغائرة */\n            --border-color: #d9e0ea;\n            --border-strong: #c3cedd;\n            --accent-primary: #2563eb;\n            --accent-ink: #1d4ed8;\n            --accent-soft: rgba(37, 99, 235, .10);\n            --shadow-sm: 0 1px 2px rgba(13,21,38,.04), 0 4px 12px -4px rgba(13,21,38,.08);\n            --shadow-md: 0 2px 4px rgba(13,21,38,.05), 0 12px 28px -10px rgba(13,21,38,.14);\n            --shadow-lg: 0 8px 20px rgba(13,21,38,.08), 0 30px 60px -20px rgba(13,21,38,.22);\n\n            /* مصدرا ضوء خافتان يمنحان القماش عمقاً دون أن يصيرا زخرفة */\n            background-image:\n                radial-gradient(1100px 620px at 100% -12%, rgba(37,99,235,.07), transparent 62%),\n                radial-gradient(900px 520px at -5% 108%, rgba(13,148,136,.06), transparent 60%);\n            background-attachment: fixed;\n        }\n\n        /* ---------- الطبقات السطحية ---------- */\n        body.theme-light .glass-panel {\n            background: var(--bg-panel) !important;\n            border-color: var(--border-color) !important;\n            box-shadow: var(--shadow-sm);\n            backdrop-filter: none;   /* اللوح مصمت هنا، فالتمويه عمل بلا أثر */\n        }\n        body.theme-light .bg-slate-950,\n        body.theme-light .bg-slate-900 { background: var(--bg-inset) !important; }\n        body.theme-light .bg-slate-800,\n        body.theme-light .bg-slate-700 { background: var(--bg-subtle) !important; }\n\n        /* الصيغ الشفافة: نطابق بدايةَ الصنف فقط حتى لا نصطاد صيغ hover: وmd: فنجمّدها */\n        body.theme-light [class*=\" bg-slate-950/\"]:not([class*=\"inset-0\"]),\n        body.theme-light [class^=\"bg-slate-950/\"]:not([class*=\"inset-0\"]),\n        body.theme-light [class*=\" bg-slate-900/\"]:not([class*=\"inset-0\"]),\n        body.theme-light [class^=\"bg-slate-900/\"]:not([class*=\"inset-0\"]),\n        body.theme-light [class*=\" bg-white/\"],\n        body.theme-light [class^=\"bg-white/\"] { background-color: var(--bg-inset) !important; }\n        body.theme-light [class*=\" bg-slate-800/\"]:not([class*=\"inset-0\"]),\n        body.theme-light [class^=\"bg-slate-800/\"]:not([class*=\"inset-0\"]),\n        body.theme-light [class*=\" bg-slate-700/\"]:not([class*=\"inset-0\"]),\n        body.theme-light [class^=\"bg-slate-700/\"]:not([class*=\"inset-0\"]) { background-color: var(--bg-subtle) !important; }\n        body.theme-light [class*=\"hover:bg-white/\"]:hover,\n        body.theme-light [class*=\"hover:bg-slate-\"]:hover { background-color: var(--bg-subtle) !important; }\n\n        /* حُجُب النوافذ: داكنة بما يكفي للتركيز، شفّافة بما يكفي لئلا تُطفئ الصفحة */\n        body.theme-light [class*=\"inset-0\"][class*=\"bg-slate-950/\"],\n        body.theme-light [class*=\"inset-0\"][class*=\"bg-slate-900/\"] { background-color: rgba(23,34,54,.42) !important; }\n\n        /* ---------- سُلّم النص: أربع درجات تحفظ التدرّج الهرمي ---------- */\n        body.theme-light .text-white,\n        body.theme-light .text-slate-100,\n        body.theme-light .text-slate-200 { color: var(--text-main) !important; }\n        body.theme-light .text-slate-300 { color: var(--text-body) !important; }\n        body.theme-light .text-slate-400 { color: var(--text-muted) !important; }\n        body.theme-light .text-slate-500,\n        body.theme-light .text-slate-600 { color: var(--text-subtle) !important; }\n        body.theme-light ::placeholder { color: #94a3b8 !important; opacity: 1; }\n\n        /* ---------- الحدود الحيادية ---------- */\n        body.theme-light .border-slate-600,\n        body.theme-light .border-slate-700,\n        body.theme-light .border-slate-800,\n        body.theme-light [class*=\" border-slate-700/\"],\n        body.theme-light [class*=\" border-slate-800/\"],\n        body.theme-light [class*=\" border-white/\"],\n        body.theme-light [class^=\"border-white/\"] { border-color: var(--border-color) !important; }\n\n        /* ---------- مكوّنات بعينها ---------- */\n        body.theme-light #sidebar {\n            background: var(--bg-panel) !important;\n            border-color: var(--border-color) !important;\n            box-shadow: var(--shadow-md);\n        }\n        /* البند النشط في القائمة كان كتلة كحلية داكنة وسط قائمة بيضاء؛ صار لمسة لونية */\n        body.theme-light .menu-btn.bg-slate-800 {\n            background: var(--accent-soft) !important;\n            color: var(--accent-ink) !important;\n            border-color: var(--accent-primary) !important;\n        }\n        body.theme-light .menu-btn:hover { background: var(--bg-inset) !important; }\n\n        body.theme-light [id$=\"Box\"] { box-shadow: var(--shadow-lg); }\n        body.theme-light #timerPanel { box-shadow: var(--shadow-lg); }\n\n        /* التوهّج النيوني لغة سطح داكن؛ فوق سطح فاتح يتحوّل إلى ضبابٍ متّسخ */\n        body.theme-light .neon-frame,\n        body.theme-light .monday-frame { animation: none; }\n        body.theme-light .neon-frame { box-shadow: var(--shadow-lg), 0 0 0 1px rgba(2,132,199,.30); }\n        body.theme-light .monday-frame { box-shadow: var(--shadow-lg), 0 0 0 1px rgba(146,64,14,.30); }\n\n        body.theme-light ::-webkit-scrollbar-thumb { background: var(--border-strong); }\n        body.theme-light ::-webkit-scrollbar-thumb:hover { background: var(--accent-primary); }\n        body.theme-light .mw-track { background: rgba(13,21,38,.09); }\n\n        /* حلقة تركيز واضحة: شرط وصولٍ أساسي وتفصيل يُشعر بجودة الصنعة */\n        body.theme-light input:focus,\n        body.theme-light select:focus,\n        body.theme-light textarea:focus { box-shadow: 0 0 0 3px rgba(37,99,235,.13); }\n\n        /* ظلّ أوضح عند المرور على البطاقات التفاعلية — إشارة «هذا قابل للضغط» */\n        /* العنوان المتدرّج يبدأ من الأبيض، فيتلاشى فوق قماش فاتح؛ نُبقي التدرّج\n           ونستبدل طرفيه بحبرٍ داكن ولمسة من لون الهوية. */\n        body.theme-light #smartGreetingTitle {\n            background-image: linear-gradient(to left, var(--text-main), var(--accent-ink)) !important;\n        }\n\n        /* لمسات مركز المجالات مكتوبة بلون ثابت (سماوي 400)، فلا تمرّ بخريطة الأصناف */\n        body.theme-light .dom-num {\n            color: #0e7490 !important;\n            background: rgba(14,116,144,.12);\n            border-color: rgba(14,116,144,.32);\n        }\n        body.theme-light .dom-icon.dom-sel,\n        body.theme-light .dom-emoji.dom-sel {\n            border-color: #0e7490 !important; background: rgba(14,116,144,.14); color: #0e7490;\n        }\n        body.theme-light .dom-kind.dom-sel { border-color: #0e7490 !important; box-shadow: 0 0 0 1px #0e7490 inset; }\n\n        /* بطاقات اختيار الطابع تعرض الطابع نفسه، فألوانها ليست ألوان الواجهة الحالية */\n        body.theme-light [class*=\"bg-[#020617]\"],\n        body.theme-light [class*=\"bg-[#020617]\"] * { color: #f1f5f9 !important; }\n\n        body.theme-light .mw-tile:hover,\n        body.theme-light .dom-tpl:hover { box-shadow: var(--shadow-md); }\n\n        /* حبر العائلات اللونية: الدرجات 200-500 مضبوطة للقراءة فوق سطح فاتح */\n        body.theme-light .text-amber-200,\n        body.theme-light [class*=\" text-amber-200/\"],\n        body.theme-light [class^=\"text-amber-200/\"] { color: #92400e !important; }\n        body.theme-light .text-amber-300,\n        body.theme-light [class*=\" text-amber-300/\"],\n        body.theme-light [class^=\"text-amber-300/\"] { color: #92400e !important; }\n        body.theme-light .text-amber-400,\n        body.theme-light [class*=\" text-amber-400/\"],\n        body.theme-light [class^=\"text-amber-400/\"] { color: #92400e !important; }\n        body.theme-light .text-amber-500,\n        body.theme-light [class*=\" text-amber-500/\"],\n        body.theme-light [class^=\"text-amber-500/\"] { color: #92400e !important; }\n        body.theme-light .text-blue-200,\n        body.theme-light [class*=\" text-blue-200/\"],\n        body.theme-light [class^=\"text-blue-200/\"] { color: #1d4ed8 !important; }\n        body.theme-light .text-blue-300,\n        body.theme-light [class*=\" text-blue-300/\"],\n        body.theme-light [class^=\"text-blue-300/\"] { color: #1d4ed8 !important; }\n        body.theme-light .text-blue-400,\n        body.theme-light [class*=\" text-blue-400/\"],\n        body.theme-light [class^=\"text-blue-

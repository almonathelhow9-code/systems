ig.url || '';\n            const sk = document.getElementById('syncKey'); if (sk && !sk.value.trim()) sk.value = cloudConfig.key || '';\n            showToast('تم حفظ إعدادات الربط السحابي');\n        }\n\n        function renderDomainMapRows() {\n            const container = document.getElementById('domainMapRows'); if (!container) return;\n            const cats = [...new Set([...domainCats(), ...globalActivityLogs.map(l => l.category)])];\n            const optionsHTML = (selected) => CLOUD_DOMAIN_KEYS.map(k => `<option value=\"${k}\" ${k===selected?'selected':''}>${CLOUD_DOMAIN_LABELS[k]}<\u002Foption>`).join('');\n            const rowHTML = (label, selected) => `<div class=\"flex items-center justify-between gap-3 py-2 border-b border-slate-800/50 last:border-0\"><span class=\"text-sm font-semibold text-slate-200 truncate\">${label}<\u002Fspan><select data-domain-cat=\"${label}\" class=\"domain-map-select glass-panel border border-slate-700 rounded-lg px-3 py-1.5 text-xs outline-none focus:border-sky-500 text-slate-200 min-w-[150px]\">${optionsHTML(selected)}<\u002Fselect><\u002Fdiv>`;\n            let rowsHTML = cats.map(cat => rowHTML(cat, cloudDomainMap[cat] || CLOUD_DEFAULT_DOMAIN_BY_CATEGORY[cat] || 'unclassified')).join('');\n            rowsHTML += rowHTML('سجلات القراءة', cloudDomainMap['سجلات القراءة'] || 'strategy');\n            rowsHTML += rowHTML('الكتب', cloudDomainMap['الكتب'] || 'strategy');\n            container.innerHTML = rowsHTML;\n            safeCreateIcons();\n        }\n\n        function saveDomainMap() {\n            const map = {};\n            document.querySelectorAll('.domain-map-select').forEach(sel => { map[sel.dataset.domainCat] = sel.value || 'unclassified'; });\n            cloudDomainMap = map;\n            localStorage.setItem('prod_domain_map', JSON.stringify(map));\n            showToast('تم حفظ خريطة التصنيفات');\n        }\n\n        function saveDirectives() {\n            cloudDirectives = document.getElementById('cloudDirectives').value;\n            localStorage.setItem('prod_directives', cloudDirectives);\n            showToast('تم حفظ التوجيهات');\n        }\n\n        function showCloudStatus(msg, type) {\n            const box = document.getElementById('cloudStatusBox'); if (!box) return;\n            box.classList.remove('hidden', 'border-emerald-500/30', 'text-emerald-300', 'border-rose-500/30', 'text-rose-300', 'border-slate-600', 'text-slate-300');\n            if (type === 'success') box.classList.add('border-emerald-500/30', 'text-emerald-300');\n            else if (type === 'error') box.classList.add('border-rose-500/30', 'text-rose-300');\n            else box.classList.add('border-slate-600', 'text-slate-300');\n            box.innerText = msg;\n        }\n\n        function setCloudProgress(pct) {\n            const wrap = document.getElementById('cloudProgressWrap');\n            const bar = document.getElementById('cloudProgressBar');\n            if (!wrap || !bar) return;\n            wrap.classList.remove('hidden');\n            bar.style.width = Math.max(0, Math.min(100, pct)) + '%';\n            if (pct >= 100) setTimeout(() => wrap.classList.add('hidden'), 800);\n        }\n\n        function setCloudLoading(isLoading) {\n            const btn = document.getElementById('btnPushCloud');\n            const icon = document.getElementById('cloudPushIcon');\n            const label = document.getElementById('cloudPushLabel');\n            if (!btn) return;\n            btn.disabled = isLoading;\n            btn.classList.toggle('opacity-60', isLoading);\n            btn.classList.toggle('cursor-not-allowed', isLoading);\n            if (label) label.innerText = isLoading ? 'جاري الرفع...' : 'رفع البيانات إلى السحابة';\n            if (icon) { icon.setAttribute('data-lucide', isLoading ? 'loader-2' : 'upload-cloud'); icon.classList.toggle('animate-spin', isLoading); safeCreateIcons(); }\n        }\n\n        function buildCloudEntries() {\n            const map = cloudDomainMap || {};\n            const sourceSystem = (cloudConfig && cloudConfig.source_system) || 'professional_board';\n            const entries = []; let skipped = 0;\n\n            globalActivityLogs.forEach(l => {\n                const occurred_on = l.date;\n                const domain_key = map[l.category] || CLOUD_DEFAULT_DOMAIN_BY_CATEGORY[l.category] || 'unclassified';\n                if (!occurred_on || !domain_key) { skipped++; return; }\n                entries.push({ source_system: sourceSystem, external_id: l.id, entry_type: 'session', domain_key, title: l.category, notes: l.notes || '', minutes: Number(l.time_mins) || 0, tasks_count: Number(l.tasks_completed) || 0, occurred_on, payload: { original_category: l.category } });\n            });\n\n            globalReadingLogs.forEach(l => {\n                const occurred_on = l.date;\n                const domain_key = map['سجلات القراءة'] || 'strategy';\n                if (!occurred_on || !domain_key) { skipped++; return; }\n                const book = globalBooks.find(b => b.id === l.book_id);\n                entries.push({ source_system: sourceSystem, external_id: l.id, entry_type: 'reading', domain_key, title: book ? book.title : 'قراءة', notes: '', minutes: Number(l.time_spent_mins) || 0, tasks_count: 0, occurred_on, payload: { pages_read: l.pages_read, book_id: l.book_id } });\n            });\n\n            globalBooks.forEach(b => {\n                const domain_key = map['الكتب'] || 'strategy';\n                const occurred_on = b.start_date || getTodayStr();\n                if (!occurred_on || !domain_key) { skipped++; return; }\n                entries.push({ source_system: sourceSystem, external_id: b.id, entry_type: 'book', domain_key, title: b.title, notes: '', minutes: 0, tasks_count: 0, occurred_on, payload: { total_pages: b.total_pages } });\n            });\n\n            if (cloudDirectives && cloudDirectives.trim()) {\n                entries.push({ source_system: sourceSystem, external_id: 'directives', entry_type: 'note', domain_key: 'strategy', title: 'توجيهات المستخدم', notes: cloudDirectives, minutes: 0, tasks_count: 0, occurred_on: getTodayStr(), payload: {} });\n            }\n\n            return { entries, skipped };\n        }\n\n        async function testCloudConnection() {\n            const cfg = collectCloudConfigFromForm();\n            if (!cfg.url || !cfg.key) { showCloudStatus('يرجى تعبئة رابط ومفتاح Supabase أولاً.', 'error'); return; }\n            showCloudStatus('جاري اختبار الاتصال...', 'info');\n            try {\n                const res = await fetch(`${cfg.url.replace(/\\/$/, '')}/rest/v1/domains?select=key`, { headers: { 'apikey': cfg.key, 'Authorization': `Bearer ${cfg.key}` } });\n                const txt = await res.text();\n                showCloudStatus((res.ok ? 'نجح الاتصال ✅ — ' : 'فشل الاتصال ❌ — ') + txt, res.ok ? 'success' : 'error');\n            } catch (e) {\n                showCloudStatus('خطأ في الاتصال: ' + e.message, 'error');\n            }\n        }\n\n        async function pushToCloud() {\n            const cfg = collectCloudConfigFromForm();\n            if (!cfg.url || !cfg.key) { showCloudStatus('يرجى تعبئة رابط ومفتاح Supabase أولاً وحفظها.', 'error'); return; }\n            cloudConfig = cfg;\n            const { entries, skipped } = buildCloudEntries();\n            if (!entries.length) { showCloudStatus('لا توجد سجلات صالحة للرفع.', 'error'); return; }\n            setCloudLoading(true);\n\n            const batchSize = 200;\n            const batches = [];\n            for (let i = 0; i < entries.length; i += batchSize) batches.push(entries.slice(i, i + batchSize));\n\n            const postBatch = async (batch) => {\n                const res = await fetch(`${cfg.url.replace(/\\/$/, '')}/rest/v1/entries?on_conflict=source_system,external_id`, {\n                    method: 'POST',\n                    headers: { 'apikey': cfg.key, 'Authorization': `Bearer ${cfg.key}`, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates,return=minimal' },\n                    body: JSON.stringify(batch)\n                });\n                if (!res.ok) throw new Error(await res.text());\n                return res;\n            };\n\n            let uploaded = 0, failed = 0;\n            try {\n                for (let bi = 0; bi < batches.length; bi++) {\n                    const batch = batches[bi];\n                    let ok = false, lastErr = null;\n                    for (let attempt = 1; attempt <= 2 && !ok; attempt++) {\n                        try {\n                            await postBatch(batch);\n                            ok = true;\n                        } catch (e) {\n                            lastErr = e;\n                            if (attempt === 1) {\n                                showCloudStatus(`فشلت الدفعة ${bi + 1}، إعادة المحاولة...`, 'info');\n                                await new Promise(r => setTimeout(r, 500));\n                            }\n                        }\n                    }\n                    if (ok) {\n                        uploaded += batch.length;\n                    } else {\n                        failed += batch.length;\n                        console.warn(`تم تجاوز الدفعة ${bi + 1} بعد فشل محاولتين:`, lastErr && lastErr.message);\n                    }\n\n                    const pct = Math.round(((bi + 1) / batches.length) * 100);\n                    showCloudStatus(`جاري الرفع... ${uploaded + failed}/${entries.length} سجل (${pct}%)`, 'info');\n                    setCloudProgress(pct);\n\n                    if (bi < batches.length - 1) await new Promise(r => setTimeout(r, 500));\n                }\n\n                const now = new Date().toISOString();\n                localStorage.setItem('prod_last_push', now);\n                const lastPushEl = document.getElementById('cloudLastPush');\n                if (lastPushEl) lastPushEl.innerText = 'آخر رفع: ' + new Date(now).toLocaleString('ar-EG');\n\n                const summary = failed\n                    ? `تم رفع ${uploaded} سجلاً بنجاح، وفشل ${failed} سجلاً.${skipped ? ` (استُبعد ${skipped} سجل بلا تاريخ صالح)` : ''}`\n                    : `تم رفع ${uploaded} سجلاً بنجاح.${skipped ? ` (استُبعد ${skipped} سجل)` : ''}`;\n                showCloudStatus(summary, failed ? 'error' : 'success');\n            } catch (e) {\n                showCloudStatus('خطأ في الاتصال: ' + e.message, 'error');\n            } finally {\n                setCloudLoading(false);\n            }\n        }\n\n        /* ========== المطلب 1: تعديل تقدم الكتاب مباشرة من أيقونة القلم ========== */\n        function applyBookProgress(bookId, target) {\n            const logs = globalReadingLogs\n                .filter(l => l.book_id === bookId)\n                .sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.id < b.id ? -1 : 1));\n            const current = logs.reduce((s, l) => s + Number(l.pages_read || 0), 0);\n            if (target === current) return;\n\n            if (target < current) {\n                let excess = current - target;\n                for (let i = logs.length - 1; i >= 0 && excess > 0; i--) {\n                    const p = Number(logs[i].pages_read || 0);\n                    if (p <= excess) { excess -= p; logs[i].pages_read = 0; }\n                    else { logs[i].pages_read = p - excess; excess = 0; }\n                }\n                // نحذف فقط السجلات التي أصبحت بلا صفحات وبلا وقت مسجّل حتى لا نفقد دقائق قراءة\n                globalReadingLogs = globalReadingLogs.filter(l =>\n                    !(l.book_id === bookId && Number(l.pages_read || 0) === 0 && Number(l.time_spent_mins || 0) === 0));\n            } else {\n                const diff = target - current;\n                if (logs.length) {\n                    const last = logs[logs.length - 1];\n                    last.pages_read = Number(last.pages_read || 0) + diff;\n                } else {\n                    globalReadingLogs.push({ id: 'r_' + Date.now(), book_id: bookId, date: getTodayStr(), pages_read: diff, time_spent_mins: 0 });\n                }\n            }\n        }\n\n        function recordDeletion(id) {\n            if (!id) return;\n            if (!deletedIds.includes(id)) deletedIds.push(id);\n            if (deletedIds.length > 500) deletedIds = deletedIds.slice(-500);\n            localStorage.setItem('prod_deleted_ids', JSON.stringify(deletedIds));\n        }\n\n        /* ========== المطلب 6: رف الكتب المقروءة ========== */\n        function bookProgressMap() {\n            const m = {};\n            globalReadingLogs.forEach(l => m[l.book_id] = (m[l.book_id] || 0) + Number(l.pages_read || 0));\n            return m;\n        }\n\n        function toggleReadShelf() {\n            const body = document.getElementById('readShelfBody');\n            const chev = document.getElementById('readShelfChevron');\n            if (!body) return;\n            const opening = body.classList.contains('hidden');\n            body.classList.toggle('hidden', !opening);\n            if (chev) chev.style.transform = opening ? 'rotate(180deg)' : 'rotate(0deg)';\n            if (opening) renderReadShelf(true);\n        }\n\n        function renderReadShelf(force) {\n            const body = document.getElementById('readShelfBody');\n            const countEl = document.getElementById('readShelfCount');\n            if (!body) return;\n            const prog = bookProgressMap();\n            const done = globalBooks.filter(b => (prog[b.id] || 0) >= Number(b.total_pages || 0) && Number(b.total_pages || 0) > 0);\n\n            if (countEl) countEl.innerText = done.length\n                ? `${done.length} كتاب مكتمل · ${done.reduce((s, b) => s + Number(b.total_pages || 0), 0)} صفحة`\n                : 'لا توجد كتب مكتملة بعد';\n\n            if (!force && body.classList.contains('hidden')) return;\n\n            if (!done.length) {\n                body.innerHTML = getEmptyStateHTML('book-check', 'لا توجد كتب مكتملة بعد. أكمل أول كتاب وسيظهر هنا في رف إنجازاتك.', 'emerald');\n                safeCreateIcons();\n                return;\n            }\n\n            body.innerHTML = `<div class=\"grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3\">` + done.map(b => {\n                const bLogs = globalReadingLogs.filter(l => l.book_id === b.id).sort((a, c) => a.date < c.date ? -1 : 1);\n                const finishedOn = bLogs.length ? bLogs[bLogs.length - 1].date : b.start_date;\n                const mins = bLogs.reduce((s, l) => s + Number(l.time_spent_mins || 0), 0);\n                return `<div class=\"glass-panel rounded-2xl border border-emerald-500/25 p-4 flex items-start gap-3\">\n                    <span class=\"w-9 h-9 shrink-0 rounded-xl bg-emerald-500/15 text-emerald-400 border border-emerald-500/25 flex items-center justify-center\"><i data-lucide=\"check-circle-2\" class=\"w-4 h-4\"><\u002Fi><\u002Fspan>\n                    <div class=\"min-w-0 flex-1\">\n                        <h5 class=\"font-bold text-sm text-slate-100 truncate\">${b.title}<\u002Fh5>\n                        <p class=\"text-[11px] text-slate-400 mt-1\">${b.total_pages} صفحة · ${fmtDuration(mins)}<\u002Fp>\n                        <p class=\"text-[10px] text-slate-500 mt-0.5\">اكتمل في ${finishedOn}<\u002Fp>\n                    <\u002Fdiv>\n                <\u002Fdiv>`;\n            }).join('') + `<\u002Fdiv>`;\n            safeCreateIcons();\n        }\n\n        /* ========== المطلب 4: تحليل القراءة الدقيق ========== */\n        function fmtDuration(mins) {\n            const m = Math.max(0, Math.round(Number(mins) || 0));\n            if (m < 60) return `${m} دقيقة`;\n            const h = Math.floor(m / 60), r = m % 60;\n            return r ? `${h} ساعة و${r} دقيقة` : `${h} ساعة`;\n        }\n\n        function toggleRaBooks() {\n            const body = document.getElementById('raBooks');\n            const chev = document.getElementById('raBooksChevron');\n            if (!body) return;\n            const opening = body.classList.contains('hidden');\n            body.classList.toggle('hidden', !opening);\n            if (chev) chev.style.transform = opening ? 'rotate(180deg)' : 'none';\n            if (opening) safeCreateIcons();\n        }\n\n        function populateAnalysisBooks() {\n            const sel = document.getElementById('raScope');\n            if (!sel) return;\n            const keep = sel.value;\n            sel.innerHTML = '<option value=\"all\">كل الكتب<\u002Foption>';\n            globalBooks.forEach(b => sel.add(new Option(b.title, b.id)));\n            sel.value = Array.from(sel.options).some(o => o.value === keep) ? keep : 'all';\n        }\n\n        function onReadingAnalysisChange() {\n            const tf = document.getElementById('raTimeframe').value;\n            const box = document.getElementById('raCustomRange');\n            if (tf === 'custom') {\n                box.classList.remove('hidden'); box.classList.add('flex');\n                if (!document.getElementById('raStart').value) document.getElementById('raStart').value = getMonthStartStr(getTodayStr());\n                if (!document.getElementById('raEnd').value) document.getElementById('raEnd').value = getTodayStr();\n            } else { box.classList.add('hidden'); box.classList.remove('flex'); }\n            updateReadingAnalysis();\n        }\n\n        function getAnalysisRange() {\n            const tfEl = document.getElementById('raTimeframe');\n            const tf = tfEl ? tfEl.value : 'week';\n            const today = getTodayStr();\n            if (tf === 'day') return { start: today, end: today, label: 'اليوم' };\n            if (tf === 'month') return { start: getMonthStartStr(today), end: today, label: 'هذا الشهر' };\n            if (tf === 'year') return { start: getYearStartStr(today), end: today, label: 'هذه السنة' };\n            if (tf === 'custom') {\n                const s = (document.getElementById('raStart') || {}).value || getMonthStartStr(today);\n                const e = (document.getElementById('raEnd') || {}).value || today;\n                return s <= e ? { start: s, end: e, label: `من ${s} إلى ${e}` } : { start: e, end: s, label: `من ${e} إلى ${s}` };\n            }\n            return { start: getWeekStartStr(today), end: today, label: 'هذا الأسبوع' };\n        }\n\n        function daysBetween(a, b) {\n            const d = Math.round((parseLocalDate(b) - parseLocalDate(a)) / 86400000) + 1;\n            return Math.max(1, d);\n        }\n\n        function updateReadingAnalysis() {\n            const sumBox = document.getElementById('raSummary');\n            const booksBox = document.getElementById('raBooks');\n            if (!sumBox || !booksBox) return;\n\n            const { start, end, label } = getAnalysisRange();\n            const scopeEl = document.getElementById('raScope');\n            const scope = scopeEl ? scopeEl.value : 'all';\n            const labelEl = document.getElementById('raRangeLabel');\n            if (labelEl) labelEl.innerText = label + (scope === 'all' ? ' · كل الكتب' : ' · كتاب واحد');\n\n            const logs = globalReadingLogs.filter(l => l.date >= start && l.date <= end && (scope === 'all' || l.book_id === scope));\n            const pages = logs.reduce((s, l) => s + Number(l.pages_read || 0), 0);\n            const mins = logs.reduce((s, l) => s + Number(l.time_spent_mins || 0), 0);\n            const days = daysBetween(start, end);\n            const activeDays = new Set(logs.map(l => l.date)).size;\n\n            const tile = (icon, color, value, caption) => `<div class=\"glass-panel rounded-2xl border border-${color}-500/20 p-3.5\">\n                <div class=\"flex items-center gap-2 text-${color}-400 mb-1.5\"><i data-lucide=\"${icon}\" class=\"w-3.5 h-3.5\"><\u002Fi><span class=\"text-[10px] font-bold\">${caption}<\u002Fspan><\u002Fdiv>\n                <div class=\"text-lg font-black text-slate-100 leading-tight\">${value}<\u002Fdiv>\n            <\u002Fdiv>`;\n\n            sumBox.innerHTML =\n                tile('file-text', 'emerald', `${pages} صفحة`, 'الصفحات المقروءة') +\n                tile('clock', 'sky', fmtDuration(mins), 'زمن القراءة') +\n                tile('trending-up', 'violet', `${(pages / days).toFixed(1)} صفحة/يوم`, 'المتوسط اليومي') +\n                tile('calendar-check', 'amber', `${activeDays} من ${days} يوم`, 'أيام القراءة');\n\n            const scopedBooks = scope === 'all' ? globalBooks : globalBooks.filter(b => b.id === scope);\n            const overall = bookProgressMap();\n\n            if (!scopedBooks.length) {\n                booksBox.innerHTML = `<p class=\"text-xs text-slate-500 text-center py-4\">لا توجد كتب لتحليلها بعد.<\u002Fp>`;\n                safeCreateIcons();\n                return;\n            }\n\n            const rows = scopedBooks.map(b => {\n                const bLogs = logs.filter(l => l.book_id === b.id);\n                const p = bLogs.reduce((s, l) => s + Number(l.pages_read || 0), 0);\n                const m = bLogs.reduce((s, l) => s + Number(l.time_spent_mins || 0), 0);\n                const total = Number(b.total_pages || 0) || 1;\n                const periodPct = Math.min(100, (p / total) * 100);\n                const overallPct = Math.min(100, ((overall[b.id] || 0) / total) * 100);\n                return { b, p, m, periodPct, overallPct };\n            }).sort((x, y) => y.p - x.p);\n\n            const anyActivity = rows.some(r => r.p > 0 || r.m > 0);\n            booksBox.innerHTML = (anyActivity ? '' : `<p class=\"text-[11px] text-slate-500 mb-2\">لا توجد قراءة مسجّلة في هذه الفترة — الأشرطة تعرض تقدمك الإجمالي.<\u002Fp>`) +\n                rows.map(r => `<div class=\"glass-panel rounded-2xl border border-slate-800 px-4 py-3\">\n                    <div class=\"flex items-center justify-between gap-3 mb-2\">\n                        <span class=\"text-xs font-bold text-slate-200 truncate\">${r.b.title}<\u002Fspan>\n                        <span class=\"text-[11px] text-slate-400 shrink-0\">${r.p} صفحة · ${fmtDuration(r.m)}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div class=\"flex items-center gap-2\">\n                        <span class=\"text-[10px] font-bold text-emerald-400 w-10 shrink-0\">${r.periodPct.toFixed(1)}%<\u002Fspan>\n                        <div class=\"flex-1 h-2 bg-slate-950 rounded-full overflow-hidden relative\">\n                            <div class=\"absolute inset-y-0 right-0 bg-slate-700/60\" style=\"width:${r.overallPct.toFixed(1)}%\"><\u002Fdiv>\n                            <div class=\"absolute inset-y-0 right-0 bg-emerald-500\" style=\"width:${r.periodPct.toFixed(1)}%\"><\u002Fdiv>\n                        <\u002Fdiv>\n                        <span class=\"text-[10px] text-slate-500 w-24 shrink-0 text-left\">الإجمالي ${r.overallPct.toFixed(0)}%<\u002Fspan>\n                    <\u002Fdiv>\n                <\u002Fdiv>`).join('');\n            safeCreateIcons();\n        }\n\n        /* ========== المطلب 2: وقفة الجمعة التحفيزية ========== */\n        const FRIDAY_WEEKLY_TIPS = [\n            [\n                { d: 'الوقت', i: 'sunrise', t: 'أول ساعة بعد استيقاظك تُحدد إيقاع يومك بالكامل؛ لا تمنحها لأحد قبل أن تمنحها لأهم مهمة عندك.' },\n                { d: 'العمل', i: 'target', t: 'المهمة التي تؤجلها هي غالباً المهمة التي ستصنع الفرق. ابدأ بها وهي في أصعب صورها.' },\n                { d: 'المعرفة', i: 'book-open', t: 'اقرأ لتغيّر سلوكاً لا لتجمع معلومة؛ صفحة واحدة تُطبَّق أنفع من كتاب كامل يُنسى.' },\n                { d: 'المال', i: 'wallet', t: 'ادفع لنفسك أولاً: اقتطع نسبة ثابتة من كل دخل قبل أي مصروف، ولو كانت صغيرة.' },\n                { d: 'الصحة', i: 'heart-pulse', t: 'جسدك هو منصة كل إنجازاتك؛ النوم المنتظم ليس رفاهية بل بنية تحتية للأداء.' },\n                { d: 'العلاقات', i: 'users', t: 'استثمر في خمسة أشخاص بعمق، أنفع من خمسين بسطحية.' },\n                { d: 'النفس', i: 'compass', t: 'لا تنتظر الحافز؛ ابنِ نظاماً يعمل في الأيام التي لا تشعر فيها بشيء.' }\n            ],\n            [\n                { d: 'الوقت', i: 'timer', t: 'قِس وقتك أسبوعاً واحداً بصدق؛ الأرقام ستخبرك بما لا تجرؤ نفسك على قوله.' },\n                { d: 'العمل', i: 'award', t: 'الاحتراف أن تُسلّم بنفس الجودة في يومك السيئ كما في يومك الجيد.' },\n                { d: 'المعرفة', i: 'graduation-cap', t: 'علّم ما تعلمته خلال 24 ساعة؛ التعليم أعلى صور الفهم وأثبتها.' },\n                { d: 'المال', i: 'trending-up', t: 'الأصل الذي يشتري لك وقتاً أغلى بكثير من الأصل الذي يشتري لك مظهراً.' },\n                { d: 'الصحة', i: 'activity', t: 'حرّك جسدك كل تسعين دقيقة؛ صفاء الذهن نتيجة دورة دموية نشطة لا نتيجة قهوة إضافية.' },\n                { d: 'العلاقات', i: 'ear', t: 'أنصت حتى ينتهي الآخر تماماً، ثم اسأل سؤالاً واحداً ذكياً؛ هذا وحده يبني ثقة سنوات.' },\n                { d: 'النفس', i: 'shield', t: 'الانضباط أن تحترم قرار نفسك بالأمس حتى وإن تغيّر مزاجك اليوم.' }\n            ],\n            [\n                { d: 'الوقت', i: 'scissors', t: 'قل «لا» لعشرة أشياء جيدة لتقول «نعم» لشيء واحد عظيم.' },\n                { d: 'العمل', i: 'crosshair', t: 'لا تنافس على الكم؛ تميّز في زاوية ضيقة حتى تصبح المرجع فيها.' },\n                { d: 'المعرفة', i: 'git-merge', t: 'اجمع بين مجالين لا يجتمعان عادة، فهناك تُصنع القيمة النادرة التي لا تُقلَّد.' },\n                { d: 'المال', i: 'gem', t: 'ارفع سعرك عندما ترتفع نتيجتك، لا عندما ترتفع حاجتك.' },\n                { d: 'الصحة', i: 'battery-charging', t: 'الطاقة تُدار ولا تُستهلك: نم، تغذَّ، تحرّك، ثم أنجز — بهذا الترتيب لا غيره.' },\n                { d: 'العلاقات', i: 'handshake', t: 'اجعل التعامل معك سهلاً ونتيجتك مبهرة؛ هذا هو التسويق الحقيقي لاسمك.' },\n                { d: 'النفس', i: 'flag', t: 'قيّم نفسك بمعايير تقدمك أنت، لا بمعايير سباق لم تختره أصلاً.' }\n            ],\n            [\n                { d: 'الوقت', i: 'rotate-ccw', t: 'اختم كل أسبوع بمراجعة عشرين دقيقة: ما نفع؟ ما لم ينفع؟ ما القرار الواحد للأسبوع القادم؟' },\n                { d: 'العمل', i: 'folder-check', t: 'وثّق أعمالك أثناء إنجازها؛ الأثر غير الموثّق يضيع كأنه لم يكن.' },\n                { d: 'المعرفة', i: 'repeat', t: 'أعد قراءة أفضل كتاب قرأته هذا العام؛ العائد في القراءة الثانية أكبر مما تتوقع.' },\n                { d: 'المال', i: 'receipt', t: 'راجع اشتراكاتك ومصروفاتك المتكررة شهرياً؛ التسريبات الصغيرة هي التي تُغرق السفن.' },\n                { d: 'الصحة', i: 'moon', t: 'خذ يوم استعادة كاملاً؛ الراحة المخطط لها جزء من خطة الإنجاز لا خروجاً عنها.' },\n                { d: 'العلاقات', i: 'gift', t: 'اشكر شخصاً ساعدك بوضوح وتحديد؛ الامتنان الدقيق يعيد فتح كل الأبواب.' },\n                { d: 'النفس', i: 'mountain', t: 'القمة ليست حدثاً بل عادة: كن اليوم أفضل بواحد بالمئة، واترك الباقي للزمن.' }\n            ],\n            [\n                { d: 'الوقت', i: 'hourglass', t: 'ساعة واحدة بلا مقاطعة تصنع ما لا تصنعه أربع ساعات مبعثرة. اِحمِ هذه الساعة كما تحمي مالك.' },\n                { d: 'العمل', i: 'layers', t: 'ابنِ أنظمة تعمل بدونك؛ ما يعتمد على حضورك وحدك يبلغ حداً ثم يتوقف.' },\n                { d: 'المعرفة', i: 'pen-tool', t: 'لخّص ما تقرأه بصفحة واحدة بخط يدك؛ ما لا تستطيع تلخيصه لم تفهمه بعد.' },\n                { d: 'المال', i: 'shield-check', t: 'ابنِ صندوق طوارئ يكفي ثلاثة أشهر؛ الأمان المالي هو ما يمنحك حرية قول «لا».' },\n                { d: 'الصحة', i: 'droplets', t: 'ابدأ يومك بالماء والضوء الطبيعي قبل الشاشة؛ خطوتان بلا تكلفة تصلحان طاقة اليوم بأكمله.' },\n                { d: 'العلاقات', i: 'message-circle', t: 'تابع خلال يومين على وعد قطعته؛ الوفاء بالوعود الصغيرة هو رأس مالك الحقيقي عند الناس.' },\n                { d: 'النفس', i: 'sun', t: 'سامح نفسك على يوم انقطعت فيه، ثم عد فوراً في اليوم التالي. الانقطاع مرتين متتاليتين هو ما يهدم العادة، لا مرة واحدة.' }\n            ]\n        ];\n\n        function weekOfMonthIndex(dateStr) {\n            const d = parseLocalDate(dateStr || getTodayStr());\n            return Math.min(4, Math.floor((d.getDate() - 1) / 7));\n        }\n\n        // محرك قياس موحّد لأي نطاق زمني (يخدم وقفة الجمعة وانطلاقة الإثنين معاً)\n        function getRangeAchievements(startStr, endStr) {\n            const aLogs = globalActivityLogs.filter(l => l.date >= startStr && l.date <= endStr);\n            const rLogs = globalReadingLogs.filter(l => l.date >= startStr && l.date <= endStr);\n\n            const mins = aLogs.reduce((s, l) => s + Number(l.time_mins || 0), 0) + rLogs.reduce((s, l) => s + Number(l.time_spent_mins || 0), 0);\n            const tasks = aLogs.reduce((s, l) => s + Number(l.tasks_completed || 0), 0) + rLogs.length;\n            const pages = rLogs.reduce((s, l) => s + Number(l.pages_read || 0), 0);\n            const activeDays = new Set([...aLogs.map(l => l.date), ...rLogs.map(l => l.date)]).size;\n            const points = Math.floor(mins / 10) + tasks * 5;\n\n            const catMins = {};\n            aLogs.forEach(l => { catMins[l.category] = (catMins[l.category] || 0) + Number(l.time_mins || 0); });\n            if (rLogs.length) catMins['قراءة'] = (catMins['قراءة'] || 0) + rLogs.reduce((s, l) => s + Number(l.time_spent_mins || 0), 0);\n            const topCat = Object.entries(catMins).sort((a, b) => b[1] - a[1])[0];\n\n            // توزيع الدقائق على كل يوم داخل النطاق (لرسم أعمدة الأسبوع)\n            const dayMins = {};\n            aLogs.forEach(l => { dayMins[l.date] = (dayMins[l.date] || 0) + Number(l.time_mins || 0); });\n            rLogs.forEach(l => { dayMins[l.date] = (dayMins[l.date] || 0) + Number(l.time_spent_mins || 0); });\n\n            let booksDone = 0;\n            globalBooks.forEach(b => {\n                const bLogs = globalReadingLogs.filter(l => l.book_id === b.id).sort((x, y) => x.date < y.date ? -1 : 1);\n                let run = 0, crossedOn = null;\n                for (const l of bLogs) {\n                    run += Number(l.pages_read || 0);\n                    if (!crossedOn && Number(b.total_pages || 0) > 0 && run >= Number(b.total_pages)) crossedOn = l.date;\n                }\n                if (crossedOn && crossedOn >= startStr && crossedOn <= endStr) booksDone++;\n            });\n\n            return { start: startStr, end: endStr, today: endStr, mins, tasks, pages, activeDays, points, booksDone, sessions: aLogs.length + rLogs.length, topCat, catMins, dayMins };\n        }\n\n        function getWeekAchievements() {\n            const today = getTodayStr();\n            const r = getRangeAchievements(getWeekStartStr(today), today);\n            r.streak = calculateStreak();\n            return r;\n        }\n\n        let fridayStepIdx = 0;\n        function openFridayModal(manual) {\n            fridayStepIdx = 0;\n            const m = document.getElementById('fridayModal');\n            if (!m) return;\n            const wIdx = weekOfMonthIndex(getTodayStr());\n            const sub = document.getElementById('fridaySubtitle');\n            if (sub) sub.innerText = `الأسبوع ${wIdx + 1} من الشهر · ${manual ? 'عرض يدوي' : 'مراجعتك الأسبوعية'}`;\n            renderFridayStep();\n            m.classList.remove('hidden');\n            setTimeout(() => { m.classList.remove('opacity-0'); document.getElementById('fridayBox').classList.remove('scale-95'); }, 10);\n            if (!manual) localStorage.setItem('prod_friday_seen', getTodayStr());\n        }\n\n        function closeFridayModal() {\n            const m = document.getElementById('fridayModal');\n            if (!m) return;\n            m.classList.add('opacity-0');\n            document.getElementById('fridayBox').classList.add('scale-95');\n            setTimeout(() => m.classList.add('hidden'), 450);\n        }\n\n        function fridayStep(dir) {\n            const next = fridayStepIdx + dir;\n            if (next < 0) return;\n            if (next > 2) { closeFridayModal(); return; }\n            fridayStepIdx = next;\n            renderFridayStep();\n        }\n\n        function renderFridayStep() {\n            const body = document.getElementById('fridayBody');\n            if (!body) return;\n            const F = fridaySnapshot();\n            const s = F.s;\n            const wIdx = weekOfMonthIndex(getTodayStr());\n            const tips = FRIDAY_WEEKLY_TIPS[wIdx];\n            // المطلبان 3 و4: كل رقم في هذه النافذة يقرأ تعريفه ونصيحته من محرك واحد\n            setStatCtx('friday', s, F.p, `أسبوعك الحالي · ${toDMY(F.start)} — ${toDMY(F.today)}`, 'نفس عدد الأيام من الأسبوع الماضي');\n\n            if (fridayStepIdx === 0) {\n                body.innerHTML = `<div class=\"friday-slide-enter max-w-4xl mx-auto\">\n                    <p class=\"text-[11px] md:text-xs text-sky-400 font-bold mb-2\">من ${toDMY(F.start)} إلى ${toDMY(F.today)} · السبت بداية الأسبوع<\u002Fp>\n                    <h2 class=\"mw-h2 font-black text-white mb-2 leading-snug\">هذا ما أنجزته فعلاً هذا الأسبوع<\u002Fh2>\n                    <p class=\"text-xs md:text-sm text-slate-400 mb-5 md:mb-7 leading-relaxed\" style=\"text-wrap:pretty\">أرقامك لا تجامل ولا تبالغ. <b class=\"text-slate-200\">اضغط أي بطاقة<\u002Fb> لتعرف ما تقيسه بالضبط، وماذا تعني نسبتها، وأفضل نصيحة لحالتك فيها.<\u002Fp>\n\n                    ${mwTiles(['mins', 'tasks', 'pages', 'points', 'activeDays', 'streak'])}\n\n                    ${s.topCat ? `<div class=\"mt-3 md:mt-4 glass-panel rounded-2xl border border-white/10 px-4 py-3.5 flex items-start gap-3\">\n                        <span class=\"w-8 h-8 shrink-0 rounded-xl bg-sky-500/15 text-sky-300 border border-sky-400/25 flex items-center justify-center\"><i data-lucide=\"crown\" class=\"w-4 h-4\"><\u002Fi><\u002Fspan>\n                        <p class=\"text-xs md:text-sm text-slate-300\" style=\"text-wrap:pretty\">أكثر مجال استحوذ على تركيزك: <b class=\"text-white\">${mondayCatLabel(s.topCat[0])}<\u002Fb> بـ <b class=\"text-white\">${fmtDuration(s.topCat[1])}<\u002Fb>${s.booksDone ? ` · وأكملت <b class=\"text-emerald-400\">${s.booksDone}<\u002Fb> كتاباً 🎉` : ''}<\u002Fp>\n                    <\u002Fdiv>` : `<div class=\"mt-3 md:mt-4 glass-panel rounded-2xl border border-white/10 px-4 py-3.5 text-xs md:text-sm text-slate-400\" style=\"text-wrap:pretty\">لم تُسجّل نشاطاً هذا الأسبوع بعد — والأسبوع لم ينتهِ. سجّل إنجازاً واحداً الآن، ولو صغيراً، فالبداية هي أصعب خطوة.<\u002Fdiv>`}\n\n                    ${mwDomainBoard(s.domainRows, s.mins, 'كل مجال على حدة — ونصيحته', 'مقارنة بنفس أيام الأسبوع الماضي')}\n\n                    ${mwHeroAdvice('أفضل نصيحة لحالتك الآن', mwTopAdvice(['activeDays', 'mins', 'tasks', 'pages', 'streak']))}\n                <\u002Fdiv>`;\n\n            } else if (fridayStepIdx === 1) {\n                const P = fridayPickTip(s, tips);\n                body.innerHTML = `<div class=\"friday-slide-enter max-w-4xl mx-auto\">\n                    <p class=\"text-[11px] md:text-xs text-violet-400 font-bold mb-2\">نصائح الأسبوع ${wIdx + 1}<\u002Fp>\n                    <h2 class=\"mw-h2 font-black text-white mb-2 leading-snug\">سبع قواعد، واحدة لكل جانب من حياتك<\u002Fh2>\n                    <p class=\"text-xs md:text-sm text-slate-400 mb-4 md:mb-6 leading-relaxed\" style=\"text-wrap:pretty\">اختر واحدة فقط لتطبّقها هذا الأسبوع. التطبيق الواحد المتقَن يسبق سبع نصائح مقروءة.<\u002Fp>\n\n                    <div class=\"rounded-2xl border border-violet-500/35 p-4 md:p-5 mb-4\" style=\"background:rgba(139,92,246,.09)\">\n                        <div class=\"flex items-center gap-2 mb-2 text-violet-300 flex-wrap\">\n                            <i data-lucide=\"wand-sparkles\" class=\"w-4 h-4 shrink-0\"><\u002Fi>\n                            <span class=\"text-[11px] font-black\">الأنسب لك أنت هذا الأسبوع<\u002Fspan>\n                            <span class=\"text-[9px] font-black px-1.5 py-0.5 rounded-md bg-violet-500/15 border border-violet-500/30\">${P.tip.d}<\u002Fspan>\n                        <\u002Fdiv>\n                        <p class=\"text-xs md:text-sm text-slate-100 leading-relaxed mb-2\" style=\"text-wrap:pretty\">${P.tip.t}<\u002Fp>\n                        <p class=\"text-[10px] md:text-[11px] text-violet-300/80 leading-relaxed\" style=\"text-wrap:pretty\">اختيرت لك ${P.why}<\u002Fp>\n                    <\u002Fdiv>\n\n                    <div class=\"grid grid-cols-1 md:grid-cols-2 gap-2.5 md:gap-3 friday-stagger\">\n                        ${tips.map(t => `<div class=\"glass-panel rounded-2xl border ${t === P.tip ? 'border-violet-500/40' : 'border-white/10'} p-4 flex items-start gap-3\">\n                            <span class=\"w-9 h-9 shrink-0 rounded-xl bg-violet-500/15 text-violet-300 border border-violet-400/25 flex items-center justify-center\"><i data-lucide=\"${t.i}\" class=\"w-4 h-4\"><\u002Fi><\u002Fspan>\n                            <div class=\"min-w-0\">\n                                <span class=\"text-[10px] font-black text-violet-300 tracking-wide\">${t.d}<\u002Fspan>\n                                <p class=\"text-xs md:text-sm text-slate-200 leading-relaxed mt-1\" style=\"text-wrap:pretty\">${t.t}<\u002Fp>\n                            <\u002Fdiv>\n                        <\u002Fdiv>`).join('')}\n                    <\u002Fdiv>\n\n                    ${mwHeroAdvice('وقبل أن تختار — هذا ما تقوله أرقامك', mwTopAdvice(['mins', 'sessions', 'tasks', 'pages']))}\n                <\u002Fdiv>`;\n\n            } else {\n                const momentum = s.points >= 200 ? 'أنت في منطقة الأداء العالي. حافظ على النظام ولا تزد الحمل، فالثبات هنا أثمن من الاندفاع.'\n                    : s.points >= 80 ? 'إيقاعك سليم ومتماسك. زد ساعة مركّزة واحدة أسبوعياً فقط، وستشعر بالفرق بعد شهر.'\n                    : 'البداية الصادقة أهم من البداية الكبيرة. التزم بثلاثين دقيقة يومياً هذا الأسبوع، ودع التراكم يعمل لصالحك.';\n                const weak = s.domainRows.slice().sort((a, b) => a.m - b.m)[0];\n                body.innerHTML = `<div class=\"friday-slide-enter max-w-3xl mx-auto py-2 md:py-6\">\n                    <div class=\"text-center\">\n                        <div class=\"w-14 h-14 md:w-20 md:h-20 mx-auto rounded-3xl bg-gradient-to-tr from-sky-500/20 to-violet-500/20 border border-sky-400/30 text-sky-300 flex items-center justify-center mb-5\"><i data-lucide=\"mountain\" class=\"w-7 h-7 md:w-10 md:h-10\"><\u002Fi><\u002Fdiv>\n                        <h2 class=\"mw-h2 font-black text-white mb-3 leading-snug\">القمة ليست مكاناً تصله، بل مستوى تصير عليه<\u002Fh2>\n                        <p class=\"text-sm md:text-base text-slate-300 leading-relaxed mb-5\" style=\"text-wrap:pretty\">${momentum}<\u002Fp>\n                    <\u002Fdiv>\n\n                    <div class=\"glass-panel rounded-2xl border border-white/10 p-4 md:p-6 text-right\">\n                        <p class=\"text-[11px] font-black text-amber-400 mb-2\">قرار الأسبوع القادم<\u002Fp>\n                        <p class=\"text-xs md:text-sm text-slate-300 leading-relaxed\" style=\"text-wrap:pretty\">اكتب الآن — ذهنياً أو في توجيهاتك — جملة واحدة: «الأسبوع القادم سأفعل ... يومياً في الساعة ...». النية المحددة بوقت تتحقق أضعافَ النية العامة.<\u002Fp>\n                    <\u002Fdiv>\n\n                    ${weak ? mwHeroAdvice('نصيحة المجال الأقل نصيباً هذا الأسبوع', mwDomainAdvice(weak, s.mins)) : ''}\n                    ${mwHeroAdvice('وأفضل نصيحة لحالتك العامة', mwTopAdvice(['activeDays', 'mins', 'points', 'streak']))}\n\n                    <p class=\"text-[11px] text-slate-500 mt-5 text-center\">سلسلتك الحالية ${mondayPluralDays(s.streak)} · ${mondayPluralSessions(s.sessions)} هذا الأسبوع · ${fmtDuration(s.mins)} إجمالاً<\u002Fp>\n                <\u002Fdiv>`;\n            }\n\n            const dots = document.getElementById('fridayDots');\n            if (dots) dots.innerHTML = [0, 1, 2].map(i => `<span class=\"h-1.5 rounded-full transition-all duration-500 ${i === fridayStepIdx ? 'w-7 bg-sky-400' : 'w-1.5 bg-slate-600'}\"><\u002Fspan>`).join('');\n            const counter = document.getElementById('fridayCounter');\n            if (counter) counter.textContent = `${fridayStepIdx + 1} من 3`;\n            const prev = document.getElementById('fridayPrevBtn');\n            const next = document.getElementById('fridayNextBtn');\n            if (prev) prev.style.visibility = fridayStepIdx === 0 ? 'hidden' : 'visible';\n            if (next) next.innerText = fridayStepIdx === 2 ? 'لننطلق' : 'التالي';\n            mwResetScroll('fridayBody');\n            bindWindowSwipe('fridayBody', fridayStep);\n            safeCreateIcons();\n        }\n\n        function maybeShowFridayWindow() {\n            const today = getTodayStr();\n            if (parseLocalDate(today).getDay() !== 5) return;\n            if (localStorage.getItem('prod_friday_seen') === today) return;\n            setTimeout(() => openFridayModal(false), 1400);\n        }\n\n        /* ===================== المطلب 1: مركز المجالات =====================\n           قسم كامل لإنشاء مجال/قسم جديد (تصوير فوتوغرافي، تصميم جرافيكي، تتبّع عادات...)\n           يعمل بنفس كفاءة المجالات الأصلية تماماً، لأنه يكتب في نفس مستودع البيانات\n           (globalActivityLogs) بنفس الشكل الذي تكتب به «مشروع التصوير» و«إدارة الأعمال».\n\n           لماذا لا مستودع منفصل؟ لأن كل محرك في النظام — السلسلة، مؤشرات الأداء، التقارير\n           الشاملة، المحلل المتقدّم، لوحة التوازن، وقفة الجمعة، انطلاقة الإثنين، المزامنة،\n           والتصدير — يقرأ من globalActivityLogs. فبإعادة استخدامه يصير المجال الجديد\n           جزءاً أصيلاً من النظام لحظة إنشائه، بلا أي تعديل في تلك المحركات.\n\n           التخزين: prod_domains — تعريفات المجالات فقط (اسم، نوع، وحدة، هدف، لون، أيقونة).\n           السجلات نفسها تبقى في مستودع الأنشطة، ومفتاح الربط هو حقل category. */\n\n        let domainDefs = [];\n        let domainNavSig = '';       // بصمة بنيوية: نعيد بناء الأقسام فقط عند تغيّرها فعلاً\n        let domainDraft = null;      // مسودة النموذج الحالية (إنشاء أو تعديل)\n\n        // ثلاثة أنواع تغطي كل ما يحتاجه المستخدم، ولكل نوع وحدات قياس ومنطق إدخال مختلف\n        const DOMAIN_KINDS = [\n            {\n                k: 'time', label: 'مجال زمني', icon: 'clock', tone: '#38bdf8',\n                tag: 'يُقاس بالوقت المركّز',\n                desc: 'للمجالات التي تُقاس بعمق الجلسة وطول التركيز: التصوير، المونتاج، البرمجة، التعلّم.',\n                units: ['دقيقة', 'ساعة', 'جلسة', 'مهمة'], defUnit: 'دقيقة', defTarget: 45,\n                countLabel: 'مهام منجزة', countPh: 'مهام (اختياري)', timeRequired: true\n            },\n            {\n                k: 'output', label: 'مجال إنتاجي', icon: 'layers', tone: '#a855f7',\n                tag: 'يُقاس بالمخرجات',\n                desc: 'للمجالات التي يهمّ فيها العدد الملموس: تصاميم مُسلَّمة، صور محرَّرة، مقالات، نماذج.',\n                units: ['مخرج', 'مهمة', 'دقيقة', 'ساعة'], defUnit: 'مخرج', defTarget: 3,\n                countLabel: 'مخرجات', countPh: 'عدد المخرجات', timeRequired: false\n            },\n            {\n                k: 'habit', label: 'تتبّع عادة', icon: 'repeat', tone: '#10b981',\n                tag: 'يُقاس بالالتزام اليومي',\n                desc: 'للعادات التي يهمّ فيها التكرار لا الكمّ: رياضة، ورد يومي، ماء، نوم مبكر، مشي.',\n                units: ['يوم', 'مرة', 'دقيقة'], defUnit: 'يوم', defTarget: 1,\n                countLabel: 'تكرارات', countPh: 'عدد المرات', timeRequired: false\n            }\n        ];\n\n        // لوحة ألوان متناسقة مع هوية النظام، لكل لون اسم عربي يفهمه المستخدم\n        const DOMAIN_COLORS = [\n            { hex: '#10b981', n: 'زمرّدي' }, { hex: '#14b8a6', n: 'فيروزي' },\n            { hex: '#38bdf8', n: 'سماوي' }, { hex: '#3b82f6', n: 'أزرق' },\n            { hex: '#6366f1', n: 'نيلي' }, { hex: '#8b5cf6', n: 'بنفسجي' },\n            { hex: '#a855f7', n: 'أرجواني' }, { hex: '#ec4899', n: 'وردي' },\n            { hex: '#f43f5e', n: 'قرمزي' }, { hex: '#f97316', n: 'برتقالي' },\n            { hex: '#f59e0b', n: 'كهرماني' }, { hex: '#eab308', n: 'ذهبي' },\n            { hex: '#84cc16', n: 'ليموني' }, { hex: '#64748b', n: 'رمادي' }\n        ];\n\n        // أيقونات مختارة ومجرَّبة من المكتبة المرفقة، مصنّفة ليجد المستخدم مراده في ثوانٍ\n        const DOMAIN_ICON_GROUPS = [\n            { g: 'إبداع وفنون', items: ['camera', 'aperture', 'image', 'palette', 'brush', 'pen-tool', 'shapes', 'film', 'clapperboard', 'video', 'music', 'mic', 'headphones', 'feather'] },\n            { g: 'عمل وأعمال', items: ['briefcase', 'trending-up', 'target', 'handshake', 'presentation', 'megaphone', 'store', 'coins', 'piggy-bank', 'receipt', 'wallet', 'chart-pie'] },\n            { g: 'تعلّم ومعرفة', items: ['book-open', 'library', 'graduation-cap', 'languages', 'notebook-pen', 'lightbulb', 'microscope', 'telescope', 'atom', 'calculator', 'pencil-ruler'] },\n            { g: 'تقنية وبرمجة', items: ['cpu', 'code', 'terminal', 'database', 'bot', 'git-branch', 'server', 'smartphone', 'brain'] },\n            { g: 'صحة ورياضة', items: ['heart-pulse', 'dumbbell', 'footprints', 'bike', 'activity', 'apple', 'utensils', 'droplets', 'bed-double', 'moon'] },\n            { g: 'روح وسكينة', items: ['moon-star', 'sparkles', 'hand-heart', 'sunrise', 'compass', 'scroll', 'flame', 'heart'] },\n            { g: 'حياة وتنظيم', items: ['home', 'users', 'calendar-check', 'list-checks', 'clipboard-list', 'leaf', 'tree-pine', 'car', 'plane', 'globe', 'shopping-bag', 'gem', 'trophy', 'flag', 'puzzle'] }\n        ];\n\n        // قوالب جاهزة: ضغطة واحدة تملأ النموذج بمجال مضبوط بالكامل\n        const DOMAIN_TEMPLATES = [\n            { name: 'التصوير الفوتوغرافي', emoji: '📷', icon: 'aperture', color: '#f59e0b', kind: 'time', unit: 'دقيقة', target: 60, desc: 'جلسات التصوير الميداني، ضبط الإضاءة، واختيار اللقطات.' },\n            { name: 'التصميم الجرافيكي', emoji: '🎨', icon: 'palette', color: '#a855f7', kind: 'output', unit: 'مخرج', target: 2, desc: 'هويات بصرية، منشورات، وواجهات — يُقاس بما يُسلَّم فعلاً.' },\n            { name: 'تتبّع العادات', emoji: '🔁', icon: 'repeat', color: '#10b981', kind: 'habit', unit: 'يوم', target: 1, desc: 'التزامك اليومي بعادة اخترتها — الحضور أهم من الكمية.' },\n            { name: 'المونتاج والتحرير', emoji: '🎬', icon: 'clapperboard', color: '#38bdf8', kind: 'time', unit: 'دقيقة', target: 45, desc: 'قصّ، تصحيح ألوان، وإخراج المقاطع النهائية.' },\n            { name: 'الرياضة واللياقة', emoji: '🏋️', icon: 'dumbbell', color: '#f97316', kind: 'habit', unit: 'يوم', target: 1, desc: 'تمرين منتظم يحمي طاقتك التي تُنجز بها كل شيء آخر.' },\n            { name: 'الورد اليومي', emoji: '🌙', icon: 'moon-star', color: '#14b8a6', kind: 'habit', unit: 'يوم', target: 1, desc: 'وردك الثابت — سكينة تضبط إيقاع يومك كله.' },\n            { name: 'تعلّم اللغات', emoji: '🗣️', icon: 'languages', color: '#6366f1', kind: 'time', unit: 'دقيقة', target: 30, desc: 'مفردات، استماع، ومحادثة — التراكم اليومي هو السرّ.' },\n            { name: 'البرمجة والتطوير', emoji: '💻', icon: 'code', color: '#3b82f6', kind: 'time', unit: 'دقيقة', target: 60, desc: 'بناء، تصحيح، ومراجعة الشيفرة في مشاريع حقيقية.' },\n            { name: 'الكتابة والتدوين', emoji: '✍️', icon: 'feather', color: '#ec4899', kind: 'output', unit: 'مخرج', target: 1, desc: 'مقالات ومسوّدات — ما يُكتب يُفكَّر فيه مرتين.' },\n            { name: 'التسويق والمحتوى', emoji: '📣', icon: 'megaphone', color: '#f43f5e', kind: 'output', unit: 'مخرج', target: 2, desc: 'منشورات، حملات، وتحليل أداء القنوات.' },\n            { name: 'صحة ونوم', emoji: '🌿', icon: 'leaf', color: '#84cc16', kind: 'habit', unit: 'يوم', target: 1, desc: 'نوم منتظم وتغذية متوازنة — بنيتك التحتية للأداء.' },\n            { name: 'المالية الشخصية', emoji: '💰', icon: 'piggy-bank', color: '#eab308', kind: 'output', unit: 'مهمة', target: 1, desc: 'مراجعة المصروفات، الادخار، وضبط الاشتراكات.' }\n        ];\n\n        function domainKind(k) { return DOMAIN_KINDS.find(x => x.k === k) || DOMAIN_KINDS[0]; }\n        function domainById(id) { return domainDefs.find(d => d.id === id) || null; }\n        function domainByCat(cat) { return domainDefs.find(d => d.cat === cat) || null; }\n        function domainCats() { return domainDefs.map(d => d.cat); }\n        function domainLabel(cat) { const d = domainByCat(cat); return d ? d.name : cat; }\n\n        // المجالات الأصلية محجوزة: لا يجوز أن ينشئ المستخدم مجالاً يصطدم بمفاتيحها\n        const RESERVED_CATS = ['Photography', 'Business', 'AI', 'قراءة', 'Reading', 'all'];\n\n        function loadDomains() {\n            try { domainDefs = JSON.parse(localStorage.getItem('prod_domains')) || []; } catch (e) { domainDefs = []; }\n            if (!Array.isArray(domainDefs)) domainDefs = [];\n            // تطبيع دفاعي: أي حقل ناقص (من نسخة أقدم أو استيراد جزئي) يأخذ قيمة آمنة\n            domainDefs = domainDefs.filter(d => d && d.id && d.cat).map((d, i) => {\n                const kd = domainKind(d.kind);\n                return {\n                    id: d.id, cat: String(d.cat), name: String(d.name || d.cat),\n                    emoji: d.emoji || '✨', icon: d.icon || kd.icon, color: d.color || '#38bdf8',\n                    kind: kd.k, unit: kd.units.includes(d.unit) ? d.unit : kd.defUnit,\n                    target: Math.max(0, Number(d.target) || kd.defTarget),\n                    desc: String(d.desc || ''), created: d.created || getTodayStr(),\n                    order: Number.isFinite(Number(d.order)) ? Number(d.order) : i\n                };\n            }).sort((a, b) => a.order - b.order);\n        }\n\n        function saveDomains() {\n            domainDefs.forEach((d, i) => { d.order = i; });\n            localStorage.setItem('prod_domains', JSON.stringify(domainDefs));\n            if (typeof touchLocalTs === 'function') { touchLocalTs(); queueSyncPush(); }\n        }\n\n        /* ---------- قياس أداء مجال واحد ---------- */\n\n        function domainLogs(d) {\n            return globalActivityLogs.filter(l => l.category === d.cat);\n        }\n\n        // كل أرقام المجال في نطاق زمني واحد، بنفس تعريفات بقية النظام تماماً\n        function domainMeasure(d, startStr, endStr) {\n            const end = endStr || getTodayStr();\n            let mins = 0, count = 0, sessions = 0;\n            const dayset = new Set();\n            globalActivityLogs.forEach(l => {\n                if (l.category !== d.cat || l.date < startStr || l.date > end) return;\n                mins += Number(l.time_mins) || 0;\n                count += Number(l.tasks_completed) || 0;\n                sessions++;\n                dayset.add(l.date);\n            });\n            return { mins, count, sessions, days: dayset.size, dates: dayset };\n        }\n\n        // تحويل القياس إلى وحدة المجال المختارة (يخدم الهدف وشريط التقدّم ولوحة التوازن)\n        function domainValueIn(m, unit) {\n            if (unit === 'دقيقة') return m.mins;\n            if (unit === 'ساعة') return Math.round(m.mins / 6) / 10;\n            if (unit === 'جلسة') return m.sessions;\n            if (unit === 'يوم') return m.days;\n            return m.count; // مهمة / مخرج / مرة\n        }\n\n        function domainUnitFmt(v, unit) {\n            const n = Number.isInteger(v) ? v : Math.round(v * 10) / 10;\n            return n + ' ' + unit;\n        }\n\n        // سلسلة الالتزام الخاصة بالمجال وحده (متصلة حتى اليوم أو حتى أمس)\n        function domainStreak(d) {\n            const dates = new Set(domainLogs(d).map(l => l.date));\n            if (!dates.size) return 0;\n            const today = getTodayStr();\n            let cur = dates.has(today) ? today : addDaysStr(today, -1);\n            if (!dates.has(cur)) return 0;\n            let n = 0, guard = 0;\n            while (dates.has(cur) && guard < 4000) { n++; cur = addDaysStr(cur, -1); guard++; }\n            return n;\n        }\n\n        function domainStats(d) {\n            const today = getTodayStr();\n            const all = domainMeasure(d, '0000-01-01', today);\n            const day = domainMeasure(d, today, today);\n            const week = domainMeasure(d, getWeekStartStr(today), today);\n            const month = domainMeasure(d, getMonthStartStr(today), today);\n            const logs = domainLogs(d).slice().sort((a, b) => a.date < b.date ? 1 : -1);\n            return {\n                all, day, week, month,\n                last: logs.length ? logs[0].date : null,\n                streak: domainStreak(d),\n                target: { day: d.target, week: d.target * 7, month: d.target * 30 }\n            };\n        }\n\n        /* ---------- بناء القائمة الجانبية وأقسام المجالات ---------- */\n\n        // بصمة بنيوية: recalculateSystem() يُستدعى كثيراً، ولا يجوز إعادة بناء نماذج\n        // الإدخال في كل مرة (فتضيع القيمة التي يكتبها المستخدم الآن). نعيد البناء فقط\n        // حين يتغيّر شيء بنيوي: إضافة مجال أو حذفه أو تعديل هويته.\n        function domainSig() {\n            return domainDefs.map(d => [d.id, d.name, d.icon, d.color, d.emoji, d.kind, d.unit, d.target].join('~')).join('|');\n        }\n\n        function renderDomainNav() {\n            const nav = document.getElementById('domainNav');\n            if (!nav) return;\n            nav.innerHTML = domainDefs.map(d => `<button onclick=\"switchTab('dom-${d.id}')\" id=\"btn-dom-${d.id}\" class=\"menu-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-300 hover:bg-slate-800 hover:text-white transition-all font-semibold text-sm\">\n                <i data-lucide=\"${d.icon}\" class=\"w-5 h-5 shrink-0\" style=\"color:${ink(d.color)}\"><\u002Fi>\n                <span class=\"truncate\">${escAttr(d.name)}<\u002Fspan>\n            <\u002Fbutton>`).join('');\n        }\n\n        // تهريب آمن لأي نص يكتبه المستخدم قبل حقنه في HTML\n        function escAttr(s) {\n            return String(s == null ? '' : s)\n                .replace(/&/g, '&amp;').replace(/<\u002Fg, '&lt;').replace(/>/g, '&gt;')\n                .replace(/\"/g, '&quot;').replace(/'/g, '&#39;');\n        }\n\n        function renderDomainSections() {\n            const host = document.getElementById('domainSections');\n            if (!host) return;\n            host.innerHTML = domainDefs.map(d => {\n                const kd = domainKind(d.kind);\n                const isHabit = d.kind === 'habit';\n                return `<section id=\"tab-dom-${d.id}\" class=\"tab-content hidden space-y-6 animate-fade-in\">\n                    <div class=\"flex flex-col sm:flex-row sm:items-center justify-between gap-3\">\n                        <div class=\"flex items-center gap-3 min-w-0\">\n                            <span class=\"w-11 h-11 shrink-0 rounded-2xl flex items-center justify-center text-lg border\" style=\"color:${ink(d.color)};background:${d.color}1a;border-color:${d.color}40\">${d.emoji}<\u002Fspan>\n                            <div class=\"min-w-0\">\n                                <h2 class=\"text-xl md:text-2xl font-bold truncate\" style=\"color:${ink(d.color)}\">${escAttr(d.name)}<\u002Fh2>\n                                <p class=\"text-[11px] text-slate-400 truncate\">${escAttr(d.desc) || kd.tag}<\u002Fp>\n                            <\u002Fdiv>\n                        <\u002Fdiv>\n                        <div class=\"flex items-center gap-2 shrink-0\">\n                            <span class=\"text-[10px] font-black px-2.5 py-1 rounded-lg border\" style=\"color:${ink(d.color)};background:${d.color}14;border-color:${d.color}3d\">${kd.label}<\u002Fspan>\n                            <button onclick=\"openDomainEditor('${d.id}')\" title=\"تعديل المجال\" class=\"w-9 h-9 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300 flex items-center justify-center transition\"><i data-lucide=\"settings\" class=\"w-4 h-4\"><\u002Fi><\u002Fbutton>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n\n                    <div id=\"domHead-${d.id}\" class=\"grid grid-cols-2 lg:grid-cols-4 gap-3\"><\u002Fdiv>\n\n                    <div class=\"grid grid-cols-1 lg:grid-cols-3 gap-6\">\n                        <div class=\"glass-panel p-5 md:p-6 rounded-3xl h-fit border\" style=\"border-color:${d.color}33\">\n                            <h3 class=\"font-bold text-sm mb-4 flex items-center gap-2\" style=\"color:${ink(d.color)}\"><i data-lucide=\"${d.icon}\" class=\"w-4 h-4\"><\u002Fi> ${isHabit ? 'تسجيل التزام اليوم' : 'تسجيل نشاط جديد'}<\u002Fh3>\n                            <form id=\"domForm-${d.id}\" class=\"space-y-3\">\n                                <input type=\"date\" id=\"domDate-${d.id}\" required class=\"w-full glass-panel border border-slate-700 rounded-xl px-4 py-3 text-sm\">\n                                <div class=\"grid grid-cols-2 gap-3\">\n                                    <input type=\"number\" id=\"domTime-${d.id}\" min=\"0\" ${kd.timeRequired ? 'required' : ''} placeholder=\"${kd.timeRequired ? 'دقائق' : 'دقائق (اختياري)'}\" class=\"w-full glass-panel border border-slate-700 rounded-xl px-4 py-3 text-sm\">\n                                    <input type=\"number\" id=\"domCount-${d.id}\" min=\"0\" ${kd.timeRequired ? '' : 'required'} placeholder=\"${kd.countPh}\" class=\"w-full glass-panel border border-slate-700 rounded-xl px-4 py-3 text-sm\">\n                                <\u002Fdiv>\n                                <textarea id=\"domNotes-${d.id}\" placeholder=\"ماذا أنجزت؟ (اختياري)\" class=\"w-full h-24 glass-panel border border-slate-700 rounded-xl px-4 py-3 text-sm resize-none\"><\u002Ftextarea>\n                                <button type=\"submit\" class=\"on-accent w-full text-white py-3 rounded-xl font-bold transition hover:brightness-110\" style=\"background:${solidInk(d.color)}\">${isHabit ? 'تثبيت التزام اليوم' : 'تسجيل النشاط'}<\u002Fbutton>\n                            <\u002Fform>\n                            ${isHabit ? `<div class=\"mt-5 pt-4 border-t border-white/10\">\n                                <p class=\"text-[11px] font-black text-slate-400 mb-2.5\">أسبوعك الحالي · من السبت إلى الجمعة<\u002Fp>\n                                <div id=\"domWeek-${d.id}\" class=\"grid grid-cols-7 gap-1.5\"><\u002Fdiv>\n                            <\u002Fdiv>` : ''}\n                        <\u002Fdiv>\n                        <div class=\"lg:col-span-2 glass-panel p-5 md:p-6 rounded-3xl\">\n                            <h3 class=\"font-bold text-slate-300 mb-4 text-sm\">سجل الإنجازات<\u002Fh3>\n                            <div id=\"domLogs-${d.id}\" class=\"space-y-3 max-h-[500px] overflow-y-auto pr-2 custom-scrollbar\"><\u002Fdiv>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n                <\u002Fsection>`;\n            }).join('');\n\n            // ربط النماذج بعد بنائها، وتركيب محتسب المدة الذكي على كل حقل زمني جديد\n            domainDefs.forEach(d => {\n                const f = document.getElementById('domForm-' + d.id);\n                if (f) f.addEventListener('submit', e => { e.preventDefault(); submitDomainLog(d.id); });\n                const dt = document.getElementById('domDate-' + d.id);\n                if (dt && !dt.value) dt.value = todayStr;\n                mountDurationPicker('domTime-' + d.id, d.color, escAttr(d.name) + ' — زمن الجلسة بالدقائق');\n            });\n        }\n\n        function submitDomainLog(id) {\n            const d = domainById(id);\n            if (!d) return;\n            const kd = domainKind(d.kind);\n            const dateEl = document.getElementById('domDate-' + id);\n            const timeEl = document.getElementById('domTime-' + id);\n            const cntEl = document.getElementById('domCount-' + id);\n            const noteEl = document.getElementById('domNotes-' + id);\n            const mins = Math.max(0, Number(timeEl.value) || 0);\n            // العادة بلا عدد صريح تُحتسب مرة واحدة: حضورك اليوم هو الرقم المهم فيها\n            let count = Math.max(0, Number(cntEl.value) || 0);\n            if (!count && (d.kind === 'habit' || !kd.timeRequired)) count = 1;\n            if (mins <= 0 && count <= 0) { showToast('أدخل مدة أو عدداً واحداً على الأقل'); return; }\n\n            globalActivityLogs.push({\n                id: 'a_' + Date.now(), category: d.cat, date: dateEl.value || todayStr,\n                time_mins: mins, tasks_completed: count, notes: noteEl.value.trim()\n            });\n            saveLocalData(); recalculateSystem();\n            showToast(d.emoji + ' تم التسجيل في ' + d.name);\n            timeEl.value = ''; cntEl.value = ''; noteEl.value = '';\n            dateEl.value = todayStr;\n        }\n\n        /* ---------- تحديث الأرقام والسجلات (يُستدعى في كل إعادة حساب) ---------- */\n\n        function renderDomainHeads() {\n            domainDefs.forEach(d => {\n                const box = document.getElementById('domHead-' + d.id);\n                if (!box) return;\n                const s = domainStats(d);\n                const dayVal = domainValueIn(s.day, d.unit);\n                const weekVal = domainValueIn(s.week, d.unit);\n                const pct = d.target > 0 ? Math.min(100, (dayVal / d.target) * 100) : (dayVal > 0 ? 100 : 0);\n                const mini = (icon, value, caption, extra) => `<div class=\"glass-panel rounded-2xl border p-3.5\" style=\"border-color:${d.color}26\">\n                    <div class=\"flex items-center gap-1.5 mb-1.5\" style=\"color:${ink(d.color)}\"><i data-lucide=\"${icon}\" class=\"w-3.5 h-3.5 shrink-0\"><\u002Fi><span class=\"text-[10px] font-bold leading-tight\">${caption}<\u002Fspan><\u002Fdiv>\n                    <div class=\"text-lg md:text-xl font-black text-white leading-none\">${value}<\u002Fdiv>\n                    ${extra ? `<p class=\"text-[9px] text-slate-500 mt-1.5 leading-tight\">${extra}<\u002Fp>` : ''}\n                <\u002Fdiv>`;\n                box.innerHTML =\n                    mini('target', domainUnitFmt(dayVal, d.unit), 'اليوم', `الهدف ${domainUnitFmt(d.target, d.unit)} · ${Math.round(pct)}%`) +\n                    mini('calendar-range', domainUnitFmt(weekVal, d.unit), 'هذا الأسبوع', `${s.week.days} من 7 أيام نشطة`) +\n                    mini('flame', s.streak + ' يوم', 'سلسلة المجال', s.last ? 'آخر نشاط ' + toDMY(s.last) : 'لم تبدأ بعد') +\n                    mini('layers', fmtDuration(s.all.mins), 'إجمالي الوقت', `${s.all.sessions} جلسة · ${s.all.count} ${domainKind(d.kind).countLabel}`);\n\n                const wk = document.getElementById('domWeek-' + d.id);\n                if (wk) {\n                    const start = getWeekStartStr(getTodayStr());\n                    const today = getTodayStr();\n                    wk.innerHTML = Array.from({ length: 7 }, (_, i) => {\n                        const ds = addDaysStr(start, i);\n                        const on = s.all.dates.has(ds);\n                        const future = ds > today;\n                        return `<div class=\"flex flex-col items-center gap-1\" title=\"${dayNameOf(ds)} ${toDMY(ds)}\">\n                            <span class=\"w-full aspect-square rounded-lg border flex items-center justify-center text-[11px] font-black\"\n                                style=\"${on ? `background:${d.color}2e;border-color:${d.color}80;color:${ink(d.color)}` : 'background:rgba(148,163,184,.10);border-color:rgba(148,163,184,.20);color:#64748b'};${future ? 'opacity:.4' : ''}\">${on ? '✓' : (future ? '·' : '—')}<\u002Fspan>\n                            <span class=\"text-[8px] font-bold ${on ? 'text-slate-300' : 'text-slate-600'}\">${dayNameOf(ds).replace('ال', '')}<\u002Fspan>\n                        <\u002Fdiv>`;\n                    }).join('');\n                }\n            });\n        }\n\n        function renderDomainLogsAll() {\n            domainDefs.forEach(d => {\n                const c = document.getElementById('domLogs-' + d.id);\n                if (!c) return;\n                const kd = domainKind(d.kind);\n                const logs = domainLogs(d).sort((a, b) => a.date < b.date ? 1 : -1);\n                if (!logs.length) {\n                    c.innerHTML = `<div class=\"flex flex-col items-center justify-center py-12 text-center opacity-70\">\n                        <div class=\"w-16 h-16 rounded-full flex items-center justify-center mb-4 text-2xl\" style=\"background:${d.color}1a\">${d.emoji}<\u002Fdiv>\n                        <p class=\"text-sm text-slate-400 max-w-xs leading-relaxed\">${escAttr(d.desc) || 'لا سجلات بعد في هذا المجال.'}<br><span class=\"text-slate-500\">سجّل أول نشاط الآن من النموذج المجاور.<\u002Fspan><\u002Fp>\n                    <\u002Fdiv>`;\n                    return;\n                }\n                c.innerHTML = logs.map(l => `<div class=\"glass-panel p-4 rounded-2xl flex items-start gap-3 group relative border\" style=\"border-color:${d.color}1f\">\n                    <div class=\"absolute top-2 left-2 flex gap-1 opacity-0 group-hover:opacity-100 focus-within:opacity-100 transition\">\n                        <button onclick=\"openEditModal('activity_logs','${l.id}')\" class=\"text-blue-400 p-1 bg-slate-800 rounded\"><i data-lucide=\"edit-2\" class=\"w-3.5 h-3.5\"><\u002Fi><\u002Fbutton>\n                        <button onclick=\"deleteItem('activity_logs','${l.id}')\" class=\"text-rose-500 p-1 bg-slate-800 rounded\"><i data-lucide=\"trash-2\" class=\"w-3.5 h-3.5\"><\u002Fi><\u002Fbutton>\n                    <\u002Fdiv>\n                    <div class=\"p-2 rounded-xl mt-1 shrink-0\" style=\"background:${d.color}1a;color:${ink(d.color)}\"><i data-lucide=\"${d.icon}\" class=\"w-5 h-5\"><\u002Fi><\u002Fdiv>\n                    <div class=\"flex-1 w-full min-w-0\">\n                        <div class=\"flex justify-between items-center gap-2\">\n                            <span class=\"text-xs text-slate-400\">${toDMY(l.date)} · ${dayNameOf(l.date)}<\u002Fspan>\n                            ${Number(l.time_mins) > 0 ? `<span class=\"text-xs font-bold bg-slate-950 px-2 py-0.5 rounded-full border shrink-0\" style=\"color:${ink(d.color)};border-color:${d.color}33\">${formatDuration(l.time_mins)}<\u002Fspan>` : ''}\n                        <\u002Fdiv>\n                        <p class=\"text-sm font-semibold mt-2 pr-8 text-slate-200\" style=\"text-wrap:pretty\">${escAttr(l.notes) || 'بدون تفاصيل'}<\u002Fp>\n                        <p class=\"text-[10px] text-slate-500 mt-1\">${kd.countLabel}: ${Number(l.tasks_completed) || 0}<\u002Fp>\n                    <\u002Fdiv>\n                <\u002Fdiv>`).join('');\n            });\n        }\n\n        // نقطة الدخول الموحّدة: تُستدعى من recalculateSystem() في كل تحديث\n        function refreshDomains() {\n            const sig = domainSig();\n            if (sig !== domainNavSig) {\n                domainNavSig = sig;\n                renderDomainNav();\n                renderDomainSections();\n                rebuildHubSections();\n                populateQuickDomainOptions();\n            }\n            renderDomainHeads();\n            renderDomainLogsAll();\n            renderDomainList();\n        }\n\n        /* ---------- واجهة مركز المجالات: الإنشاء والتعديل ---------- */\n\n        const DOMAIN_EMOJIS = ['✨', '📷', '🎨', '🎬', '🖌️', '🧠', '💻', '📚', '🗣️', '✍️', '📣', '💼',\n            '📈', '💰', '🏋️', '🏃', '🧘', '🌙', '🕌', '🌿', '🍎', '💧', '😴', '🎯',\n            '🚀', '🔁', '⏱️', '🧩', '🏆', '🔬', '🎹', '📸', '🛠️', '🌍', '❤️', '⚡'];\n\n        function domainBlankDraft() {\n            const kd = DOMAIN_KINDS[0];\n            return { id: null, name: '', emoji: '✨', icon: kd.icon, color: '#38bdf8', kind: kd.k, unit: kd.defUnit, target: kd.defTarget, desc: '' };\n        }\n\n        // يُبنى عند الإقلاع وعند كل تبديل طابع: محتوى الشبكات ثابت، لكن حبره يتبع الطابع\n        function renderDomainPickers() {\n            const tpl = document.getElementById('domTemplates');\n            if (tpl) tpl.innerHTML = DOMAIN_TEMPLATES.map((t, i) => `<button type=\"button\" onclick=\"applyDomainTemplate(${i})\" class=\"dom-tpl shrink-0 text-right glass-panel rounded-2xl border p-3 transition hover:brightness-125 w-[164px]\" style=\"border-color:${t.color}33\">\n                <div class=\"flex items-center gap-2 mb-1.5\">\n                    <span class=\"w-8 h-8 shrink-0 rounded-xl flex items-center justify-center text-base border\" style=\"background:${t.color}1a;border-color:${t.color}40\">${t.emoji}<\u002Fspan>\n                    <span class=\"text-[11px] font-black truncate\" style=\"color:${ink(t.color)}\">${t.name}<\u002Fspan>\n                <\u002Fdiv>\n                <p class=\"text-[9px] text-slate-400 leading-snug line-clamp-2\">${t.desc}<\u002Fp>\n            <\u002Fbutton>`).join('');\n\n            const kg = document.getElementById('domKindGrid');\n            if (kg) kg.innerHTML = DOMAIN_KINDS.map(k => `<button type=\"button\" data-kind=\"${k.k}\" onclick=\"setDraftKind('${k.k}')\" class=\"dom-kind text-right glass-panel rounded-2xl border border-white/10 p-3.5 transition\">\n                <div class=\"flex items-center gap-2 mb-1.5\">\n                    <span class=\"w-8 h-8 shrink-0 rounded-xl flex items-center justify-center border\" style=\"color:${ink(k.tone)};background:${k.tone}1a;border-color:${k.tone}40\"><i data-lucide=\"${k.icon}\" class=\"w-4 h-4\"><\u002Fi><\u002Fspan>\n                    <div class=\"min-w-0\"><span class=\"text-xs font-black text-white block truncate\">${k.label}<\u002Fspan><span class=\"text-[9px] font-bold\" style=\"color:${ink(k.tone)}\">${k.tag}<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n                <p class=\"text-[10px] text-slate-400 leading-snug\">${k.desc}<\u002Fp>\n            <\u002Fbutton>`).join('');\n\n            const cg = document.getElementById('domColorGrid');\n            if (cg) cg.innerHTML = DOMAIN_COLORS.map(c => `<button type=\"button\" data-color=\"${c.hex}\" onclick=\"setDraftColor('${c.hex}')\" title=\"${c.n}\" class=\"dom-color w-9 h-9 rounded-xl border-2 transition\" style=\"background:${c.hex}\"><\u002Fbutton>`).join('');\n\n            const eg = document.getElementById('domEmojiGrid');\n            if (eg) eg.innerHTML = DOMAIN_EMOJIS.map(e => `<button type=\"button\" data-emoji=\"${e}\" onclick=\"setDraftEmoji('${e}')\" class=\"dom-emoji w-9 h-9 rounded-xl border border-white/10 bg-white/5 text-base transition\">${e}<\u002Fbutton>`).join('');\n\n            const ig = document.getElementById('domIconGrid');\n            if (ig) ig.innerHTML = DOMAIN_ICON_GROUPS.map(g => `<div class=\"mb-3 last:mb-0\">\n                <p class=\"text-[10px] font-black text-slate-500 mb-1.5\">${g.g}<\u002Fp>\n                <div class=\"flex flex-wrap gap-1.5\">${g.items.map(n => `<button type=\"button\" data-icon=\"${n}\" onclick=\"setDraftIcon('${n}')\" title=\"${n}\" class=\"dom-icon w-9 h-9 rounded-xl border border-white/10 bg-white/5 text-slate-300 flex items-center justify-center transition\"><i data-lucide=\"${n}\" class=\"w-4 h-4\"><\u002Fi><\u002Fbutton>`).join('')}<\u002Fdiv>\n            <\u002Fdiv>`).join('');\n\n        }\n\n        function initDomainHub() {\n            domainDraft = domainBlankDraft();\n            renderDomainPickers();\n\n            ['domName', 'domDesc', 'domTarget'].forEach(id => {\n                const el = document.getElementById(id);\n                if (el) el.addEventListener('input', readDomainForm);\n            });\n            const us = document.getElementById('domUnit');\n            if (us) us.addEventListener('change', readDomainForm);\n\n            syncDomainForm();\n        }\n\n        function readDomainForm() {\n            if (!domainDraft) return;\n            const g = id => { const e = document.getElementById(id); return e ? e.value : ''; };\n            domainDraft.name = g('domName');\n            domainDraft.desc = g('domDesc');\n            const u = g('domUnit');\n            if (u) domainDraft.unit = u;\n            const t = Number(g('domTarget'));\n            domainDraft.target = Number.isFinite(t) && t >= 0 ? t : 0;\n            syncDomainPreview();\n        }\n\n        // يكتب المسودة في الحقول (عند التحميل أو التعديل أو تطبيق قالب)\n        function syncDomainForm() {\n            if (!domainDraft) domainDraft = domainBlankDraft();\n            const set = (id, v) => { const e = document.getElementById(id); if (e) e.value = v; };\n            set('domName', domainDraft.name);\n            set('domDesc', domainDraft.desc);\n            const kd = domainKind(domainDraft.kind);\n            const us = document.getElementById('domUnit');\n            if (us) {\n                us.innerHTML = kd.units.map(u => `<option value=\"${u}\">${u}<\u002Foption>`).join('');\n                us.value = kd.units.includes(domainDraft.unit) ? domainDraft.unit : kd.defUnit;\n                domainDraft.unit = us.value;\n            }\n            set('domTarget', domainDraft.target);\n            syncDomainPreview();\n        }\n\n        function syncDomainPreview() {\n            const d = domainDraft;\n            if (!d) return;\n            const kd = domainKind(d.kind);\n            const mark = (sel, attr, val, on) => document.querySelectorAll(sel).forEach(b => {\n                const hit = b.getAttribute(attr) === String(val);\n                b.classList.toggle('dom-sel', hit);\n                if (on) on(b, hit);\n            });\n            mark('.dom-kind', 'data-kind', d.kind);\n            mark('.dom-icon', 'data-icon', d.icon);\n            mark('.dom-emoji', 'data-emoji', d.emoji);\n            mark('.dom-color', 'data-color', d.color, (b, hit) => { b.style.borderColor = hit ? '#ffffff' : 'transparent'; b.style.transform = hit ? 'scale(1.12)' : ''; });\n\n            const name = (d.name || '').trim();\n            const box = document.getElementById('domPreview');\n            if (box) box.innerHTML = `<div class=\"rounded-2xl border p-4\" style=\"border-color:${d.color}40;background:${d.color}0d\">\n                <div class=\"flex items-center gap-3 mb-3\">\n                    <span class=\"w-11 h-11 shrink-0 rounded-2xl flex items-center justify-center text-lg border\" style=\"background:${d.color}1a;border-color:${d.color}40\">${d.emoji}<\u002Fspan>\n                    <div class=\"min-w-0\">\n                        <p class=\"text-sm font-black truncate\" style=\"color:${ink(d.color)}\">${escAttr(name) || 'اسم المجال الجديد'}<\u002Fp>\n                        <p class=\"text-[10px] text-slate-400 truncate\">${escAttr(d.desc) || kd.desc}<\u002Fp>\n                    <\u002Fdiv>\n                <\u002Fdiv>\n                <div class=\"flex flex-wrap items-center gap-1.5\">\n                    <span class=\"text-[9px] font-black px-2 py-1 rounded-lg border flex items-center gap-1\" style=\"color:${ink(d.color)};background:${d.color}14;border-color:${d.color}3d\"><i data-lucide=\"${d.icon}\" class=\"w-3 h-3\"><\u002Fi> ${kd.label}<\u002Fspan>\n                    <span class=\"text-[9px] font-black px-2 py-1 rounded-lg border border-white/10 bg-white/5 text-slate-300\">الهدف اليومي ${domainUnitFmt(d.target, d.unit)}<\u002Fspan>\n                    <span class=\"text-[9px] font-black px-2 py-1 rounded-lg border border-white/10 bg-white/5 text-slate-300\">أسبوعياً ${domainUnitFmt(d.target * 7, d.unit)}<\u002Fspan>\n                <\u002Fdiv>\n            <\u002Fdiv>`;\n\n            const hint = document.getElementById('domSaveHint');\n            const v = validateDomainDraft();\n            if (hint) {\n                hint.textContent = v.ok\n                    ? (d.id ? 'جاهز لحفظ التعديلات على هذا المجال.' : 'جاهز للإنشاء — سيظهر فوراً في القائمة الجانبية وفي كل تقارير النظام.')\n                    : v.msg;\n                hint.className = 'text-[10px] leading-relaxed ' + (v.ok ? 'text-emerald-400' : 'text-amber-400');\n            }\n            const btn = document.getElementById('domSaveBtn');\n            if (btn) {\n                btn.textContent = d.id ? 'حفظ التعديلات' : 'إنشاء المجال';\n                btn.style.background = solidInk(d.color);\n            }\n            const cancel = document.getElementById('domCancelBtn');\n            if (cancel) cancel.classList.toggle('hidden', !d.id);\n            const title = document.getElementById('domFormTitle');\n            if (title) title.textContent = d.id ? 'تعديل المجال' : 'إنشاء مجال جديد';\n            safeCreateIcons();\n        }\n\n        function setDraftKind(k) {\n            if (!domainDraft) return;\n            const kd = domainKind(k);\n            const prev = domainKind(domainDraft.kind);\n            domainDraft.kind = k;\n            // الوحدة والهدف يتبعان النوع ما لم يكن المستخدم قد خرج بهما عن افتراضي نوعه السابق\n            if (!kd.units.includes(domainDraft.unit)) domainDraft.unit = kd.defUnit;\n            if (domainDraft.target === prev.defTarget) domainDraft.target = kd.defTarget;\n            if (domainDraft.icon === prev.icon) domainDraft.icon = kd.icon;\n            syncDomainForm();\n        }\n        function setDraftIcon(n) { if (domainDraft) { domainDraft.icon = n; syncDomainPreview(); } }\n        function setDraftEmoji(e) { if (domainDraft) { domainDraft.emoji = e; syncDomainPreview(); } }\n        function setDraftColor(c) { if (domainDraft) { domainDraft.color = c; syncDomainPreview(); } }\n\n        function applyDomainTemplate(i) {\n            const t = DOMAIN_TEMPLATES[i];\n            if (!t) return;\n            const keepId = domainDraft ? domainDraft.id : null;\n            domainDraft = { id: keepId, name: t.name, emoji: t.emoji, icon: t.icon, color: t.color, kind: t.kind, unit: t.unit, target: t.target, desc: t.desc };\n            syncDomainForm();\n            const el = document.getElementById('domName');\n            if (el) el.focus({ preventScroll: true });\n            showToast('تم تعبئة القالب — عدّله كما تشاء ثم احفظ');\n        }\n\n        function validateDomainDraft() {\n            const d = domainDraft;\n            if (!d) return { ok: false, msg: 'لا توجد مسودة.' };\n            const name = (d.name || '').trim();\n            if (name.length < 2) return { ok: false, msg: 'اكتب اسماً واضحاً للمجال (حرفان على الأقل).' };\n            if (name.length > 40) return { ok: false, msg: 'الاسم طويل — اختصره إلى 40 حرفاً أو أقل.' };\n            const norm = s => String(s).trim().toLowerCase();\n            if (RESERVED_CATS.some(c => norm(c) === norm(name))) return { ok: false, msg: 'هذا الاسم محجوز لمجال أصلي في النظام. اختر اسماً آخر.' };\n            if (domainDefs.some(x => x.id !== d.id && norm(x.cat) === norm(name))) return { ok: false, msg: 'لديك مجال بهذا الاسم بالفعل.' };\n            if (!(d.target >= 0)) return { ok: false, msg: 'الهدف اليومي يجب أن يكون رقماً موجباً.' };\n            return { ok: true, msg: '' };\n        }\n\n        function saveDomainDraft() {\n            readDomainForm();\n            const v = validateDomainDraft();\n            if (!v.ok) { showToast(v.msg); return; }\n            const d = domainDraft;\n            const name = d.name.trim();\n\n            if (d.id) {\n                const cur = domainById(d.id);\n                if (!cur) return;\n                const oldCat = cur.cat;\n                Object.assign(cur, {\n                    name, cat: name, emoji: d.emoji, icon: d.icon, color: d.color,\n                    kind: d.kind, unit: d.unit, target: d.target, desc: (d.desc || '').trim()\n                });\n                // إعادة التسمية يجب أن تنقل السجلات معها، وإلا يُتَم المجالُ سجلاتِه\n                if (oldCat !== cur.cat) {\n                    globalActivityLogs.forEach(l => { if (l.category === oldCat) l.category = cur.cat; });\n                    if (cloudDomainMap && cloudDomainMap[oldCat]) { cloudDomainMap[cur.cat] = cloudDomainMap[oldCat]; delete cloudDomainMap[oldCat]; }\n                    // مفتاح لوحة التوازن مبني على المعرّف لا على الاسم، فأهداف\n                    // المجال تنجو من إعادة التسمية دون أي عمل إضافي هنا.\n                    saveLocalData();\n                }\n                saveDomains();\n                showToast('ت

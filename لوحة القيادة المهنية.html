const c = mwMetricCtx(key);\n            if (!c) return '';\n            const M = c.M, adv = M.advice(c), tone = mwTone(adv.t);\n            return `<button type=\"button\" onclick=\"openStatInfo('${key}')\" aria-label=\"تفاصيل ${M.label}\"\n                class=\"mw-tile glass-panel rounded-2xl border border-${M.color}-500/25 p-3.5 md:p-4 text-right w-full flex flex-col\">\n                <div class=\"flex items-start justify-between gap-1.5 mb-1.5 w-full\">\n                    <span class=\"flex items-start gap-1.5 text-${M.color}-400 min-w-0\">\n                        <i data-lucide=\"${M.icon}\" class=\"w-3.5 h-3.5 shrink-0 mt-px\"><\u002Fi>\n                        <span class=\"text-[10px] md:text-[11px] font-bold leading-tight\">${M.label}<\u002Fspan>\n                    <\u002Fspan>\n                    ${mondayDeltaBadge(c.d)}\n                <\u002Fdiv>\n                <div class=\"text-lg md:text-2xl lg:text-3xl font-black text-white leading-none mb-2\">${M.val(c.s)}<\u002Fdiv>\n                <p class=\"mw-tip text-[9px] md:text-[10px] leading-snug text-${tone.c}-300/90 mt-auto\" style=\"text-wrap:pretty\">${adv.x}<\u002Fp>\n                <span class=\"mt-2 inline-flex items-center gap-1 text-[9px] font-bold text-slate-500\">\n                    <i data-lucide=\"info\" class=\"w-3 h-3\"><\u002Fi> ${c.d ? 'اضغط للتفاصيل والنسبة' : 'اضغط للتفاصيل'}\n                <\u002Fspan>\n            <\u002Fbutton>`;\n        }\n\n        function mwTiles(keys) {\n            return `<div class=\"grid grid-cols-2 lg:grid-cols-3 gap-2.5 md:gap-3 monday-stagger\">${keys.map(mwTile).join('')}<\u002Fdiv>`;\n        }\n\n        /* ---------- تحليل كل مجال على حدة + نصيحته ---------- */\n\n        // المطلب 4: لا يكفي أن نعرض أرقام المجالات؛ كل مجال يحصل على قراءة خاصة بحاله\n        function mwDomainAdvice(row, total) {\n            const m = row.m, share = total > 0 ? m / total : 0;\n            const name = row.d.label;\n            if (m <= 0) return { t: 'تنبيه', x: `لم يأخذ «${name}» دقيقة واحدة. لا يحتاج بطولة، يحتاج موعداً ثابتاً: ضع له جلستين قصيرتين في تقويمك هذا الأسبوع.` };\n            if (m < 60) return { t: 'فرصة', x: `${fmtDuration(m)} فقط في «${name}» — حضور رمزي لا يكفي للتراكم. ارفعه إلى ساعتين موزّعتين على ثلاث جلسات، فالمجال دون ساعتين أسبوعياً لا يتقدّم.` };\n            if (share >= 0.6) return { t: 'فرصة', x: `«${name}» استحوذ على ${Math.round(share * 100)}% من وقتك. إن كان اختياراً واعياً فهو تميّز، وإن كان انجرافاً فهو خلل — احسمها بوعي وأعطِ مجالاً آخر جلسة واحدة.` };\n            if (row.delta.dir < 0 && row.delta.pct <= -30) return { t: 'تنبيه', x: `«${name}» تراجع ${Math.abs(row.delta.pct)}% عن الفترة السابقة. أعد إليه موعده الثابت قبل أن يتحوّل التراجع إلى انقطاع كامل.` };\n            if (row.delta.dir > 0 && row.delta.pct >= 25) return { t: 'قوة', x: `«${name}» صاعد بوضوح (${row.delta.txt}). ثبّت الظرف الذي أنتج هذا الصعود وأعد إنتاجه عمداً — الصدفة لا تتكرر بالتمني.` };\n            if (m >= 240) return { t: 'قوة', x: `${fmtDuration(m)} في «${name}» استثمار جادّ. وجّه انتباهك الآن إلى مخرج ملموس واحد تُغلقه فيه، فالعمق بلا تسليم يبقى مجهوداً خفياً.` };\n            return { t: 'فرصة', x: `${fmtDuration(m)} في «${name}» إيقاع معقول. زده جلسة واحدة فقط هذا الأسبوع — الزيادة المتدرّجة هي ما يصمد.` };\n        }\n\n        function mwDomainBoard(rows, total, title, note) {\n            if (!rows || !rows.length) return '';\n            // مجال بلا دقيقة واحدة تتشابه نصيحته حتماً مع نظيره، فتكرارها أربع مرات ضجيج\n            // لا تحليل. نجمعها في بطاقة واحدة تسمّيها وتعطيها خطوة عملية واحدة واضحة.\n            const active = rows.filter(r => r.m > 0);\n            const idle = rows.filter(r => r.m <= 0);\n            const idleCard = idle.length ? `<div class=\"glass-panel rounded-2xl border border-slate-500/25 p-3.5 ${idle.length > 1 && active.length ? 'md:col-span-2' : ''}\">\n                <div class=\"flex items-center gap-2 mb-2\">\n                    <span class=\"w-8 h-8 shrink-0 rounded-xl flex items-center justify-center border border-slate-500/30 bg-slate-500/10 text-slate-400\"><i data-lucide=\"moon\" class=\"w-4 h-4\"><\u002Fi><\u002Fspan>\n                    <div class=\"min-w-0 flex-1\">\n                        <p class=\"text-[11px] font-black text-slate-300\">مجالات ساكنة (${idle.length})<\u002Fp>\n                        <p class=\"text-[9px] text-slate-500 truncate\">${idle.map(r => escAttr(r.d.label)).join(' · ')}<\u002Fp>\n                    <\u002Fdiv>\n                <\u002Fdiv>\n                <p class=\"text-[10px] md:text-[11px] leading-relaxed text-amber-300/90\" style=\"text-wrap:pretty\"><b class=\"text-amber-300\">فرصة:<\u002Fb> ${idle.length === 1\n                    ? `«${escAttr(idle[0].d.label)}» لم يأخذ دقيقة واحدة. لا تحاول إحياءه بيوم بطولي — امنحه موعداً ثابتاً واحداً مدته ٢٥ دقيقة هذا الأسبوع، فالمجال المهمَل يحتاج تقويماً لا حماساً.`\n                    : `${idle.length} مجالات بلا نشاط. لا تحاول إحياءها كلها — اختر <b class=\"text-white\">واحداً فقط<\u002Fb> أقربها إلى هدفك هذا الشهر، وامنحه موعدين قصيرين. إحياء مجال واحد بنجاح أنفع من محاولة أربعة تفشل جميعاً.`}<\u002Fp>\n            <\u002Fdiv>` : '';\n            const body = active.map(r => {\n                const adv = mwDomainAdvice(r, total);\n                const tone = mwTone(adv.t);\n                const color = r.d.color || '#64748b';\n                const share = total > 0 ? Math.round((r.m / total) * 100) : 0;\n                return `<div class=\"glass-panel rounded-2xl border p-3.5\" style=\"border-color:${color}33\">\n                    <div class=\"flex items-center gap-2 mb-2\">\n                        <span class=\"w-8 h-8 shrink-0 rounded-xl flex items-center justify-center border\" style=\"color:${ink(color)};background:${color}1a;border-color:${color}40\"><i data-lucide=\"${r.d.icon}\" class=\"w-4 h-4\"><\u002Fi><\u002Fspan>\n                        <div class=\"min-w-0 flex-1\">\n                            <p class=\"text-[11px] font-black truncate\" style=\"color:${ink(color)}\">${escAttr(r.d.label)}<\u002Fp>\n                            <p class=\"text-[9px] text-slate-500\">${r.m > 0 ? fmtDuration(r.m) + ' · ' + share + '% من وقتك' : 'بلا نشاط'}<\u002Fp>\n                        <\u002Fdiv>\n                        ${mondayDeltaBadge(r.delta)}\n                    <\u002Fdiv>\n                    <div class=\"h-1.5 mw-track rounded-full overflow-hidden mb-2.5\"><div class=\"h-full rounded-full\" style=\"width:${Math.min(100, share)}%;background:${color}\"><\u002Fdiv><\u002Fdiv>\n                    <p class=\"text-[10px] md:text-[11px] leading-relaxed text-${tone.c}-300/90\" style=\"text-wrap:pretty\"><b class=\"text-${tone.c}-300\">${adv.t}:<\u002Fb> ${adv.x}<\u002Fp>\n                <\u002Fdiv>`;\n            }).join('');\n            return `<div class=\"mt-4 md:mt-5\">\n                <div class=\"flex items-center justify-between gap-2 mb-2.5 flex-wrap\">\n                    <span class=\"flex items-center gap-2 text-[11px] md:text-xs font-black text-slate-200\"><i data-lucide=\"radar\" class=\"w-4 h-4 text-sky-400\"><\u002Fi> ${title}<\u002Fspan>\n                    <span class=\"text-[10px] text-slate-500\">${note}<\u002Fspan>\n                <\u002Fdiv>\n                <div class=\"grid grid-cols-1 md:grid-cols-2 gap-2.5 monday-stagger\">${body}${idleCard}<\u002Fdiv>\n            <\u002Fdiv>`;\n        }\n\n        // خلاصة واحدة تُختم بها كل خطوة: أفضل نصيحة لحالتك في سياق تلك الخطوة تحديداً\n        function mwHeroAdvice(title, adv, accent) {\n            const tone = mwTone(adv.t);\n            return `<div class=\"mt-4 rounded-2xl border border-${tone.c}-500/30 p-4 md:p-5\" style=\"background:rgba(148,163,184,.06)\">\n                <div class=\"flex items-center gap-2 mb-2 flex-wrap text-${tone.c}-300\">\n                    <i data-lucide=\"${tone.i}\" class=\"w-4 h-4 shrink-0\"><\u002Fi>\n                    <span class=\"text-[11px] font-black\">${title}<\u002Fspan>\n                    <span class=\"text-[9px] font-black px-1.5 py-0.5 rounded-md bg-${tone.c}-500/10 border border-${tone.c}-500/25\">${adv.t}<\u002Fspan>\n                <\u002Fdiv>\n                <p class=\"text-xs md:text-sm text-slate-200 leading-relaxed\" style=\"text-wrap:pretty\">${adv.x}<\u002Fp>\n            <\u002Fdiv>`;\n        }\n\n        // ترتيب المؤشرات بحسب إلحاح حالتها، فتُقدَّم النصيحة الأهم لا الأولى في القائمة\n        function mwTopAdvice(keys) {\n            const rank = { 'تنبيه': 3, 'فرصة': 2, 'قوة': 1 };\n            let best = null;\n            keys.forEach(k => {\n                const c = mwMetricCtx(k);\n                if (!c) return;\n                const a = c.M.advice(c);\n                if (!best || rank[a.t] > rank[best.a.t]) best = { k, a, c };\n            });\n            return best ? best.a : { t: 'فرصة', x: 'سجّل نشاطك بانتظام لتتحوّل هذه النافذة إلى مرآة دقيقة لأدائك.' };\n        }\n\n        /* ---------- لقطة الجمعة: الأسبوع الجاري مقابل نفس أيامه من الأسبوع الماضي ----------\n           المقارنة تُجرى على نطاق متساوٍ الطول عمداً: مقارنة أسبوع لم يكتمل بأسبوع كامل\n           تُنتج تراجعاً وهمياً كل مرة، وهذا تضليل لا تحليل. */\n        function fridaySnapshot() {\n            const today = getTodayStr();\n            const start = getWeekStartStr(today);\n            const s = getRangeAchievements(start, today);\n            s.streak = calculateStreak();\n            const p = getRangeAchievements(addDaysStr(start, -7), addDaysStr(today, -7));\n            const total = s.mins;\n            s.domainRows = mondayAllDomains().map(d => {\n                const m = Math.round(s.catMins[d.k] || 0);\n                const pm = Math.round(p.catMins[d.k] || 0);\n                return { d, m, pm, delta: mwDelta(m, pm), share: total > 0 ? m / total : 0 };\n            }).sort((a, b) => b.m - a.m);\n            return { s, p, start, today };\n        }\n\n        // اختيار النصيحة الأنسب من نصائح الأسبوع السبع بناءً على أرقامك أنت\n        function fridayPickTip(s, tips) {\n            const pick = k => tips.find(t => t.d === k) || tips[0];\n            const avg = s.sessions ? s.mins / s.sessions : 0;\n            if (s.mins <= 0) return { tip: pick('النفس'), why: 'لأن أسبوعك بلا تسجيل بعد، والبداية تحتاج نظاماً لا حماساً.' };\n            if (s.activeDays <= 2) return { tip: pick('النفس'), why: 'لأن أيامك النشطة قليلة، والخلل هنا في النظام لا في العزيمة.' };\n            if (avg > 0 && avg < 20) return { tip: pick('الوقت'), why: 'لأن جلساتك قصيرة ومجزّأة، فيذهب وقتك في التسخين لا في الإنتاج.' };\n            if (s.tasks <= 0) return { tip: pick('العمل'), why: 'لأنك سجّلت وقتاً دون أي مخرج مغلق.' };\n            if (s.pages <= 0) return { tip: pick('المعرفة'), why: 'لأن معرفتك توقفت هذا الأسبوع بينما تحرّكت بقية مجالاتك.' };\n            if (s.mins >= 600) return { tip: pick('الصحة'), why: 'لأن حجم عملك مرتفع، وحمايتك الآن في الاستعادة لا في الزيادة.' };\n            return { tip: pick('العلاقات'), why: 'لأن أرقامك متوازنة، والنمو القادم يأتي من خارج جدولك لا من داخله.' };\n        }\n\n        /* ---------- المطلب 5: تنقّل باللمس بين خطوات النافذتين ---------- */\n\n        // سحب أفقي واحد ينقلك خطوة، مع تجاهل السحب الرأسي حتى لا يتعارض مع التمرير\n        function bindWindowSwipe(bodyId, step) {\n            const el = document.getElementById(bodyId);\n            if (!el || el.dataset.swipe === '1') return;\n            el.dataset.swipe = '1';\n            let x0 = 0, y0 = 0, active = false;\n            el.addEventListener('touchstart', e => {\n                if (e.touches.length !== 1) { active = false; return; }\n                x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; active = true;\n            }, { passive: true });\n            el.addEventListener('touchend', e => {\n                if (!active) return;\n                active = false;\n                const t = e.changedTouches[0];\n                const dx = t.clientX - x0, dy = t.clientY - y0;\n                if (Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy) * 1.6) return;\n                // الاتجاه العربي: السحب لليسار يعني «التالي»\n                step(dx < 0 ? 1 : -1);\n            }, { passive: true });\n        }\n\n        // كل خطوة تبدأ من أعلى المحتوى، وإلا ظهرت الخطوة الجديدة من منتصفها على الجوال\n        function mwResetScroll(id) {\n            const el = document.getElementById(id);\n            if (el) el.scrollTop = 0;\n        }\n\n        /* ========== لوحة توازن الإنجاز الحلقية (Smart Radial Hub) ========== */\n        const HUB_PERIODS = [\n            { k: 'day', t: 'توازن اليوم', mult: 1, note: 'مقارنة بمستهدف اليوم' },\n            { k: 'week', t: 'توازن الأسبوع', mult: 7, note: 'مقارنة بمستهدف الأسبوع' },\n            { k: 'month', t: 'توازن الشهر', mult: 30, note: 'مقارنة بمستهدف الشهر' },\n            { k: 'year', t: 'توازن السنة', mult: 365, note: 'مقارنة بمستهدف السنة' }\n        ];\n        const HUB_PERIOD_LABELS = { day: 'اليوم', week: 'الأسبوع', month: 'الشهر', year: 'السنة' };\n        const HUB_BASE_SECTIONS = [\n            { k: 'reading', label: 'مكتبة القراءة', icon: 'book-open', color: '#10b981', units: ['صفحة', 'دقيقة', 'ساعة', 'جلسة'], def: { unit: 'صفحة', target: 20 } },\n            { k: 'photo', label: 'مشروع التصوير', icon: 'camera', color: '#38bdf8', cat: 'Photography', units: ['مهمة', 'دقيقة', 'ساعة', 'جلسة'], def: { unit: 'دقيقة', target: 45 } },\n            { k: 'business', label: 'إدارة الأعمال', icon: 'briefcase', color: '#f59e0b', cat: 'Business', units: ['مهمة', 'دقيقة', 'ساعة', 'جلسة'], def: { unit: 'مهمة', target: 3 } },\n            { k: 'ai', label: 'الذكاء الاصطناعي', icon: 'brain-circuit', color: '#a78bfa', cat: 'AI', units: ['نموذج', 'مهمة', 'دقيقة', 'ساعة'], def: { unit: 'دقيقة', target: 30 } }\n        ];\n        // القائمة العاملة: الأربعة الأصلية + مجالات المستخدم، يعيد rebuildHubSections() بناءها\n        let HUB_SECTIONS = HUB_BASE_SECTIONS.slice();\n        const HUB_UNIT_MAX = { 'صفحة': 300, 'دقيقة': 480, 'ساعة': 12, 'مهمة': 20, 'جلسة': 10, 'نموذج': 10, 'مخرج': 20, 'يوم': 7, 'مرة': 20 };\n        const HUB_UNIT_STEP = { 'صفحة': 5, 'دقيقة': 5, 'ساعة': 0.5, 'مهمة': 1, 'جلسة': 1, 'نموذج': 1, 'مخرج': 1, 'يوم': 1, 'مرة': 1 };\n        let hubPeriodIndex = 0;\n        let hubTargets = {};\n\n        function hubSection(k) { return HUB_SECTIONS.find(s => s.k === k); }\n\n        function loadBalanceConfig() {\n            try { hubTargets = JSON.parse(localStorage.getItem('prod_balance_targets')) || {}; } catch (e) { hubTargets = {}; }\n            HUB_SECTIONS.forEach(s => {\n                const cur = hubTargets[s.k] || {};\n                const base = Number.isFinite(Number(cur.target)) ? Number(cur.target) : s.def.target;\n                const t = Object.assign({ day: base, week: base * 7, month: base * 30, year: base * 365 }, cur.t || {});\n                HUB_PERIODS.forEach(p => { if (!Number.isFinite(Number(t[p.k]))) t[p.k] = base * p.mult; });\n                hubTargets[s.k] = { unit: s.units.includes(cur.unit) ? cur.unit : s.def.unit, t };\n            });\n            // تنظيف: أهداف أقسام لم تعد موجودة (مجال محذوف) لا تبقى في التخزين\n            Object.keys(hubTargets).forEach(k => { if (!HUB_SECTIONS.some(s => s.k === k)) delete hubTargets[k]; });\n            const p = localStorage.getItem('prod_balance_period');\n            const idx = HUB_PERIODS.findIndex(x => x.k === p);\n            hubPeriodIndex = idx >= 0 ? idx : 0;\n        }\n\n        function saveBalanceConfig() {\n            localStorage.setItem('prod_balance_targets', JSON.stringify(hubTargets));\n            localStorage.setItem('prod_balance_period', HUB_PERIODS[hubPeriodIndex].k);\n        }\n\n        function hubPeriodStart() {\n            const t = getTodayStr();\n            const k = HUB_PERIODS[hubPeriodIndex].k;\n            if (k === 'day') return t;\n            if (k === 'week') return getWeekStartStr(t);\n            if (k === 'month') return getMonthStartStr(t);\n            return t.slice(0, 4) + '-01-01';\n        }\n\n        function hubMeasure(sec, unit, startStr) {\n            let mins = 0, tasks = 0, sessions = 0, pages = 0;\n            const days = new Set();\n            if (sec.k === 'reading') {\n                globalReadingLogs.forEach(l => { if (l.date >= startStr) { mins += Number(l.time_spent_mins) || 0; pages += Number(l.pages_read) || 0; sessions++; tasks++; days.add(l.date); } });\n            } else {\n                globalActivityLogs.forEach(l => { if (l.category === sec.cat && l.date >= startStr) { mins += Number(l.time_mins) || 0; tasks += Number(l.tasks_completed) || 0; sessions++; days.add(l.date); } });\n            }\n            if (unit === 'صفحة') return pages;\n            if (unit === 'دقيقة') return mins;\n            if (unit === 'ساعة') return Math.round(mins / 6) / 10;\n            if (unit === 'جلسة') return sessions;\n            if (unit === 'يوم') return days.size;   // تتبّع العادات: الحضور نفسه هو القياس\n            return tasks; // مهمة / نموذج / مخرج / مرة\n        }\n\n        function hubFmt(n) { return Number.isInteger(n) ? String(n) : String(Math.round(n * 10) / 10); }\n\n        function hubRows() {\n            const startStr = hubPeriodStart();\n            const mult = HUB_PERIODS[hubPeriodIndex].mult;\n            return HUB_SECTIONS.map(s => {\n                // قسم أُضيف للتوّ أو هدف حُذف قبل إعادة بناء الأقسام: نعود إلى افتراضي\n                // القسم بدل أن نرمي استثناءً يوقف إعادة حساب النظام بأكملها.\n                const raw = hubTargets[s.k] || { unit: s.def.unit, t: {} };\n                const per = HUB_PERIODS[hubPeriodIndex];\n                const fallback = s.def.target * per.mult;\n                const rawT = raw.t || {};\n                const stored = Number(rawT[per.k]);\n                const cfg = { unit: raw.unit || s.def.unit, target: Number.isFinite(stored) ? Math.max(0, stored) : fallback };\n                const value = hubMeasure(s, cfg.unit, startStr);\n                const goal = cfg.target;\n                const pct = goal > 0 ? Math.min(100, (value / goal) * 100) : (value > 0 ? 100 : 0);\n                return { s, cfg, value, goal, pct };\n            });\n        }\n\n        function renderBalanceHub() {\n            const wrap = document.getElementById('hubRings');\n            if (!wrap) return;\n            const rows = hubRows();\n            const C = 2 * Math.PI * 16;\n            wrap.innerHTML = rows.map(r => {\n                const off = C * (1 - r.pct / 100);\n                return `<button onclick=\"openBalanceSheet('${r.s.k}')\" class=\"flex items-center gap-2 rounded-2xl bg-slate-950/40 border px-2 py-2 transition hover:bg-slate-900/60 text-right\" style=\"border-color:${r.pct >= 100 ? r.s.color + '55' : 'rgba(255,255,255,0.06)'}\">\n                    <span class=\"relative w-10 h-10 shrink-0 flex items-center justify-center\">\n                        <svg viewBox=\"0 0 40 40\" class=\"w-10 h-10 -rotate-90 absolute inset-0\">\n                            <circle cx=\"20\" cy=\"20\" r=\"16\" fill=\"none\" stroke=\"${trackStroke()}\" stroke-width=\"3.5\"><\u002Fcircle>\n                            <circle cx=\"20\" cy=\"20\" r=\"16\" fill=\"none\" stroke=\"${r.s.color}\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-dasharray=\"${C.toFixed(2)}\" stroke-dashoffset=\"${off.toFixed(2)}\" style=\"transition:stroke-dashoffset .9s cubic-bezier(.22,.68,.16,1);filter:drop-shadow(0 0 5px ${r.s.color}66)\"><\u002Fcircle>\n                        <\u002Fsvg>\n                        <i data-lucide=\"${r.s.icon}\" class=\"w-3.5 h-3.5 relative\" style=\"color:${ink(r.s.color)}\"><\u002Fi>\n                    <\u002Fspan>\n                    <span class=\"min-w-0 w-full block\">\n                        <span class=\"block text-[10px] font-bold text-slate-400 truncate\">${r.s.label}<\u002Fspan>\n                        <span class=\"block text-[11px] font-black ig();\n            renderBalanceHub();\n            const head = document.getElementById('hubHeader');\n            if (!head || head.dataset.bound === '1') return;\n            head.dataset.bound = '1';\n            let startX = 0, dragging = false, moved = 0;\n            const onDown = (x) => { startX = x; dragging = true; moved = 0; };\n            const onMove = (x) => {\n                if (!dragging) return;\n                moved = x - startX;\n                head.style.transform = `translateX(${Math.max(-18, Math.min(18, moved * 0.35))}px)`;\n            };\n            const onUp = () => {\n                if (!dragging) return;\n                dragging = false;\n                head.style.transform = 'translateX(0)';\n                if (Math.abs(moved) > 38) hubShiftPeriod(moved < 0 ? 1 : -1);\n                else openBalanceSheet();\n                moved = 0;\n            };\n            head.addEventListener('pointerdown', e => { onDown(e.clientX); head.setPointerCapture && head.setPointerCapture(e.pointerId); });\n            head.addEventListener('pointermove', e => onMove(e.clientX));\n            head.addEventListener('pointerup', onUp);\n            head.addEventListener('pointercancel', () => { dragging = false; head.style.transform = 'translateX(0)'; });\n        }\n\n        function hubFieldHTML(r) {\n            const periodLabel = HUB_PERIOD_LABELS[HUB_PERIODS[hubPeriodIndex].k];\n            if (r.cfg.unit === 'ساعة') {\n                const hrs = Math.floor(r.cfg.target);\n                const mins = Math.round((r.cfg.target - hrs) * 60);\n                return `<div class=\"flex items-center gap-2\">\n                    <span class=\"flex-1 min-w-0 flex items-center gap-1.5 glass-panel border border-slate-700 rounded-xl px-2.5 py-2 focus-within:border-violet-500 transition\">\n                        <input type=\"number\" min=\"0\" max=\"1000\" step=\"1\" value=\"${hrs}\" id=\"hubH-${r.s.k}\" oninput=\"hubSetHM('${r.s.k}')\" clas       }\n\n        function renderBalanceSheet(focusKey) {\n            const box = document.getElementById('balanceSheetBody');\n            if (!box) return;\n            const rows = hubRows();\n            const sel = document.getElementById('hubPeriodSelect');\n            if (sel) sel.innerHTML = HUB_PERIODS.map((p, i) => `<option value=\"${p.k}\" ${i === hubPeriodIndex ? 'selected' : ''}>${HUB_PERIOD_LABELS[p.k]}<\u002Foption>`).join('');\n            const sub = document.getElementById('balanceSheetSub');\n            if (sub) sub.innerText = `اكتب الكمية المستهدفة لكل ${HUB_PERIOD_LABELS[HUB_PERIODS[hubPeriodIndex].k]} — تُحفظ تلقائياً.`;\n            box.innerHTML = rows.map(r => `<div class=\"rounded-2xl border p-3.5 space-y-3 transition\" style=\"border-color:${focusKey === r.s.k ? r.s.color + '66' : 'rgba(255,255,255,0.06)'};background:rgba(2,6,23,.45)\">\n                <div class=\"flex items-center justify-between gap-3\">\n                    <span class=\"flex items-center gap-2 min-w-0\">\n                        <span class=\"w-8 h-8 shrink-0 rounded-xl flex items-center justify-center\" style=\"background:${r.s.color}1f;color:${ink(r.s.color)};border:1px solid ${r.s.color}40\"><i data-lucide=\"${r.s.icon}\" class=\"w-4 h-4\"><\u002Fi><\u002Fspan>\n                        <span class=\"text-xs font-bold text-slate-200 truncate\">${r.s.label}<\u002Fspan>\n                    <\u002Fspan>\n                    <select onchange=\"hubSetUnit('${r.s.k}', this.value)\" class=\"glass-panel border border-slate-700 rounded-xl px-3 py-1.5 text-[11px] font-bold text-slate-200 outline-none focus:border-violet-500 shrink-0\">\n                        ${r.s.units.map(u => `<option value=\"${u}\" ${u === r.cfg.unit ? 'selected' : ''}>${u}<\u002Foption>`).join('')}\n                    <\u002Fselect>\n                <\u002Fdiv>\n                ${hubFieldHTML(r)}\n                <p id=\"hubHint-${r.s.k}\" class=\"text-[10px] text-slate-500\">المنجز: <b class=\"text-slate-300\">${hubFmt(r.value)}<\u002Fb> من <b class=\"text-slate-300\">${hubFmt(r.goal)}<\u002Fb> ${r.cfg.unit} — ${Math.round(r.pct)}%<\u002Fp>\n            <\u002Fdiv>`).join('');\n            safeCreateIcons();\n        }\n\n        function hubSetPeriod(k) {\n            const i = HUB_PERIODS.findIndex(p => p.k === k);\n            if (i < 0 || i === hubPeriodIndex) return;\n            hubPeriodIndex = i;\n            saveBalanceConfig();\n            renderBalanceHub();\n            renderBalanceSheet();\n        }\n\n        function openBalanceSheet(focusKey) {\n            const sheet = document.getElementById('balanceSheet');\n            if (!sheet) return;\n            renderBalanceSheet(focusKey);\n            sheet.classList.remove('hidden');\n            requestAnimationFrame(() => {\n                document.getElementById('balanceSheetBackdrop').classList.remove('opacity-0');\n                document.getElementById('balanceSheetBox').classList.remove('translate-y-full');\n            });\n        }\n\n        function closeBalanceSheet() {\n            const sheet = document.getElementById('balanceSheet');\n            if (!sheet) return;\n            document.getElementById('balanceSheetBackdrop').classList.add('opacity-0');\n            document.getElementById('balanceSheetBox').classList.add('translate-y-full');\n            setTimeout(() => sheet.classList.add('hidden'), 300);\n            saveBalanceConfig();\n        }\n\n        function hubSetUnit(k, unit) {\n            const s = hubSection(k);\n            if (!s || !s.units.includes(unit)) return;\n            hubTargets[k].unit = unit;\n            saveBalanceConfig();\n            renderBalanceHub();\n            renderBalanceSheet(k);\n        }\n\n        function hubSetTarget(k, v) {\n            hubTargets[k].t[HUB_PERIODS[hubPeriodIndex].k] = Math.max(0, Number(v) || 0);\n            const r = hubRows().find(x => x.s.k === k);\n            const hint = document.getElementById('hubHint-' + k);\n            if (hint && r) hint.innerHTML = `المنجز: <b class=\"text-slate-300\">${hubFmt(r.value)}<\u002Fb> من <b class=\"text-slate-300\">${hubFmt(r.goal)}<\u002Fb> ${r.cfg.unit} — ${Math.round(r.pct)}%`;\n            saveBalanceConfig();\n            renderBalanceHub();\n        }\n\n        function hubSetHM(k) {\n            const hEl = document.getElementById('hubH-' + k);\n            const mEl = document.getElementById('hubM-' + k);\n            const hrs = Math.max(0, Number(hEl ? hEl.value : 0) || 0);\n            const mins = Math.max(0, Math.min(59, Number(mEl ? mEl.value : 0) || 0));\n            hubSetTarget(k, Math.round((hrs + mins / 60) * 100) / 100);\n        }\n\n        function resetBalanceTargets() {\n            HUB_SECTIONS.forEach(s => {\n                const t = {};\n                HUB_PERIODS.forEach(p => { t[p.k] = s.def.target * p.mult; });\n                hubTargets[s.k] = { unit: s.def.unit, t };\n            });\n            saveBalanceConfig();\n            renderBalanceHub();\n            renderBalanceSheet();\n            showToast('تمت استعادة المستهدفات الافتراضية');\n        }\n\n        /* ========== المطلب 3: المزامنة الذكية بين الأجهزة ========== */\n        const SYNC_TABLE = 'sync_state';\n        let syncConfig = { url: '', key: '', spaceId: '', auto: false, intervalSec: 30 };\n        let syncLastError = '';\n        let syncMeta = { localTs: 0, lastSync: null };\n        let syncIntervalRef = null, syncDebounceRef = null, syncBusy = false;\n        let deviceId = localStorage.getItem('prod_device_id') || '';\n\n        function loadSyncConfig() {\n            try { syncConfig = Object.assign(syncConfig, JSON.parse(localStorage.getItem('prod_sync_config')) || {}); } catch (e) {}\n            try { syncMeta = Object.assign(syncMeta, JSON.parse(localStorage.getItem('prod_sync_meta')) || {}); } catch (e) {}\n            try { deletedIds = JSON.parse(localStorage.getItem('prod_deleted_ids')) || []; } catch (e) { deletedIds = []; }\n            if (!deviceId) { deviceId = 'dev_' + Math.random().toString(36).slice(2, 10); localStorage.setItem('prod_device_id', deviceId); }\n            window.removeEventListener('online', onNetworkBackOnline);\n            window.addEventListener('online', onNetworkBackOnline);\n\n            const cc = cloudConfig || {};\n            const sUrlEl = document.getElementById('syncUrl'); if (sUrlEl) sUrlEl.value = syncConfig.url || cc.url || '';\n            const sKeyEl = document.getElementById('syncKey'); if (sKeyEl) sKeyEl.value = syncConfig.key || cc.key || '';\n            const idEl = document.getElementById('syncSpaceId'); if (idEl) idEl.value = syncConfig.spaceId || '';\n            const autoEl = document.getElementById('syncAuto'); if (autoEl) autoEl.checked = !!syncConfig.auto;\n            const intEl = document.getElementById('syncInterval'); if (intEl) intEl.value = syncConfig.intervalSec || 30;\n            updateSyncLabel(syncConfig.auto ? 'مفعّلة' : 'غير مفعّل', syncConfig.auto ? 'emerald' : 'slate');\n            if (syncConfig.auto && syncConfig.spaceId) startAutoSync();\n        }\n\n        function toggleSyncKeyVisibility() {\n            const el = document.getElementById('syncKey'); const icon = document.getElementById('syncKeyEyeIcon');\n            if (!el) return;\n            el.type = el.type === 'password' ? 'text' : 'password';\n            if (icon) { icon.setAttribute('data-lucide', el.type === 'password' ? 'eye' : 'eye-off'); safeCreateIcons(); }\n        }\n\n        function setSyncBusyUI(busy) {\n            const btn = document.getElementById('btnSyncNow');\n            const label = document.getElementById('syncNowLabel');\n            const icon = document.getElementById('syncNowIcon');\n            if (btn) btn.disabled = busy;\n            if (label) label.innerText = busy ? 'جاري المزامنة...' : 'مزامنة الآن';\n            if (icon) icon.classList.toggle('animate-spin', busy);\n        }\n\n        function saveSyncConfig() {\n            const autoEl = document.getElementById('syncAuto');\n            const intEl = document.getElementById('syncInterval');\n            syncCreds();\n            syncConfig.auto = autoEl ? autoEl.checked : false;\n            syncConfig.intervalSec = Math.max(10, Number(intEl ? intEl.value : 30) || 30);\n            localStorage.setItem('prod_sync_config', JSON.stringify(syncConfig));\n            showToast('تم حفظ إعدادات المزامنة');\n            if (syncConfig.auto && syncConfig.spaceId) startAutoSync(); else stopAutoSync();\n        }\n\n        function onSyncAutoToggle() { saveSyncConfig(); }\n\n        function updateSyncLabel(text, color) {\n            const l = document.getElementById('syncStateLabel');\n            const dot = document.getElementById('syncDot');\n            if (l) l.innerHTML = `<span id=\"syncDot\" class=\"w-2 h-2 rounded-full bg-${color}-500\"><\u002Fspan> ${text}`;\n            else if (dot) dot.className = `w-2 h-2 rounded-full bg-${color}-500`;\n        }\n\n        function markSynced() {\n            syncMeta.lastSync = new Date().toISOString();\n            localStorage.setItem('prod_sync_meta', JSON.stringify(syncMeta));\n            const el = document.getElementById('syncLastLabel');\n            if (el) el.innerText = 'آخر مزامنة: ' + new Date(syncMeta.lastSync).toLocaleTimeString('ar-EG');\n        }\n\n        function touchLocalTs() {\n            syncMeta.localTs = Date.now();\n            localStorage.setItem('prod_sync_meta', JSON.stringify(syncMeta));\n        }\n\n        function syncCreds() {\n            const cc = cloudConfig || {};\n            const gv = (id, fb) => { const e = document.getElementById(id); const v = e ? String(e.value || '').trim() : ''; return v || (fb || ''); };\n            syncConfig.url = String(gv('syncUrl', syncConfig.url || cc.url)).replace(/\\/$/, '');\n            syncConfig.key = gv('syncKey', syncConfig.key || cc.key);\n            syncConfig.spaceId = gv('syncSpaceId', syncConfig.spaceId);\n            return { url: syncConfig.url, key: syncConfig.key, spaceId: syncConfig.spaceId };\n        }\n\n        function syncMissingMsg() {\n            const c = syncCreds(); const miss = [];\n            if (!c.url) miss.push('رابط قاعدة البيانات');\n            if (!c.key) miss.push('مفتاح الاتصال');\n            if (!c.spaceId) miss.push('معرف المساحة');\n            return miss.length ? ('أكمل ' + miss.join(' و ') + ' أولاً') : 'بيانات الاتصال غير مكتملة';\n        }\n\n        function syncEndpoint() {\n            const c = syncCreds();\n            if (!c.url || !c.key || !c.spaceId) return null;\n            return { url: c.url, key: c.key };\n        }\n\n        function collectSnapshot() {\n            return {\n                v: 1, ts: syncMeta.localTs || Date.now(), device: deviceId,\n                books: globalBooks, reading_logs: globalReadingLogs,\n                activity_logs: globalActivityLogs, forgiven: missed_days_forgiven,\n                domains: domainDefs, deleted_ids: deletedIds\n            };\n        }\n\n        function mergeById(localArr, remoteArr, localNewer, dead) {\n            const map = new Map();\n            const low = localNewer ? (remoteArr || []) : (localArr || []);\n            const high = localNewer ? (localArr || []) : (remoteArr || []);\n            low.forEach(x => { if (x && x.id) map.set(x.id, x); });\n            high.forEach(x => { if (x && x.id) map.set(x.id, x); });\n            dead.forEach(id => map.delete(id));\n            return Array.from(map.values());\n        }\n\n        function applyRemoteSnapshot(remote) {\n            if (!remote || typeof remote !== 'object') return false;\n            const localNewer = (syncMeta.localTs || 0) >= (Number(remote.ts) || 0);\n            const dead = Array.from(new Set([...(deletedIds || []), ...(remote.deleted_ids || [])]));\n\n            globalBooks = mergeById(globalBooks, remote.books, localNewer, dead);\n            globalReadingLogs = mergeById(globalReadingLogs, remote.reading_logs, localNewer, dead);\n            globalActivityLogs = mergeById(globalActivityLogs, remote.activity_logs, localNewer, dead);\n            missed_days_forgiven = Array.from(new Set([...(missed_days_forgiven || []), ...(remote.forgiven || [])]));\n            // تعريفات المجالات تُدمج بالمعرّف مثل بقية السجلات، فلا يفقد جهازٌ مجالاً أنشأه الآخر\n            if (Array.isArray(remote.domains)) {\n                domainDefs = mergeById(domainDefs, remote.domains, localNewer, dead);\n                saveDomains();\n                loadDomains();\n            }\n            deletedIds = dead;\n            localStorage.setItem('prod_deleted_ids', JSON.stringify(deletedIds));\n            return true;\n        }\n\n        async function syncPullOnly(silent) {\n            const ep = syncEndpoint();\n            if (!ep) { if (!silent) showToast(syncMissingMsg()); return false; }\n            try {\n                updateSyncLabel('جاري السحب...', 'sky');\n                const res = await fetch(`${ep.url}/rest/v1/${SYNC_TABLE}?space_id=eq.${encodeURIComponent(syncConfig.spaceId)}&select=payload,updated_at`, {\n                    headers: { apikey: ep.key, Authorization: `Bearer ${ep.key}` }\n                });\n                if (!res.ok) throw new Error(await res.text());\n                const rows = await res.json();\n                if (!rows.length) { updateSyncLabel('لا توجد نسخة سحابية بعد', 'amber'); if (!silent) showToast('لا توجد بيانات في السحابة بعد'); return false; }\n                applyRemoteSnapshot(rows[0].payload);\n                localStorage.setItem('prod_books', JSON.stringify(globalBooks));\n                localStorage.setItem('prod_reading_logs', JSON.stringify(globalReadingLogs));\n                localStorage.setItem('prod_activity_logs', JSON.stringify(globalActivityLogs));\n                localStorage.setItem('prod_forgiven', JSON.stringify(missed_days_forgiven));\n                recalculateSystem();\n                markSynced();\n                updateSyncLabel(syncConfig.auto ? 'مفعّلة' : 'متزامن', 'emerald');\n                if (!silent) showToast('تم سحب البيانات ودمجها ✅');\n                return true;\n            } catch (e) {\n                syncLastError = e.message || 'خطأ غير معروف';\n                updateSyncLabel('فشل السحب', 'rose');\n                if (!silent) showToast('فشل السحب: ' + e.message);\n                return false;\n            }\n        }\n\n        async function syncPushOnly(silent) {\n            const ep = syncEndpoint();\n            if (!ep) { if (!silent) showToast(syncMissingMsg()); return false; }\n            try {\n                updateSyncLabel('جاري الرفع...', 'sky');\n                if (!syncMeta.localTs) touchLocalTs();\n                const body = [{ space_id: syncConfig.spaceId, payload: collectSnapshot(), device_id: deviceId, updated_at: new Date().toISOString() }];\n                const res = await fetch(`${ep.url}/rest/v1/${SYNC_TABLE}?on_conflict=space_id`, {\n                    method: 'POST',\n                    headers: { apikey: ep.key, Authorization: `Bearer ${ep.key}`, 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' },\n                    body: JSON.stringify(body)\n                });\n                if (!res.ok) throw new Error(await res.text());\n                markSynced();\n                updateSyncLabel(syncConfig.auto ? 'مفعّلة' : 'متزامن', 'emerald');\n                if (!silent) showToast('تم رفع نسخة المزامنة ✅');\n                return true;\n            } catch (e) {\n                syncLastError = e.message || 'خطأ غير معروف';\n                updateSyncLabel('فشل الرفع', 'rose');\n                if (!silent) showToast('فشل الرفع: ' + e.message);\n                return false;\n            }\n        }\n\n        async function syncNow(silent) {\n            if (syncBusy) return false;\n            const ep = syncEndpoint();\n            if (!ep) { if (!silent) showToast(syncMissingMsg()); return false; }\n            syncBusy = true; syncLastError = '';\n            if (!silent) setSyncBusyUI(true);\n            let pulled = false, pushed = false;\n            try {\n                pulled = await syncPullOnly(true);\n                touchLocalTs();\n                pushed = await syncPushOnly(true);\n                if (pushed) {\n                    localStorage.setItem('prod_sync_config', JSON.stringify(syncConfig));\n                    if (!silent) showToast(pulled ? 'تمت المزامنة ✅ تم جلب بيانات السحابة ورفع أحدث تعديلاتك' : 'تم رفع بياناتك ✅ (لا توجد نسخة سحابية سابقة بعد)');\n                } else if (!silent) {\n                    showToast('فشلت المزامنة ❌ ' + (syncLastError ? ('— ' + String(syncLastError).slice(0, 90)) : '— تحقق من الرابط والمفتاح ومعرف المساحة'));\n                }\n            } finally {\n                syncBusy = false;\n                if (!silent) setSyncBusyUI(false);\n            }\n            return pushed;\n        }\n\n        function queueSyncPush() {\n            if (!syncConfig.auto || !syncConfig.spaceId) return;\n            if (syncDebounceRef) clearTimeout(syncDebounceRef);\n            syncDebounceRef = setTimeout(() => syncPushOnly(true), 2500);\n        }\n\n        function onNetworkBackOnline() { if (syncConfig.auto && syncConfig.spaceId) syncNow(true); }\n\n        function startAutoSync() {\n            stopAutoSync();\n            updateSyncLabel('مفعّلة', 'emerald');\n            syncNow(true);\n            syncIntervalRef = setInterval(() => syncNow(true), Math.max(10, syncConfig.intervalSec) * 1000);\n        }\n\n        function stopAutoSync() {\n            if (syncIntervalRef) { clearInterval(syncIntervalRef); syncIntervalRef = null; }\n            updateSyncLabel('غير مفعّل', 'slate');\n        }\n\n        /* ================== المطلب 1: محرك شاشة الإقلاع ==================\n           التقدّم هنا ليس زخرفة زمنية: كل مرحلة مربوطة بعمل تهيئة حقيقي، والنسبة\n           تتقدّم بعد إتمامه. بين المرحلة والتالية ننتظر إطار رسم واحداً حتى يرى\n           المستخدم التقدّم فعلاً — فالتهيئة كلها متزامنة ولولا ذلك لقفزت من 0 إلى 100.\n\n           قاعدة حاكمة: الشاشة تختفي دائماً. لو رمت أي مرحلة استثناءً، أو لم يصل\n           الحدث أصلاً، يزيلها finally أو شبكة الأمان الزمنية — فلا يُحجب النظام أبداً. */\n\n        const BOOT_ARC_LEN = 339.29; // 2π × 54\n        let bootHidden = false;\n        let bootStarted = false; // يضمن تنفيذاً واحداً مهما تعدّدت مسارات البدء\n        let appBooted = false;   // يمنع إعادة رسم كاملة أثناء التهيئة الأولى\n\n        function bootStage(pct, label) {\n            const arc = document.getElementById('bootArc');\n            const bar = document.getElementById('bootBar');\n            const txt = document.getElementById('bootStage');\n            const p = Math.max(0, Math.min(100, pct));\n            if (arc) arc.setAttribute('stroke-dashoffset', String(BOOT_ARC_LEN * (1 - p / 100)));\n            if (bar) bar.style.width = p + '%';\n            if (txt && label && txt.textContent !== label) txt.innerHTML = '<span>' + label + '<\u002Fspan>';\n        }\n\n        // إطار رسم واحد يمنح المتصفح فرصة لإظهار المرحلة قبل أن نبدأ التالية — أو\n        // مهلة قصيرة تنوب عنه في التبويب المخفي حيث لا تُطلق إطارات الرسم أصلاً.\n        function bootTick() {\n            return new Promise(r => {\n                let done = false;\n                const fin = () => { if (!done) { done = true; r(); } };\n                requestAnimationFrame(() => requestAnimationFrame(fin));\n                setTimeout(fin, 120);\n            });\n        }\n\n        function hideBootScreen() {\n            if (bootHidden) return;\n            bootHidden = true;\n            const el = document.getElementById('bootScreen');\n            if (!el) return;\n            bootStage(100, 'جاهز');\n            // مهلة قصيرة ليستقرّ القوس على 100% قبل أن تبدأ الشاشة بالتلاشي\n            setTimeout(() => {\n                el.classList.add('boot-out');\n                setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 650);\n            }, 260);\n        }\n\n        async function runBootSequence() {\n            if (bootStarted) return;\n            bootStarted = true;\n            try {\n                bootStage(8, 'قراءة مجالاتك');\n                loadDomains();\n                await bootTick();\n\n                bootStage(22, 'تهيئة لوحة التوازن');\n                initBalanceHub();\n                rebuildHubSections();\n                initDomainHub();\n                await bootTick();\n\n                bootStage(48, 'تحميل بياناتك وحساب المؤشرات');\n                initSystem();\n                switchTab('dashboard');\n                await bootTick();\n\n                bootStage(70, 'تجهيز الأدوات');\n                safeCreateIcons();\n                toggleDynamicActivityFields();\n                initTimerSystem();\n                initCloudModule();\n                loadSyncConfig();\n                await bootTick();\n\n                bootStage(88, 'ضبط محتسب المدة');\n                mountAllDurationPickers();\n                initTimeRangePicker();\n                await bootTick();\n\n                bootStage(96, 'اللمسات الأخيرة');\n                await bootTick();\n            } catch (e) {\n                // خطأ في مرحلة واحدة لا يجوز أن يحبس المستخدم خلف شاشة إقلاع\n                console.error('[boot]', e);\n            } finally {\n                appBooted = true;\n                hideBootScreen();\n                // النوافذ الأسبوعية تُستدعى بعد انكشاف الواجهة، لا فوقها وهي محجوبة\n                try { maybeShowFridayWindow(); maybeShowMondayWindow(); } catch (e) { console.error('[boot]', e); }\n            }\n        }\n\n        // Start — ثلاثة مسارات للبدء، أوّلها وصولاً هو الذي ينفّذ:\n        //   1) المستند مكتمل أصلاً (حدث load مضى قبل تنفيذ هذا السطر).\n        //   2) حدث load لم يقع بعد، فننتظره.\n        //   3) شبكة احتياطية زمنية تغطّي أي مسار تحميل لا يُطلق الحدث بعد استبدال المستند.\n        if (document.readyState === 'complete') {\n            setTimeout(runBootSequence, 0);\n        } else {\n            window.addEventListener('load', runBootSequence, { once: true });\n            setTimeout(runBootSequence, 1500);\n        }\n\n        // شبكة أمان أخيرة: مهما جرى، لا تبقى الواجهة محجوبة خلف شاشة الإقلاع\n        setTimeout(() => { if (!bootHidden) { console.warn('[boot] انكشاف احتياطي'); hideBootScreen(); } }, 9000);\n    <\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
  </script>

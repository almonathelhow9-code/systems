nslate-x-full')){ sidebar.classList.remove('translate-x-full'); overlay.classList.remove('hidden'); setTimeout(()=>overlay.classList.remove('opacity-0'),10); } else closeSidebar(); }\n        function closeSidebar() { sidebar.classList.add('translate-x-full'); overlay.classList.add('opacity-0'); setTimeout(()=>overlay.classList.add('hidden'),300); }\n        function showToast(msg) { const t=document.getElementById('toast'); document.getElementById('toastMessage').innerText=msg; t.classList.remove('-translate-y-10','opacity-0'); setTimeout(()=>t.classList.add('-translate-y-10','opacity-0'),3000); }\n        function switchTab(tabId) { activeTab = tabId; document.querySelectorAll('.tab-content').forEach(el=>el.classList.add('hidden')); document.getElementById(`tab-${tabId}`).classList.remove('hidden'); document.querySelectorAll('.menu-btn').forEach(btn=>{btn.classList.remove('bg-slate-800','text-white','border-l-4','border-blue-500');btn.classList.add('text-slate-300');}); const btn=document.getElementById(`btn-${tabId}`); if(btn) btn.classList.add('bg-slate-800','text-white','border-l-4','border-blue-500'); if(window.innerWidth<768) closeSidebar(); setTimeout(recalculateSystem,100); }\n\n        function openQuickLog() { const m=document.getElementById('quickLogModal'); m.classList.remove('hidden'); setTimeout(()=>{m.classList.remove('opacity-0');},10); }\n        function closeQuickLog() { const m=document.getElementById('quickLogModal'); m.classList.add('opacity-0'); setTimeout(()=>m.classList.add('hidden'),300); }\n\n        function openAddBookModal() { const m=document.getElementById('addBookModal'); m.classList.remove('hidden'); setTimeout(()=>{m.classList.remove('opacity-0');document.getElementById('addBookBox').classList.remove('scale-95');},10); }\n        function closeAddBookModal() { const m=document.getElementById('addBookModal'); m.classList.add('opacity-0'); document.getElementById('addBookBox').classList.add('scale-95'); setTimeout(()=>m.classList.add('hidden'),300); }\n\n        // المطلب 3: نافذة تسجيل ورد اليوم أصبحت منبثقة (بنفس نمط نافذة إضافة كتاب)\n        // وتطلب من المستخدم اختيار الكتاب دوماً، بلا أي اختيار افتراضي مفروض.\n        function openLogReadingModal() {\n            updateBooksDropdown();\n            const m=document.getElementById('logReadingModal'); m.classList.remove('hidden');\n            setTimeout(()=>{m.classList.remove('opacity-0');document.getElementById('logReadingBox').classList.remove('scale-95');},10);\n        }\n        function closeLogReadingModal() { const m=document.getElementById('logReadingModal'); m.classList.add('opacity-0'); document.getElementById('logReadingBox').classList.add('scale-95'); setTimeout(()=>m.classList.add('hidden'),300); }\n\n        // المطلب 2: نافذة تهنئة احترافية تظهر عند اكتمال أي كتاب، مع رسالة تتناسب مع حجم الجهد المبذول\n        function getBookEffortMessage(pages) {\n            if (pages < 100) return `أنجزت ${pages} صفحة كاملة! بداية قوية تعكس التزامك بالقراءة اليومية، وكل صفحة إضافة حقيقية لرصيدك المعرفي.`;\n            if (pages < 250) return `أنجزت ${pages} صفحة كاملة! هذا مجهود يُحسب لك، خطوة واثقة في طريق بناء عقل أكثر وعياً ومهارة.`;\n            if (pages < 500) return `أنجزت ${pages} صفحة كاملة! إنجاز كبير يعكس مثابرة حقيقية واستثماراً واعياً في وقتك، فخلف كل صفحة قرار يومي بعدم التوقف.`;\n            return `أنجزت ${pages} صفحة كاملة! هذا إنجاز استثنائي يدل على انضباط نادر وإرادة قوية، جهد بهذا الحجم لا ينجزه إلا من يبني نفسه بجدية.`;\n        }\n        function showBookCompletionModal(book) {\n            document.getElementById('bookCompleteTitle').innerText = `«${book.title}»`;\n            const effort = getBookEffortMessage(book.total_pages);\n            document.getElementById('bookCompleteMessage').innerText = `${effort} استمر بهذا الزخم في تطوير نفسك علمياً ومعرفياً ودينياً وفي تراكم خبراتك العملية، فكل كتاب يكتمل هو لبنة جديدة في مشروعك الشخصي طويل المدى.`;\n            const m = document.getElementById('bookCompleteModal');\n            m.classList.remove('hidden');\n            const box = document.getElementById('bookCompleteBox');\n            box.classList.remove('congrats-pop-enter'); void box.offsetWidth; box.classList.add('congrats-pop-enter');\n            setTimeout(()=>{m.classList.remove('opacity-0');},10);\n        }\n        function closeBookCompleteModal() { const m=document.getElementById('bookCompleteModal'); m.classList.add('opacity-0'); setTimeout(()=>m.classList.add('hidden'),300); }\n\n        // Modals (Confirm & Edit)\n        let confirmAction = null;\n        function openConfirmModal(msg, action) { confirmAction = action; document.getElementById('confirmMessage').innerText = msg; const m=document.getElementById('confirmModal'); m.classList.remove('hidden'); setTimeout(()=>{m.classList.remove('opacity-0');document.getElementById('confirmBox').classList.remove('scale-95');},10); }\n        function closeConfirmModal() { const m=document.getElementById('confirmModal'); m.classList.add('opacity-0'); document.getElementById('confirmBox').classList.add('scale-95'); setTimeout(()=>m.classList.add('hidden'),300); confirmAction = null; }\n        document.getElementById('btnConfirmYes').addEventListener('click', ()=>{ if(confirmAction) confirmAction(); closeConfirmModal(); });\n        \n        function openEditModal(type, id) {\n            document.getElementById('editType').value = type; document.getElementById('editId').value = id;\n            const container = document.getElementById('editFieldsContainer'); container.innerHTML = '';\n            const cClass = \"w-full glass-panel border border-slate-700 rounded-xl px-4 py-2 text-sm outline-none focus:border-blue-500 mb-3\";\n            if(type === 'activity_logs') {\n                const l = globalActivityLogs.find(x=>x.id===id); if(!l) return;\n                container.innerHTML = `<input type=\"date\" id=\"ed_date\" value=\"${l.date}\" class=\"${cClass}\"> <input type=\"number\" id=\"ed_mins\" value=\"${l.time_mins}\" class=\"${cClass}\" placeholder=\"الدقائق\"> <input type=\"number\" id=\"ed_tasks\" value=\"${l.tasks_completed}\" class=\"${cClass}\" placeholder=\"المهام\"> <textarea id=\"ed_notes\" class=\"${cClass} resize-none h-24\" placeholder=\"ملاحظات\">${l.notes||''}<\u002Ftextarea>`;\n            } else if (type === 'reading_logs') {\n                const l = globalReadingLogs.find(x=>x.id===id); if(!l) return;\n                container.innerHTML = `<input type=\"date\" id=\"ed_date\" value=\"${l.date}\" class=\"${cClass}\"> <input type=\"number\" id=\"ed_pages\" value=\"${l.pages_read}\" class=\"${cClass}\" placeholder=\"الصفحات\"> <input type=\"number\" id=\"ed_mins\" value=\"${l.time_spent_mins}\" class=\"${cClass}\" placeholder=\"الدقائق\">`;\n            } else if (type === 'books') {\n                const b = globalBooks.find(x=>x.id===id); if(!b) return;\n                const readSoFar = globalReadingLogs.filter(l=>l.book_id===id).reduce((s,l)=>s+Number(l.pages_read||0),0);\n                container.innerHTML = `<input type=\"text\" id=\"ed_title\" value=\"${b.title}\" class=\"${cClass}\" placeholder=\"اسم الكتاب\"> <input type=\"number\" id=\"ed_pages\" value=\"${b.total_pages}\" class=\"${cClass}\" placeholder=\"إجمالي الصفحات\" min=\"1\"> <input type=\"date\" id=\"ed_date\" value=\"${b.start_date}\" class=\"${cClass}\">\n                <label class=\"text-xs font-bold text-emerald-400 mb-1.5 block\">التقدم الحالي (الصفحات المقروءة)<\u002Flabel>\n                <input type=\"number\" id=\"ed_progress\" value=\"${readSoFar}\" min=\"0\" class=\"${cClass}\" placeholder=\"عدد الصفحات المقروءة\">\n                <p class=\"text-[11px] text-slate-400 -mt-2 leading-relaxed\">عدّل الرقم مباشرة لتصحيح تقدمك (مثلاً من 10 إلى 8). ستُعدَّل سجلات القراءة تلقائياً لتطابق الرقم الجديد.<\u002Fp>`;\n            }\n            // المطلب 1: تركيب محتسب المدة الذكي على حقل الدقائق المُولَّد ديناميكياً\n            mountDurationPicker('ed_mins', '#3b82f6', 'تعديل السجل — الدقائق المستغرقة');\n            const m = document.getElementById('editModal'); m.classList.remove('hidden'); setTimeout(()=>{m.classList.remove('opacity-0');document.getElementById('editBox').classList.remove('scale-95');},10);\n        }\n        function closeEditModal() { const m=document.getElementById('editModal'); m.classList.add('opacity-0'); document.getElementById('editBox').classList.add('scale-95'); setTimeout(()=>m.classList.add('hidden'),300); }\n        document.getElementById('editForm').addEventListener('submit', e=>{\n            e.preventDefault(); const t=document.getElementById('editType').value; const id=document.getElementById('editId').value;\n            if(t==='reading_logs'){ const l=globalReadingLogs.find(x=>x.id===id); if(l){ l.date=document.getElementById('ed_date').value; l.pages_read=Number(document.getElementById('ed_pages').value); l.time_spent_mins=Number(document.getElementById('ed_mins').value); } }\n            else if(t==='activity_logs'){ const l=globalActivityLogs.find(x=>x.id===id); if(l){ l.date=document.getElementById('ed_date').value; l.time_mins=Number(document.getElementById('ed_mins').value); l.tasks_completed=Number(document.getElementById('ed_tasks').value); l.notes=document.getElementById('ed_notes').value; } }\n            else if(t==='books'){ const b=globalBooks.find(x=>x.id===id); if(b){ b.title=document.getElementById('ed_title').value; b.total_pages=Number(document.getElementById('ed_pages').value); b.start_date=document.getElementById('ed_date').value; const pEl=document.getElementById('ed_progress'); if(pEl) applyBookProgress(id, Math.max(0, Math.min(Number(pEl.value)||0, b.total_pages))); } }\n            saveLocalData(); recalculateSystem(); closeEditModal(); showToast(\"تم التحديث!\");\n        });\n\n        function deleteItem(type, id) {\n            openConfirmModal(\"هل أنت متأكد من حذف هذا السجل؟\", () => {\n                if(type === 'books') globalBooks = globalBooks.filter(x => x.id !== id);\n                if(type === 'reading_logs') globalReadingLogs = globalReadingLogs.filter(x => x.id !== id);\n                if(type === 'activity_logs') globalActivityLogs = globalActivityLogs.filter(x => x.id !== id);\n                recordDeletion(id);\n                saveLocalData(); recalculateSystem(); showToast(\"تم الحذف بنجاح!\");\n            });\n        }\n\n        // --- 4. Logic & Calculations ---\n\n        // حساب الساعات والمهام (التركيز على اليوم فقط في الواجهة الرئيسية)\n        function calculateTodayStats() {\n            let todayMins = 0; let todayTasks = 0;\n            globalActivityLogs.forEach(l => { if(l.date === todayStr) { todayMins += Number(l.time_mins); todayTasks += Number(l.tasks_completed); }});\n            // المطلب 2: احتساب القراءة كمهمة. كل سجل قراءة = 1 مهمة.\n            globalReadingLogs.forEach(l => { if(l.date === todayStr) { todayMins += Number(l.time_spent_mins); todayTasks += 1; }});\n            \n            // المطلب 8: عرض الوقت بالدقائق/الساعات والدقائق بدلاً من كسور الساعة المربكة\n            document.getElementById('cardTodayHours').innerText = formatDuration(todayMins);\n            document.getElementById('cardTodayTasks').innerText = todayTasks;\n\n            // ملخص الجلسات (يملأ فراغ البطاقة بمعلومة حقيقية بدل الفراغ السلبي)\n            let sessions = 0;\n            globalActivityLogs.forEach(l => { if (l.date === todayStr) sessions++; });\n            globalReadingLogs.forEach(l => { if (l.date === todayStr) sessions++; });\n            const sEl = document.getElementById('cardSessions');\n            const aEl = document.getElementById('cardAvgSession');\n            if (sEl) sEl.innerText = sessions + ' جلسة';\n            if (aEl) aEl.innerText = sessions ? 'بمعدل ' + formatDuration(Math.round(todayMins / sessions)) + '/جلسة' : 'ابدأ أول جلسة';\n        }\n\n        // المطلب 4: حساب السلسلة الصارمة من تاريخ بدء النظام\n        // تم إصلاح خلل جوهري هنا: الاعتماد سابقاً على toISOString() لاستخراج التاريخ\n        // كان يزيح التاريخ يوماً كاملاً للخلف في أي منطقة زمنية موجبة (مثل السعودية)،\n        // فيظهر انقطاع فوري ويُختصر العداد إلى يوم واحد فقط، حتى بدون نقل البيانات.\n        // الحل: مقارنة نصية مباشرة لسلاسل التاريخ (YYYY-MM-DD) بلا أي تحويل UTC.\n        function calculateStreak() {\n            const datesSet = new Set([...globalActivityLogs.map(l=>l.date), ...globalReadingLogs.map(l=>l.date)]);\n            let currentStr = SYSTEM_START_STR;\n            const limitStr = getTodayStr();\n            let streak = 0; let gapFound = false; let gapDate = null;\n\n            while (currentStr <= limitStr) {\n                if (datesSet.has(currentStr) || missed_days_forgiven.includes(currentStr)) {\n                    streak++;\n                } else if (currentStr === limitStr) {\n                    break; // اليوم الحالي لم ينته بعد، لا يُعتبر انقطاعاً\n                } else {\n                    gapFound = true; gapDate = currentStr; break; // انقطاع غير معوض\n                }\n                currentStr = addDaysStr(currentStr, 1);\n            }\n\n            const btnForgive = document.getElementById('btnForgiveDay');\n            if (gapFound) {\n                btnForgive.classList.remove('hidden');\n                btnForgive.dataset.missedDate = gapDate;\n            } else {\n                btnForgive.classList.add('hidden');\n            }\n\n            return streak;\n        }\n\n        function forgiveMissedDay() {\n            const btn = document.getElementById('btnForgiveDay');\n            const missedDate = btn.dataset.missedDate;\n            openConfirmModal(`هل تتعهد بالتعويض وتأكيد استمرارك بالرغم من تفويت يوم ${missedDate}؟`, () => {\n                missed_days_forgiven.push(missedDate);\n                saveLocalData(); recalculateSystem();\n                showToast('تم ترميم السلسلة! نثق بالتزامك المستقبلي.');\n            });\n        }\n\n        // KPI Charts Logic\n        let kpiPieChartInstance = null;\n        function openKpiModal(type) {\n            currentKpiContext.type = type;\n            document.getElementById('kpiTimeFilter').value = 'all'; // Default\n            const m = document.getElementById('kpiModal'); m.classList.remove('hidden'); setTimeout(()=>{m.classList.remove('opacity-0');document.getElementById('kpiBox').classList.remove('scale-95');},10);\n            refreshKpiChart();\n        }\n\n        function closeKpiModal() { const m=document.getElementById('kpiModal'); m.classList.add('opacity-0'); document.getElementById('kpiBox').classList.add('scale-95'); setTimeout(()=>m.classList.add('hidden'),300); }\n\n        function refreshKpiChart() {\n            const ctx = document.getElementById('kpiPieChart').getContext('2d');\n            if(kpiPieChartInstance) kpiPieChartInstance.destroy();\n            \n            const filter = document.getElementById('kpiTimeFilter').value;\n            const todayStrNow = getTodayStr();\n            let startDateStr = '0000-01-01';\n\n            if(filter === 'today') startDateStr = todayStrNow;\n            else if(filter === 'week') startDateStr = getWeekStartStr(todayStrNow);\n            else if(filter === 'month') startDateStr = getMonthStartStr(todayStrNow);\n            else if(filter === 'year') startDateStr = getYearStartStr(todayStrNow);\n\n            let data = {}; let title = \"\";\n            const kpiType = currentKpiContext.type;\n\n            if(kpiType === 'time') {\n                title = \"توزيع الساعات\";\n                globalReadingLogs.forEach(l => { if(l.date >= startDateStr) data['قراءة'] = (data['قراءة']||0) + Number(l.time_spent_mins); });\n                globalActivityLogs.forEach(l => { if(l.date >= startDateStr) { const cat = l.category==='Photography'?'تصوير':l.category==='Business'?'أعمال':l.category==='AI'?'ذكاء':domainLabel(l.category); data[cat] = (data[cat]||0) + Number(l.time_mins); }});\n            } else if (kpiType === 'tasks') {\n                title = \"توزيع المهام\";\n                globalReadingLogs.forEach(l => { if(l.date >= startDateStr) data['قراءة'] = (data['قراءة']||0) + 1; }); // القراءة كمهمة\n                globalActivityLogs.forEach(l => { if(l.date >= startDateStr) { const cat = l.category==='Photography'?'تصوير':l.category==='Business'?'أعمال':l.category==='AI'?'ذكاء':domainLabel(l.category); data[cat] = (data[cat]||0) + Number(l.tasks_completed); }});\n            }\n            document.getElementById('kpiModalTitle').innerText = title;\n            \n            const labels = Object.keys(data); const values = Object.values(data);\n            if(values.length === 0 || values.every(v=>v===0)) { labels.push('لا يوجد إنجاز'); values.push(1); }\n            kpiPieChartInstance = safeChart(ctx, { type: 'doughnut', data: { labels: labels, datasets: [{ data: values, backgroundColor: ['#3b82f6', '#10b981', '#f99d54', '#8b5cf6', '#ec4899', '#14b8a6'], borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: {color: getComputedStyle(document.body).getPropertyValue('--text-main') || '#fff', font:{family:'Cairo'}} } } } });\n        }\n\n        // --- 5. Renders & Updates ---\n        function recalculateSystem() {\n            calculateTodayStats();\n            renderBalanceHub();\n            document.getElementById('cardStreak').innerText = calculateStreak() + ' أيام';\n\n            updateBooksDropdown();\n            populateAdvancedChartCategories(); updateAdvancedChart();\n            \n            renderBooksList();\n            renderReadShelf();\n            populateAnalysisBooks();\n            updateReadingAnalysis();\n            renderSectionLogs('photoLogsContainer', 'Photography', 'camera', 'amber', 'لم تقم بتوثيق أعمال التصوير حتى الآن. ابدأ بتسجيل جلسات التصوير أو التعديل.');\n            renderSectionLogs('businessLogsContainer', 'Business', 'briefcase', 'indigo', 'سجل مهامك الإدارية ودراسات الحالة هنا.');\n            renderSectionLogs('aiLogsContainer', 'AI', 'cpu', 'violet', 'مساحة لتجارب هندسة الأوامر والوكلاء الذكيين.');\n            renderCustomLogs();\n            refreshDomains();\n            \n            updateComprehensiveReport();\n            safeCreateIcons();\n        }\n\n        function getEmptyStateHTML(icon, message, color) {\n            return `<div class=\"flex flex-col items-center justify-center py-12 text-center opacity-70 group hover:opacity-100 transition duration-300\">\n                <div class=\"w-16 h-16 bg-${color}-500/10 rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition\"><i data-lucide=\"${icon}\" class=\"w-8 h-8 text-${color}-400\"><\u002Fi><\u002Fdiv>\n                <p class=\"text-sm text-slate-400 max-w-xs leading-relaxed\">${message}<\u002Fp>\n            <\u002Fdiv>`;\n        }\n\n        // إصلاح خلل جوهري: كانت القائمة تُعاد بناؤها بالكامل مع كل استدعاء لـ recalculateSystem()\n        // (وهو ما يحدث تلقائياً بعد 100ms من كل تبديل تبويب)، فيُعاد ضبط الاختيار إلى الكتاب\n        // الأول دون أي تنبيه، فتُسجَّل صفحات القراءة بالخطأ على كتاب مختلف عن الذي اختاره المستخدم.\n        // الحل: نحفظ الكتاب المحدد حالياً ونعيد اختياره بعد إعادة بناء القائمة إن كان لا يزال موجوداً.\n        function updateBooksDropdown() {\n            const select = document.getElementById('logBookSelect');\n            const currentSelection = select.value;\n            select.innerHTML = '';\n            if (!globalBooks.length) { select.add(new Option(\"لا توجد كتب، أضف كتاباً أولاً\", \"\")); return; }\n            // المطلب 2: لا نعرض الكتب المكتملة في قائمة التسجيل حتى لا تُضاف صفحات إضافية بعد الاكتمال\n            let bProg = {}; globalReadingLogs.forEach(l=>bProg[l.book_id]=(bProg[l.book_id]||0)+Number(l.pages_read));\n            const availableBooks = globalBooks.filter(b => (bProg[b.id]||0) < b.total_pages);\n            if (!availableBooks.length) { select.add(new Option(\"لا توجد كتب متاحة (كل كتبك مكتملة 🎉)\", \"\")); return; }\n            availableBooks.forEach(b => select.add(new Option(b.title, b.id)));\n            if (currentSelection && availableBooks.some(b => b.id === currentSelection)) {\n                select.value = currentSelection;\n            }\n        }\n\n        function renderBooksList() {\n            const c = document.getElementById('booksListContainer'); \n            if(!globalBooks.length) { c.innerHTML = getEmptyStateHTML('book-dashed', 'الرف فارغ. أضف كتاباً جديداً لتأسيس مكتبتك المعرفية.', 'emerald'); return; }\n            let bProg = {}; globalReadingLogs.forEach(l=>bProg[l.book_id]=(bProg[l.book_id]||0)+l.pages_read);\n            const activeBooks = globalBooks.filter(b => (bProg[b.id]||0) < (Number(b.total_pages)||1));\n            if(!activeBooks.length) { c.innerHTML = getEmptyStateHTML('check-check', 'كل كتبك الحالية مكتملة 🎉 — تجدها الآن في «رف الكتب المقروءة» أسفل الصفحة.', 'emerald'); return; }\n            c.innerHTML = activeBooks.map(b=>{\n                let read = bProg[b.id]||0; let pct = Math.min((read/b.total_pages)*100, 100).toFixed(0);\n                return `<div class=\"glass-panel p-4 rounded-2xl relative group\">\n                    <div class=\"absolute top-3 left-3 flex gap-2 opacity-80 hover:opacity-100 transition\"><button onclick=\"openEditModal('books','${b.id}')\" title=\"تعديل الكتاب والتقدم\" class=\"text-blue-400 p-1.5 bg-slate-800 border border-slate-700 rounded-lg\"><i data-lucide=\"edit-2\" class=\"w-4 h-4\"><\u002Fi><\u002Fbutton><button onclick=\"deleteItem('books','${b.id}')\" title=\"حذف\" class=\"text-rose-500 p-1.5 bg-slate-800 border border-slate-700 rounded-lg\"><i data-lucide=\"trash-2\" class=\"w-4 h-4\"><\u002Fi><\u002Fbutton><\u002Fdiv>\n                    <div class=\"flex items-center gap-3 mb-3\"><div class=\"p-2 bg-emerald-500/10 text-emerald-400 rounded-lg\"><i data-lucide=\"book\" class=\"w-5 h-5\"><\u002Fi><\u002Fdiv><div><h4 class=\"font-bold text-sm truncate w-40 md:w-56 text-slate-200 flex items-center gap-1.5\">${b.title}<\u002Fh4><span class=\"text-[10px] text-slate-400\">البدء: ${b.start_date}<\u002Fspan><\u002Fdiv><\u002Fdiv>\n                    <div class=\"flex items-center gap-2\"><span class=\"text-emerald-400 font-bold text-xs\">${pct}%<\u002Fspan><div class=\"flex-1 bg-slate-950 h-1.5 rounded-full overflow-hidden\"><div class=\"bg-emerald-500 h-full transition-all\" style=\"width:${pct}%\"><\u002Fdiv><\u002Fdiv><span class=\"text-slate-400 text-[10px]\">${read}/${b.total_pages}<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>`;\n            }).join('');\n        }\n\n        function renderSectionLogs(cId, cat, icon, color, emptyMsg) {\n            const c = document.getElementById(cId); if(!c) return; \n            const logs = globalActivityLogs.filter(l=>l.category===cat).sort((a,b)=>new Date(b.date)-new Date(a.date));\n            if(!logs.length) { c.innerHTML = getEmptyStateHTML(icon, emptyMsg, color); return; }\n            c.innerHTML = logs.map(l=>`<div class=\"glass-panel p-4 rounded-2xl flex items-start gap-3 group relative\">\n                <div class=\"absolute top-2 left-2 flex gap-1 opacity-0 group-hover:opacity-100 transition\"><button onclick=\"openEditModal('activity_logs','${l.id}')\" class=\"text-blue-400 p-1 bg-slate-800 rounded\"><i data-lucide=\"edit-2\" class=\"w-3.5 h-3.5\"><\u002Fi><\u002Fbutton><button onclick=\"deleteItem('activity_logs','${l.id}')\" class=\"text-rose-500 p-1 bg-slate-800 rounded\"><i data-lucide=\"trash-2\" class=\"w-3.5 h-3.5\"><\u002Fi><\u002Fbutton><\u002Fdiv>\n                <div class=\"p-2 bg-${color}-500/10 text-${color}-400 rounded-xl mt-1 shrink-0\"><i data-lucide=\"${icon}\" class=\"w-5 h-5\"><\u002Fi><\u002Fdiv>\n                <div class=\"flex-1 w-full\"><div class=\"flex justify-between items-center\"><span class=\"text-xs text-slate-400\">${l.date}<\u002Fspan><span class=\"text-xs font-bold text-${color}-400 bg-slate-950 px-2 py-0.5 rounded-full border border-${color}-500/20\">${l.time_mins} دقيقة<\u002Fspan><\u002Fdiv><p class=\"text-sm font-semibold mt-2 pr-8 text-slate-200\">${l.notes||'بدون تفاصيل'}<\u002Fp><p class=\"text-[10px] text-slate-500 mt-1\">المهام: ${l.tasks_completed}<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>`).join('');\n        }\n\n        function renderCustomLogs() {\n            const c = document.getElementById('customLogsContainer'); const stdCats = ['Photography','Business','AI']; \n            // المطلب 1: سجلات المجالات المخصّصة لها أقسامها الخاصة، فلا تُكرّر هنا\n            const logs = globalActivityLogs.filter(l=>!stdCats.includes(l.category) && !isDomainCat(l.category)).sort((a,b)=>new Date(b.date)-new Date(a.date));\n            if(!logs.length) { c.innerHTML = getEmptyStateHTML('zap', 'مساحتك الحرة فارغة. وثق تعلمك للغات، الرياضة، أو مهارات التصميم هنا.', 'pink'); c.classList.remove('grid'); return; }\n            c.classList.add('grid');\n            c.innerHTML = logs.map(l=>`<div class=\"glass-panel p-4 rounded-2xl flex items-start gap-3 group relative\">\n                <div class=\"absolute top-2 left-2 flex gap-1 opacity-0 group-hover:opacity-100 transition\"><button onclick=\"openEditModal('activity_logs','${l.id}')\" class=\"text-blue-400 p-1 bg-slate-800 rounded\"><i data-lucide=\"edit-2\" class=\"w-3.5 h-3.5\"><\u002Fi><\u002Fbutton><button onclick=\"deleteItem('activity_logs','${l.id}')\" class=\"text-rose-500 p-1 bg-slate-800 rounded\"><i data-lucide=\"trash-2\" class=\"w-3.5 h-3.5\"><\u002Fi><\u002Fbutton><\u002Fdiv>\n                <div class=\"p-2 bg-pink-500/10 text-pink-400 rounded-xl mt-1 shrink-0\"><i data-lucide=\"activity\" class=\"w-5 h-5\"><\u002Fi><\u002Fdiv>\n                <div class=\"flex-1 w-full\"><div class=\"flex justify-between items-center\"><span class=\"text-[10px] font-bold text-pink-300 bg-pink-900/30 px-2 py-0.5 rounded\">${l.category}<\u002Fspan><span class=\"text-xs text-slate-400\">${l.date}<\u002Fspan><\u002Fdiv><p class=\"text-sm font-semibold mt-2 pr-8 text-slate-200\">${l.notes||''}<\u002Fp><p class=\"text-[10px] text-slate-500 mt-1\">${l.time_mins} دقيقة | مهام: ${l.tasks_completed}<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>`).join('');\n        }\n\n        // Charts & Reports logic (Kept mostly same, added CSS variable support for colors)\n        let advancedChartInstance = null;\n        function populateAdvancedChartCategories() {\n            const select = document.getElementById('analyzerCategory'); const current = select.value || 'all';\n            select.innerHTML = '<option value=\"all\">إجمالي النشاط<\u002Foption><option value=\"Reading\">القراءة<\u002Foption><option value=\"Photography\">التصوير<\u002Foption><option value=\"Business\">الأعمال<\u002Foption><option value=\"AI\">الذكاء الاصطناعي<\u002Foption>';\n            const stdCats = ['Photography','Business','AI','Reading','all'];\n            if (domainDefs.length) { const dg = document.createElement('optgroup'); dg.label = \"مجالاتك الخاصة\"; domainDefs.forEach(d=>{const o=document.createElement('option');o.value=d.cat;o.text=d.emoji+' '+d.name;dg.appendChild(o);}); select.appendChild(dg); }\n            const custom = new Set();\n            globalActivityLogs.forEach(l=>{if(!stdCats.includes(l.category) && !isDomainCat(l.category)) custom.add(l.category);});\n            if(custom.size>0){ const g = document.createElement('optgroup'); g.label=\"الأنشطة الحرة\"; custom.forEach(c=>{const o=document.createElement('option');o.value=c;o.text=c;g.appendChild(o);}); select.appendChild(g); }\n            select.value = Array.from(select.options).some(o=>o.value===current)?current:'all';\n        }\n\n        // المطلب 4 و10: دعم عرض هذا الأسبوع / هذا الشهر / نطاق مخصص، مع إصلاح خلل التوقيت (UTC)\n        function onAnalyzerTimeframeChange() {\n            const tf = document.getElementById('analyzerTimeframe').value;\n            const customBox = document.getElementById('analyzerCustomRange');\n            if(tf === 'custom') {\n                customBox.classList.remove('hidden'); customBox.classList.add('flex');\n                if(!document.getElementById('analyzerStartDate').value) {\n                    document.getElementById('analyzerStartDate').value = getMonthStartStr(getTodayStr());\n                    document.getElementById('analyzerEndDate').value = getTodayStr();\n                }\n            } else {\n                customBox.classList.add('hidden'); customBox.classList.remove('flex');\n            }\n            updateAdvancedChart();\n        }\n\n        function updateAdvancedChart() {\n            const cat = document.getElementById('analyzerCategory').value; const tf = document.getElementById('analyzerTimeframe').value;\n            const ctx = document.getElementById('advancedTrendChart').getContext('2d'); if(advancedChartInstance) advancedChartInstance.destroy();\n            const labels = []; const dataPoints = [];\n            let logs = cat==='Reading'?globalReadingLogs : (cat==='all'?[...globalActivityLogs, ...globalReadingLogs.map(l=>({date:l.date,category:'Reading',time_mins:l.time_spent_mins}))]:globalActivityLogs.filter(l=>l.category===cat));\n            const todayStrNow = getTodayStr();\n            const sumForDate = (dStr) => { let m=0; logs.forEach(l=>{if(l.date===dStr) m+=(Number(l.time_mins)||Number(l.time_spent_mins)||0);}); return m; };\n\n            if(tf === 'week') {\n                const weekStart = getWeekStartStr(todayStrNow);\n                for(let i=0;i<7;i++){ const dStr = addDaysStr(weekStart, i); labels.push(parseLocalDate(dStr).toLocaleDateString('ar-SA',{weekday:'short'})); dataPoints.push(sumForDate(dStr)); }\n            } else if(tf === 'month') {\n                const monthStart = getMonthStartStr(todayStrNow); const d0 = parseLocalDate(monthStart);\n                const daysInMonth = new Date(d0.getFullYear(), d0.getMonth()+1, 0).getDate();\n                for(let day=1; day<=daysInMonth; day++){ const dStr = `${d0.getFullYear()}-${pad2(d0.getMonth()+1)}-${pad2(day)}`; if(dStr > todayStrNow) break; labels.push(String(day)); dataPoints.push(sumForDate(dStr)); }\n            } else if(tf === 'custom') {\n                let startStr = document.getElementById('analyzerStartDate').value || getMonthStartStr(todayStrNow);\n                let endStr = document.getElementById('analyzerEndDate').value || todayStrNow;\n                if(startStr > endStr) { const tmp = startStr; startStr = endStr; endStr = tmp; }\n                let cur = startStr; let guard = 0;\n                while(cur <= endStr && guard < 370) { labels.push(parseLocalDate(cur).toLocaleDateString('ar-SA',{month:'short',day:'numeric'})); dataPoints.push(sumForDate(cur)); cur = addDaysStr(cur,1); guard++; }\n            } else if(tf==='14days') {\n                for(let i=13; i>=0; i--) { const dStr=addDaysStr(todayStrNow,-i); labels.push(parseLocalDate(dStr).toLocaleDateString('ar-SA',{month:'short',day:'numeric'})); dataPoints.push(sumForDate(dStr)); }\n            } else { // 6months\n                const d0 = parseLocalDate(todayStrNow);\n                for(let i=5; i>=0; i--) { const d=new Date(d0.getFullYear(),d0.getMonth()-i,1); const mk=d.getFullYear()+'-'+pad2(d.getMonth()+1); labels.push(d.toLocaleDateString('ar-SA',{month:'short'})); let m=0; logs.forEach(l=>{if(l.date.startsWith(mk))m+=(Number(l.time_mins)||Number(l.time_spent_mins)||0);}); dataPoints.push(Math.round(m/60)); }\n            }\n            \n            const accentColor = getComputedStyle(document.body).getPropertyValue('--accent-primary') || '#3b82f6';\n            const grad = ctx.createLinearGradient(0,0,0,300); grad.addColorStop(0, accentColor); grad.addColorStop(1,'transparent');\n            advancedChartInstance = safeChart(ctx, { type:'line', data:{labels:labels, datasets:[{data:dataPoints, borderColor:accentColor, backgroundColor:grad, fill:true, tension:0.4, pointRadius:3}]}, options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{grid:{display:false}, ticks:{color:getComputedStyle(document.body).getPropertyValue('--text-muted')}},y:{grid:{color:'rgba(150,150,150,0.1)'}, ticks:{color:getComputedStyle(document.body).getPropertyValue('--text-muted')}}}} });\n        }\n\n        let compReportChartInstance = null;\n        function updateComprehensiveReport() {\n            const timeframe = document.getElementById('reportTimeframe').value; const style = document.getElementById('reportStyle').value;\n            const ctx = document.getElementById('comprehensiveReportChart'); if(!ctx) return; const ctx2d = ctx.getContext('2d');\n            const emptyState = document.getElementById('emptyReportState'); if (compReportChartInstance) compReportChartInstance.destroy();\n\n            const todayStrNow = getTodayStr();\n            let startDateStr;\n            if(timeframe === 'daily') startDateStr = todayStrNow;\n            else if(timeframe === 'weekly') startDateStr = getWeekStartStr(todayStrNow);\n            else if(timeframe === 'monthly') startDateStr = getMonthStartStr(todayStrNow);\n            else startDateStr = getYearStartStr(todayStrNow); // yearly\n\n            // المطلب 1: كل مجال مخصّص يحجز شريحته في التقرير تماماً كالمجالات الأصلية\n            const categoriesData = { 'قراءة': 0, 'تصوير': 0, 'أعمال': 0, 'ذكاء اصطناعي': 0 };\n            domainDefs.forEach(d => { categoriesData[d.name] = 0; });\n            let hasData = false;\n            globalReadingLogs.forEach(l => { if(l.date >= startDateStr) { categoriesData['قراءة'] += Number(l.time_spent_mins); hasData = true; } });\n            globalActivityLogs.forEach(l => { if(l.date >= startDateStr) { let catName = l.category; if(catName === 'Photography') catName = 'تصوير'; else if(catName === 'Business') catName = 'أعمال'; else if(catName === 'AI') catName = 'ذكاء اصطناعي'; else catName = domainLabel(catName); categoriesData[catName] = (categoriesData[catName]||0) + Number(l.time_mins); hasData = true; } });\n\n            if(!hasData) { emptyState.classList.remove('hidden'); updateCategoryTrendChart(startDateStr, timeframe); return; } else { emptyState.classList.add('hidden'); }\n            \n            const BASE_REPORT_CATS = ['قراءة', 'تصوير', 'أعمال', 'ذكاء اصطناعي'];\n            const REPORT_BASE_COLORS = { 'قراءة': '#10b981', 'تصوير': '#f59e0b', 'أعمال': '#6366f1', 'ذكاء اصطناعي': '#8b5cf6' };\n            const finalLabels = []; const finalData = []; const finalColors = [];\n            for (let k in categoriesData) {\n                if (categoriesData[k] > 0 || BASE_REPORT_CATS.includes(k)) {\n                    finalLabels.push(k); finalData.push(categoriesData[k]);\n                    const dm = domainDefs.find(x => x.name === k);\n                    finalColors.push(REPORT_BASE_COLORS[k] || (dm ? dm.color : '#ec4899'));\n                }\n            }\n\n            const accent = getComputedStyle(document.body).getPropertyValue('--accent-primary') || '#3b82f6';\n            const textColor = getComputedStyle(document.body).getPropertyValue('--text-muted') || '#94a3b8';\n            let chartConfig = { type: style, data: { labels: finalLabels, datasets: [{ label: 'دقائق التركيز', data: finalData, backgroundColor: finalColors.map(c => c + '99'), borderColor: finalColors.slice(), borderWidth: 1 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: style === 'bar' ? 'top' : 'right', labels: {color: textColor, font: {family: 'Cairo'}} } } } };\n\n            if(style === 'radar') { chartConfig.options.scales = { r: { angleLines: { color: chartGrid() }, grid: { color: chartGrid() }, pointLabels: { color: textColor, font: {family: 'Cairo', weight: 'bold'} }, ticks: { display: false } } }; chartConfig.data.datasets[0].backgroundColor = accent+'33'; chartConfig.data.datasets[0].borderColor = accent; chartConfig.data.datasets[0].pointBackgroundColor = accent; } \n            else if (style === 'bar') { chartConfig.options.scales = { x: { grid: {display: false}, ticks: {color: textColor, font:{family:'Cairo'}} }, y: { grid: {color: chartGrid()}, ticks: {color: textColor, font:{family:'Cairo'}} } }; }\n\n            compReportChartInstance = safeChart(ctx2d, chartConfig);\n            updateCategoryTrendChart(startDateStr, timeframe);\n        }\n\n        // المطلب 9: مخطط احترافي جديد يصف تحركات المستخدم عبر كل الأقسام بدقة عبر الزمن\n        let categoryTrendChartInstance = null;\n        function updateCategoryTrendChart(startDateStr, timeframe) {\n            const ctxEl = document.getElementById('categoryTrendChart'); if(!ctxEl) return;\n            const ctx2d = ctxEl.getContext('2d'); if(categoryTrendChartInstance) categoryTrendChartInstance.destroy();\n            const todayStrNow = getTodayStr();\n            const catKeys = ['قراءة','تصوير','أعمال','ذكاء اصطناعي'].concat(domainDefs.map(d=>d.name), ['أنشطة حرة']);\n            const colors = { 'قراءة':'#10b981', 'تصوير':'#f59e0b', 'أعمال':'#6366f1', 'ذكاء اصطناعي':'#8b5cf6', 'أنشطة حرة':'#ec4899' };\n            domainDefs.forEach(d => { colors[d.name] = d.color; });\n\n            // المطلب 1: مجال المستخدم يُرسم بسلسلته ولونه، وما لا مجال له يبقى «أنشطة حرة»\n            function catNameOf(l) {\n                if(l.category==='Photography') return 'تصوير';\n                if(l.category==='Business') return 'أعمال';\n                if(l.category==='AI') return 'ذكاء اصطناعي';\n                const dm = domainByCat(l.category);\n                return dm ? dm.name : 'أنشطة حرة';\n            }\n\n            let labels = []; let seriesByKey = {};\n\n            if(timeframe === 'yearly') {\n                const year = parseLocalDate(todayStrNow).getFullYear();\n                for(let m=0; m<12; m++){ const mk = `${year}-${pad2(m+1)}`; labels.push(parseLocalDate(`${mk}-01`).toLocaleDateString('ar-SA',{month:'short'})); seriesByKey[mk] = {}; }\n                globalReadingLogs.forEach(l=>{ const mk = l.date.slice(0,7); if(seriesByKey[mk]) seriesByKey[mk]['قراءة'] = (seriesByKey[mk]['قراءة']||0) + Number(l.time_spent_mins); });\n                globalActivityLogs.forEach(l=>{ const mk = l.date.slice(0,7); if(seriesByKey[mk]) { const c = catNameOf(l); seriesByKey[mk][c] = (seriesByKey[mk][c]||0) + Number(l.time_mins); } });\n            } else {\n                let cur = startDateStr; let guard = 0;\n                while(cur <= todayStrNow && guard < 62) { labels.push(parseLocalDate(cur).toLocaleDateString('ar-SA',{month:'short',day:'numeric'})); seriesByKey[cur] = {}; cur = addDaysStr(cur,1); guard++; }\n                globalReadingLogs.forEach(l=>{ if(seriesByKey[l.date]) seriesByKey[l.date]['قراءة'] = (seriesByKey[l.date]['قراءة']||0) + Number(l.time_spent_mins); });\n                globalActivityLogs.forEach(l=>{ if(seriesByKey[l.date]) { const c = catNameOf(l); seriesByKey[l.date][c] = (seriesByKey[l.date][c]||0) + Number(l.time_mins); } });\n            }\n\n            const dateKeys = Object.keys(seriesByKey);\n            // المطلب 1: نحتفظ بالبيانات كدقائق خام (وليست كسوراً عشرية للساعة) حتى يتسنى\n            // عرضها لاحقاً بصيغة الساعة الدقيقة (HH:MM) تماماً كساعة الجوال العادية.\n            const datasets = catKeys.map(c => ({\n                label: c,\n                data: dateKeys.map(k => Math.round(((seriesByKey[k][c])||0))),\n                backgroundColor: colors[c],\n                borderRadius: 4,\n                stack: 'stack1'\n            }));\n\n            // تحويل عدد الدقائق إلى صيغة ساعة:دقيقة دقيقة (مثل ساعة الجوال 02:30)\n            function minsToClock(totalMins) {\n                totalMins = Math.max(0, Math.round(Number(totalMins) || 0));\n                const h = Math.floor(totalMins / 60); const m = totalMins % 60;\n                return `${pad2(h)}:${pad2(m)}`;\n            }\n\n            const textColor = getComputedStyle(document.body).getPropertyValue('--text-muted') || '#94a3b8';\n            categoryTrendChartInstance = safeChart(ctx2d, {\n                type: 'bar',\n                data: { labels: dateKeys.length ? labels : ['لا توجد بيانات'], datasets: dateKeys.length ? datasets : [] },\n                options: {\n                    responsive: true, maintainAspectRatio: false,\n                    plugins: {\n                        legend: { position:'bottom', labels: { color: textColor, font: {family:'Cairo'} } },\n                        tooltip: {\n                            callbacks: {\n                                label: function(context) { return `${context.dataset.label}: ${minsToClock(context.parsed.y)}`; },\n                                footer: function(items) { const total = items.reduce((s,i)=>s+(i.parsed.y||0),0); return `الإجمالي: ${minsToClock(total)}`; }\n                            }\n                        }\n                    },\n                    scales: {\n                        x: { stacked: true, grid: {display:false}, ticks: {color:textColor, font:{family:'Cairo'}} },\n                        y: { stacked: true, grid: {color: chartGrid()}, ticks: {color:textColor, font:{family:'Cairo'}, callback: v => minsToClock(v)} }\n                    }\n                }\n            });\n        }\n\n        // Form Handlers\n        document.getElementById('addBookForm').addEventListener('submit', e=>{ e.preventDefault(); globalBooks.push({id:'b_'+Date.now(), title:document.getElementById('bookTitle').value, total_pages:Number(document.getElementById('bookPages').value), start_date:document.getElementById('bookStartDate').value}); saveLocalData(); recalculateSystem(); showToast('تمت الإضافة!'); e.target.reset(); document.getElementById('bookStartDate').value=todayStr; closeAddBookModal(); });\n        // المطلب 2: التحقق من حالة اكتمال الكتاب قبل التسجيل، ومنع إدراج صفحات تتجاوز\n        // العدد المستهدف/الإجمالي للكتاب، مع إظهار نافذة تهنئة عند اكتمال آخر صفحة فيه.\n        document.getElementById('logReadingForm').addEventListener('submit', e=>{\n            e.preventDefault();\n            const b = document.getElementById('logBookSelect').value;\n            if(!b) return showToast('اختر كتاباً أولاً');\n            const book = globalBooks.find(x=>x.id===b);\n            if(!book) return showToast('تعذر العثور على الكتاب');\n\n            const alreadyRead = globalReadingLogs.filter(l=>l.book_id===b).reduce((s,l)=>s+Number(l.pages_read),0);\n            if (alreadyRead >= book.total_pages) {\n                showToast('🎉 هذا الكتاب مكتمل بالفعل!');\n                closeLogReadingModal();\n                return;\n            }\n\n            const requestedPages = Number(document.getElementById('logReadingPages').value);\n            const remaining = book.total_pages - alreadyRead;\n            const pagesToLog = Math.min(requestedPages, remaining); // لا تتجاوز الصفحات المتبقية أبداً\n\n            globalReadingLogs.push({\n                id: 'r_' + Date.now(),\n                book_id: b,\n                date: document.getElementById('logReadingDate').value,\n                pages_read: pagesToLog,\n                time_spent_mins: Number(document.getElementById('logReadingTime').value)\n            });\n            saveLocalData(); recalculateSystem();\n\n            const willComplete = (alreadyRead + pagesToLog) >= book.total_pages;\n            e.target.reset(); document.getElementById('logReadingDate').value = todayStr;\n            closeLogReadingModal();\n\n            if (willComplete) {\n                showBookCompletionModal(book);\n            } else if (requestedPages > remaining) {\n                showToast(`تم تسجيل ${pagesToLog} صفحة فقط (آخر ما تبقى من الكتاب)`);\n            } else {\n                showToast('تم التسجيل بنجاح!');\n            }\n        });\n        \n        function setupForm(id, cat, dId, tmId, tsId, ntId) { document.getElementById(id).addEventListener('submit', e=>{ e.preventDefault(); globalActivityLogs.push({id:'a_'+Date.now(), category:cat, date:document.getElementById(dId).value, time_mins:Number(document.getElementById(tmId).value), tasks_completed:Number(document.getElementById(tsId).value), notes:document.getElementById(ntId).value}); saveLocalData(); recalculateSystem(); showToast('تم الحفظ!'); e.target.reset(); document.getElementById(dId).value=todayStr; }); }\n        setupForm('photoLogForm', 'Photography', 'photoLogDate', 'photoLogTime', 'photoLogTasks', 'photoLogNotes');\n        setupForm('businessLogForm', 'Business', 'businessLogDate', 'businessLogTime', 'businessLogTasks', 'businessLogNotes');\n        setupForm('aiLogForm', 'AI', 'aiLogDate', 'aiLogTime', 'aiLogTasks', 'aiLogNotes');\n\n        // المطلب 7: الحقول الأساسية فقط (الاسم + المدة/الصفحات) إجبارية، وبقية الحقول اختيارية\n        const ESSENTIAL_QUICKLOG_FIELDS = { custom: ['q_customName','q_customTime'], book: ['q_bookTitle','q_bookPages'], task: ['q_taskName','q_taskTime'], design: ['q_designName','q_designTime'], sport: ['q_sportType','q_sportTime'] };\n        function toggleDynamicActivityFields() {\n            const type = document.getElementById('quickActivityType').value;\n            document.querySelectorAll('.dynamic-group').forEach(el => { el.classList.add('hidden'); el.querySelectorAll('input, select').forEach(input => input.removeAttribute('required')); });\n            // المطلب 1: كل مجالات المستخدم تتشارك مجموعة حقول واحدة تتكيّف مع نوع المجال\n            const isDom = String(type).startsWith('dom:');\n            const activeGroup = document.getElementById(`fields-${isDom ? 'domain' : type}`);\n            if (activeGroup) {\n                activeGroup.classList.remove('hidden');\n                if (isDom) syncQuickDomainFields();\n                else (ESSENTIAL_QUICKLOG_FIELDS[type] || []).forEach(id => { const el = document.getElementById(id); if (el) el.setAttribute('required', 'true'); });\n            }\n        }\n        \n        document.getElementById('quickLogForm').addEventListener('submit', e => {\n            e.preventDefault(); const type = document.getElementById('quickActivityType').value; const dateVal = document.getElementById('quickDate').value;\n            // المطلب 1: التسجيل في مجال مخصّص يمرّ بنفس المستودع، فيظهر فوراً في كل التقارير\n            if (String(type).startsWith('dom:')) {\n                const d = domainById(String(type).slice(4));\n                if (!d) { showToast('هذا المجال لم يعد موجوداً'); return; }\n                const kd = domainKind(d.kind);\n                const mins = Math.max(0, Number(document.getElementById('q_domainTime').value) || 0);\n                let count = Math.max(0, Number(document.getElementById('q_domainCount').value) || 0);\n                if (!count && !kd.timeRequired) count = 1;\n                if (mins <= 0 && count <= 0) { showToast('أدخل مدة أو عدداً واحداً على الأقل'); return; }\n                globalActivityLogs.push({ id: 'a_' + Date.now(), category: d.cat, date: dateVal, time_mins: mins, tasks_completed: count, notes: (document.getElementById('q_domainNote').value || '').trim() });\n                showToast(d.emoji + ' تم التسجيل في ' + d.name);\n                saveLocalData(); recalculateSystem(); closeQuickLog(); e.target.reset();\n                document.getElementById('quickDate').value = todayStr;\n                document.getElementById('quickActivityType').value = 'custom'; toggleDynamicActivityFields();\n                return;\n            }\n            if (type === 'book') { globalBooks.push({ id: 'b_' + Date.now(), title: document.getElementById('q_bookTitle').value.trim(), total_pages: Number(document.getElementById('q_bookPages').value), start_date: dateVal }); showToast('تم إضافة الكتاب!'); } \n            else {\n                let catName = '', mins = 0, tasks = 1, noteText = '';\n                if (type === 'custom') { catName = document.getElementById('q_customName').value.trim(); mins = Number(document.getElementById('q_customTime').value); noteText = 'نشاط حر'; } \n                else if (type === 'task') { catName = 'Business'; mins = Number(document.getElementById('q_taskTime').value); noteText = `مهمة: ${document.getElementById('q_taskName').value} | الأولوية: ${document.getElementById('q_taskPriority').value}`; } \n                else if (type === 'design') { catName = 'تصميم'; mins = Number(document.getElementById('q_designTime').value); tasks = Number(document.getElementById('q_designElements').value); noteText = `مشروع/تصميم: ${document.getElementById('q_designName').value}`; } \n                else if (type === 'sport') { catName = 'رياضة'; mins = Number(document.getElementById('q_sportTime').value); noteText = `تمرين: ${document.getElementById('q_sportType').value}`; }\n                globalActivityLogs.push({ id: 'a_' + Date.now(), category: catName, date: dateVal, time_mins: mins, tasks_completed: tasks, notes: noteText });\n                showToast(`تم توثيق إنجازك بنجاح!`);\n            }\n            saveLocalData(); recalculateSystem(); closeQuickLog(); e.target.reset(); document.getElementById('quickDate').value = todayStr; document.getElementById('quickActivityType').value = 'custom'; toggleDynamicActivityFields();\n        });\n\n        function executeWipe() { localStorage.clear(); showToast('تم التدمير. جاري إعادة التحميل...'); setTimeout(()=>window.location.reload(), 1000); }\n        function exportData(){ const dl=document.createElement('a'); dl.setAttribute(\"href\",\"data:text/json;charset=utf-8,\"+encodeURIComponent(JSON.stringify({books:globalBooks,reading_logs:globalReadingLogs,activity_logs:globalActivityLogs,forgiven:missed_days_forgiven,domains:domainDefs}))); dl.setAttribute(\"download\",`مستقبلي_${todayStr}.json`); dl.click(); showToast(\"تم الحفظ!\"); }\n        function triggerImport(){ document.getElementById('importFileInput').click(); }\n        function importData(e){ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=function(evt){ const b=JSON.parse(evt.target.result); if(b.books){ localStorage.setItem('prod_books',JSON.stringify(b.books)); localStorage.setItem('prod_reading_logs',JSON.stringify(b.reading_logs)); localStorage.setItem('prod_activity_logs',JSON.stringify(b.activity_logs)); if(b.forgiven) localStorage.setItem('prod_forgiven',JSON.stringify(b.forgiven)); if(b.domains) localStorage.setItem('prod_domains',JSON.stringify(b.domains)); showToast(\"تم الاستيراد! جاري التحديث...\"); setTimeout(()=>window.location.reload(),1000); }}; r.readAsText(f); }\n\n        /* ================== المطلب 1: محتسب المدة الذكي ==================\n           الفكرة: كل حقل في النظام يُدخَل فيه زمن المهمة (بالدقائق/الساعات) يحصل على زر\n           صغير مدمج داخله. عند الضغط عليه تُفتح نافذة تسأل: متى بدأت المهمة ومتى انتهت؟\n           ثم يحسب النظام الفرق بدقة الدقيقة الواحدة — مع معالجة صحيحة لما بعد منتصف الليل\n           وخصم فترات الاستراحة — ويدرج الناتج في الحقل المعني فوراً.\n\n           ملاحظة تقنية: نُركِّب الزر بشكل مطلق داخل الحقل نفسه (وليس كعنصر مجاور) حتى لا\n           نكسر أي شبكة تخطيط قائمة (grid/flex) ولا نقلّص عرض أي حقل. */\n\n        const TRP_TARGETS = [\n            { id: 'photoLogTime',    color: '#f59e0b', label: 'مشروع التصوير — زمن الجلسة بالدقائق' },\n            { id: 'businessLogTime', color: '#6366f1', label: 'إدارة الأعمال — زمن الجلسة بالدقائق' },\n            { id: 'aiLogTime',       color: '#8b5cf6', label: 'تقنيات الذكاء — زمن الجلسة بالدقائق' },\n            { id: 'logReadingTime',  color: '#10b981', label: 'ورد القراءة — زمن الجلسة بالدقائق' },\n            { id: 'q_customTime',    color: '#ec4899', label: 'نشاط حر — مدة النشاط بالدقائق' },\n            { id: 'q_domainTime',    color: '#38bdf8', label: 'مجالاتك الخاصة — مدة النشاط بالدقائق' },\n            { id: 'q_taskTime',      color: '#6366f1', label: 'مهمة عمل / إدارة — الدقائق المستغرقة' },\n            { id: 'q_designTime',    color: '#3b82f6', label: 'تصميم / مونتاج — الدقائق المستغرقة' },\n            { id: 'q_sportTime',     color: '#f97316', label: 'رياضة / صحة بدنية — مدة التمرين' },\n            { id: 'ed_mins',         color: '#3b82f6', label: 'تعديل السجل — الدقائق المستغرقة' }\n        ];\n\n        let trpState = { targetId: null, color: '#38bdf8', mins: 0, valid: false };\n\n        function mountDurationPicker(id, color, label) {\n            const input = document.getElementById(id);\n            if (!input || input.dataset.trpMounted === '1') return;\n            input.dataset.trpMounted = '1';\n            input.dataset.trpColor = color;\n            input.dataset.trpLabel = label || '';\n            input.classList.add('trp-input');\n\n            const host = document.createElement('span');\n            host.className = 'trp-host';\n            // نقل هوامش الحقل السفلية إلى الغلاف حتى يبقى التباعد الرأسي كما هو تماماً\n            ['mb-1', 'mb-2', 'mb-3', 'mb-4'].forEach(c => {\n                if (input.classList.contains(c)) { input.classList.remove(c); host.classList.add(c); }\n            });\n            input.parentNode.insertBefore(host, input);\n            host.appendChild(input);\n\n            const btn = document.createElement('button');\n            btn.type = 'button';\n            btn.className = 'trp-btn';\n            btn.title = 'احسب المدة تلقائياً: متى بدأت المهمة ومتى انتهت؟';\n            btn.setAttribute('aria-label', 'محتسب المدة الذكي');\n            btn.style.color = ink(color);\n            btn.style.backgroundColor = color + '24';\n            btn.style.borderColor = color + '59';\n            btn.innerHTML = '<i data-lucide=\"hourglass\" class=\"w-4 h-4 pointer-events-none\"><\u002Fi>';\n            btn.addEventListener('click', function (ev) { ev.preventDefault(); ev.stopPropagation(); openTimeRangePicker(id); });\n            host.appendChild(btn);\n        }\n\n        function mountAllDurationPickers() {\n            TRP_TARGETS.forEach(t => mountDurationPicker(t.id, t.color, t.label));\n            safeCreateIcons();\n        }\n\n        function trpClockStr(date) { return pad2(date.getHours()) + ':' + pad2(date.getMinutes()); }\n\n        // تحويل \"HH:MM\" أو \"HH:MM:SS\" إلى دقائق من بداية اليوم (بدقة كسرية للثواني)\n        function trpParseTime(v) {\n            if (!v) return null;\n            const p = String(v).split(':');\n            if (p.length < 2) return null;\n            const h = Number(p[0]), m = Number(p[1]), s = Number(p[2] || 0);\n            if (!isFinite(h) || !isFinite(m) || !isFinite(s)) return null;\n            if (h < 0 || h > 23 || m < 0 || m > 59) return null;\n            return h * 60 + m + s / 60;\n        }\n\n        function openTimeRangePicker(targetId) {\n            const input = document.getElementById(targetId);\n            const modal = document.getElementById('timeRangeModal');\n            if (!input || !modal) return;\n\n            trpState.targetId = targetId;\n            trpState.color = input.dataset.trpColor || '#38bdf8';\n\n            const box = document.getElementById('timeRangeBox');\n            box.style.borderColor = trpState.color + '59';\n            const head = document.getElementById('trpHeadIcon');\n            head.style.color = ink(trpState.color);\n            head.style.backgroundColor = trpState.color + '1f';\n            head.style.borderColor = trpState.color + '4d';\n            document.querySelectorAll('#timeRangeBox .trp-accent').forEach(el => { el.style.color = ink(trpState.color); });\n            const applyBtn = document.getElementById('trpApplyBtn');\n            applyBtn.style.backgroundColor = trpState.color;\n            applyBtn.style.boxShadow = '0 10px 26px -12px ' + trpState.color;\n\n            document.getElementById('trpTargetLabel').innerText = input.dataset.trpLabel || 'إدراج المدة المحسوبة في الحقل';\n\n            // الافتراض العملي: النهاية = الآن (اللحظة التي انتهيت فيها)، والبداية يحددها المستخدم\n            document.getElementById('trpStart').value = '';\n            document.getElementById('trpEnd').value = trpClockStr(new Date());\n            document.getElementById('trpBreak').value = '';\n\n            const cur = Math.max(0, Math.round(Number(input.value) || 0));\n            const addBtn = document.getElementById('trpAddBtn');\n            if (cur > 0) {\n                addBtn.classList.remove('hidden');\n                document.getElementById('trpAddLabel').innerText = `إضافة إلى ${cur} د`;\n            } else {\n                addBtn.classList.add('hidden');\n            }\n\n            trpCompute();\n            modal.classList.remove('hidden');\n            setTimeout(() => {\n                modal.classList.remove('opacity-0');\n                box.classList.remove('scale-95');\n                const s = document.getElementById('trpStart');\n                try { s.focus({ preventScroll: true }); } catch (e) { s.focus(); }\n            }, 10);\n            safeCreateIcons();\n        }\n\n        function closeTimeRangePicker() {\n            const modal = document.getElementById('timeRangeModal');\n            if (!modal) return;\n            modal.classList.add('opacity-0');\n            document.getElementById('timeRangeBox').classList.add('scale-95');\n            setTimeout(() => modal.classList.add('hidden'), 300);\n        }\n\n        function trpNow(which) {\n            const el = document.getElementById(which === 'start' ? 'trpStart' : 'trpEnd');\n            el.value = trpClockStr(new Date());\n            trpCompute();\n        }\n\n        // اختصار: \"انتهت الآن ومدتها X\" — يضبط النهاية على اللحظة الحالية والبداية قبلها بـ X\n        function trpQuick(mins) {\n            const endEl = document.getElementById('trpEnd');\n            let eV = trpParseTime(endEl.value);\n            if (eV === null) { const n = new Date(); endEl.value = trpClockStr(n); eV = n.getHours() * 60 + n.getMinutes(); }\n            const sV = ((Math.round(eV) - mins) % 1440 + 1440) % 1440;\n            document.getElementById('trpStart').value = pad2(Math.floor(sV / 60)) + ':' + pad2(sV % 60);\n            document.getElementById('trpBreak').value = '';\n            trpCompute();\n        }\n\n        function trpCompute() {\n            const sV = trpParseTime(document.getElementById('trpStart').value);\n            const eV = trpParseTime(document.getElementById('trpEnd').value);\n            const brk = Math.max(0, Math.round(Number(document.getElementById('trpBreak').value) || 0));\n            const overnight = document.getElementById('trpOvernight');\n            const resultBox = document.getElementById('trpResult');\n            const valueEl = document.getElementById('trpResultValue');\n            const subEl = document.getElementById('trpResultSub');\n            const hintEl = document.getElementById('trpHint');\n            const applyBtn = document.getElementById('trpApplyBtn');\n            const addBtn = document.getElementById('trpAddBtn');\n\n            overnight.classList.add('hidden');\n            let mins = 0, valid = false, hint = '';\n\n            if (sV === null && eV === null) {\n                hint = 'حدّد وقت البداية ووقت النهاية لتُحسب المدة تلقائياً بدقة الدقيقة الواحدة.';\n            } else if (sV === null) {\n                hint = 'ينقص وقت البداية — متى بدأت هذه المهمة فعلياً؟';\n            } else if (eV === null) {\n                hint = 'ينقص وقت النهاية — اضغط «الآن» إن كنت قد انتهيت للتو.';\n            } else {\n                let raw = eV - sV;\n                if (raw < 0) { raw += 1440; overnight.classList.remove('hidden'); }\n                raw = Math.round(raw);\n                if (raw === 0) {\n                    hint = 'وقت البداية والنهاية متطابقان — لا توجد مدة لحسابها.';\n                } else if (brk >= raw) {\n                    hint = 'مدة الاستراحة تساوي زمن المهمة أو تتجاوزه. راجع الأرقام.';\n                } else {\n                    mins = raw - brk;\n                    valid = mins > 0;\n                    if (brk > 0) hint = `الزمن الخام ${fmtDuration(raw)} · بعد خصم ${brk} دقيقة استراحة يصبح الصافي ${fmtDuration(mins)}.`;\n                    else if (raw >= 720) hint = 'مدة طويلة جداً (١٢ ساعة فأكثر) — تأكد من صحة الوقتين قبل الإدراج.';\n                    else hint = 'الحساب دقيق حتى الدقيقة الواحدة، ويشمل ما بعد منتصف الليل تلقائياً.';\n                }\n            }\n\n            trpState.mins = mins;\n            trpState.valid = valid;\n\n            valueEl.innerText = valid ? fmtDuration(mins) : '—';\n            subEl.innerText = valid ? `= ${mins} دقيقة · تُدرج في الحقل كرقم` : 'بانتظار تحديد الوقتين';\n            hintEl.innerText = hint;\n            resultBox.style.borderColor = valid ? trpState.color + '4d' : 'rgba(148,163,184,.25)';\n            resultBox.style.background = valid ? trpState.color + '14' : 'rgba(148,163,184,.06)';\n\n            [applyBtn, addBtn].forEach(b => {\n                if (!b) return;\n                b.disabled = !valid;\n                b.classList.toggle('opacity-40', !valid);\n                b.classList.toggle('pointer-events-none', !valid);\n            });\n        }\n\n        function trpApply(mode) {\n            if (!trpState.valid) return;\n            const input = document.getElementById(trpState.targetId);\n            if (!input) return;\n            const cur = Math.max(0, Math.round(Number(input.value) || 0));\n            const val = (mode === 'add') ? cur + trpState.mins : trpState.mins;\n\n            input.value = String(val);\n            // إطلاق الأحداث القياسية حتى يلتقط أي مستمع (تحقق/حساب فوري) القيمة الجديدة\n            input.dispatchEvent(new Event('input', { bubbles: true }));\n            input.dispatchEvent(new Event('change', { bubbles: true }));\n\n            closeTimeRangePicker();\n            setTimeout(() => {\n                input.classList.add('trp-flash');\n                setTimeout(() => input.classList.remove('trp-flash'), 1300);\n                try { input.focus({ preventScroll: true }); } catch (e) { /* تجاهل */ }\n            }, 200);\n            showToast(`تم إدراج ${fmtDuration(val)} (${val} دقيقة) ✅`);\n        }\n\n        // إغلاق بالخلفية + اختصارات لوحة المفاتيح (Esc للإغلاق، Enter للإدراج)\n        function initTimeRangePicker() {\n            const modal = document.getElementById('timeRangeModal');\n            if (!modal) return;\n            modal.addEventListener('click', e => { if (e.target === modal) closeTimeRangePicker(); });\n            document.addEventListener('keydown', e => {\n                if (modal.classList.contains('hidden')) return;\n                if (e.key === 'Escape') { e.preventDefault(); closeTimeRangePicker(); }\n                else if (e.key === 'Enter') { e.preventDefault(); trpApply('set'); }\n            });\n        }\n\n        // ================== المؤقت الاحترافي (مؤقت تنازلي + ساعة إيقاف) ==================\n        // يعتمد الحساب بالكامل على الفارق الزمني الحقيقي (Date.now()) وليس على دقة setInterval،\n        // لذلك يبقى العدّ دقيقاً حتى لو تجمّدت الصفحة في الخلفية أو أُقفلت الشاشة لفترة، وعند\n        // العودة للصفحة يُعاد احتساب الوقت المنقضي فوراً من الفارق الزمني الحقيقي المخزّن محلياً.\n        const TIMER_STORAGE_KEY = 'prod_timer_state';\n        let timerState = { mode: 'countdown', active: false, startTs: null, accumulatedMs: 0, durationMs: 0, finished: false, resultMinutes: 0 };\n        let timerIntervalRef = null;\n        let timerPanelMinimized = true;\n\n        function saveTimerState() { localStorage.setItem(TIMER_STORAGE_KEY, JSON.stringify(timerState)); }\n        function loadTimerState() { try { const s = JSON.parse(localStorage.getItem(TIMER_STORAGE_KEY)); if (s) timerState = s; } catch(e) {} }\n\n        function pad2Timer(n) { return String(n).padStart(2, '0'); }\n        function formatClock(ms) {\n            let totalSec = Math.max(0, Math.round(ms / 1000));\n            const h = Math.floor(totalSec / 3600); const m = Math.floor((totalSec % 3600) / 60); const s = totalSec % 60;\n            return h > 0 ? `${h}:${pad2Timer(m)}:${pad2Timer(s)}` : `${pad2Timer(m)}:${pad2Timer(s)}`;\n        }\n        function currentElapsedMs() {\n            if (!timerState.active || !timerState.startTs) return timerState.accumulatedMs;\n            return (Date.now() - timerState.startTs) + timerState.accumulatedMs;\n        }\n\n        function toggleTimerPanel() {\n            const p = document.getElementById('timerPanel');\n            if (p.classList.contains('hidden') || timerPanelMinimized) openTimerPanel(); else minimizeTimerPanel();\n        }\n        function openTimerPanel() {\n            timerPanelMinimized = false;\n            const p = document.getElementById('timerPanel');\n            p.classList.remove('hidden');\n            setTimeout(() => { p.classList.remove('opacity-0', '-translate-y-3'); }, 10);\n            refreshTimerUI();\n        }\n        function minimizeTimerPanel() {\n            timerPanelMinimized = true;\n            const p = document.getElementById('timerPanel');\n            p.classList.add('opacity-0', '-translate-y-3');\n            setTimeout(() => p.classList.add('hidden'), 300);\n        }\n\n        function switchTimerMode(mode) {\n            if (timerState.active) { showToast('أوقف المؤقت الحالي أولاً قبل التبديل'); return; }\n            timerState.mode = mode; saveTimerState();\n            document.getElementById('timerTabBtn-countdown').classList.toggle('timer-tab-active', mode === 'countdown');\n            document.getElementById('timerTabBtn-stopwatch').classList.toggle('timer-tab-active', mode === 'stopwatch');\n            document.getElementById('timerCountdownControls').classList.toggle('hidden', mode !== 'countdown');\n            document.getElementById('timerStopwatchControls').classList.toggle('hidden', mode !== 'stopwatch');\n            document.getElementById('timerCopyRow').classList.add('hidden');\n            document.getElementById('timerDisplay').innerText = '00:00';\n            document.getElementById('timerModeLabel').innerText = mode === 'countdown' ? 'حدد المدة وابدأ' : 'اضغط ابدأ العد لتشغيل ساعة الإيقاف';\n        }\n\n        function setTimerPreset(mins, ev) {\n            document.getElementById('timerCustomMinutes').value = mins;\n            document.querySelectorAll('.timer-preset-btn').forEach(b => b.classList.remove('timer-preset-active'));\n            if (ev && ev.currentTarget) ev.currentTarget.classList.add('timer-preset-active');\n        }\n        function applyCustomTimerMinutes() {\n            const v = Number(document.getElementById('timerCustomMinutes').value);\n            if (!v || v <= 0) { showToast('أدخل عدد دقائق صحيح'); return; }\n            showToast(`تم تحديد ${v} دقيقة`);\n        }\n\n        function startCountdown() {\n            const mins = Number(document.getElementById('timerCustomMinutes').value);\n            if (!mins || mins <= 0) { showToast('حدد مدة المؤقت أولاً (بالدقائق)'); return; }\n            timerState = { mode: 'countdown', active: true, startTs: Date.now(), accumulatedMs: 0, durationMs: mins * 60000, finished: false, resultMinutes: 0 };\n            saveTimerState();\n            document.getElementById('btnCountdownStart').classList.add('hidden');\n            document.getElementById('btnCountdownStop').classList.remove('hidden');\n            document.getElementById('timerCopyRow').classList.add('hidden');\n            document.getElementById('timerModeLabel').innerText = 'المؤقت يعمل الآن...';\n            ensureTimerTicking();\n        }\n        function stopCountdown() { finalizeTimer(false); }\n\n        function startStopwatch() {\n            timerState = { mode: 'stopwatch', active: true, startTs: Date.now(), accumulatedMs: 0, durationMs: 0, finished: false, resultMinutes: 0 };\n            saveTimerState();\n            document.getElementById('btnStopwatchStart').classList.add('hidden');\n            document.getElementById('btnStopwatchStop').classList.remove('hidden');\n            document.getElementById('timerCopyRow').classList.add('hidden');\n            document.getElementById('timerModeLabel').innerText = 'ساعة الإيقاف تعمل الآن...';\n            ensureTimerTicking();\n        }\n        function stopStopwatch() { finalizeTimer(false); }\n\n        function finalizeTimer(isAutoComplete) {\n            const elapsed = currentElapsedMs();\n            const cappedElapsed = timerState.mode === 'countdown' ? Math.min(elapsed, timerState.durationMs) : elapsed;\n            timerState.active = false;\n            timerState.finished = true;\n            timerState.accumulatedMs = cappedElapsed;\n            timerState.resultMinutes = (isAutoComplete && timerState.mode === 'countdown')\n                ? Math.max(0, Math.round(timerState.durationMs / 60000))\n                : Math.max(0, Math.floor(cappedElapsed / 60000));\n            timerState.startTs = null;\n            saveTimerState();\n\n            document.getElementById('btnCountdownStart').classList.remove('hidden');\n            document.getElementById('btnCountdownStop').classList.add('hidden');\n            document.getElementById('btnStopwatchStart').classList.remove('hidden');\n            document.getElementById('btnStopwatchStop').classList.add('hidden');\n\n            document.getElementById('timerCopyMinutes').innerText = timerState.resultMinutes;\n            document.getElementById('timerCopyRow').classList.remove('hidden');\n            document.getElementById('timerModeLabel').innerText = isAutoComplete ? '✅ اكتمل المؤقت بنجاح!' : 'تم الإيقاف، يمكنك نسخ عدد الدقائق';\n\n            refreshTimerDisplay();\n            updateHeaderBadge();\n            if (isAutoComplete && timerState.mode === 'countdown') {\n                activateTimerEdgeAlert();\n                showToast('⏰ انتهى الوقت! أحسنت.');\n            }\n        }\n\n        function resetTimerState() {\n            timerState = { mode: timerState.mode, active: false, startTs: null, accumulatedMs: 0, durationMs: 0, finished: false, resultMinutes: 0 };\n            saveTimerState();\n            document.getElementById('btnCountdownStart').classList.remove('hidden');\n            document.getElementById('btnCountdownStop').classList.add('hidden');\n            document.getElementById('btnStopwatchStart').classList.remove('hidden');\n            document.getElementById('btnStopwatchStop').classList.add('hidden');\n            document.getElementById('timerCopyRow').classList.add('hidden');\n            document.getElementById('timerDisplay').innerText = '00:00';\n            document.getElementById('timerModeLabel').innerText = timerState.mode === 'countdown' ? 'حدد المدة وابدأ' : 'اضغط ابدأ العد لتشغيل ساعة الإيقاف';\n            updateHeaderBadge();\n        }\n\n        function copyTimerMinutes() {\n            const mins = Math.max(0, Math.round(Number(timerState.resultMinutes) || 0));\n            const text = String(mins);\n            const ok = () => showToast(`تم نسخ ${text} دقيقة ✅`);\n            const legacyCopy = () => {\n                try {\n                    const ta = document.createElement('textarea');\n                    ta.value = text;\n                    ta.setAttribute('readonly', '');\n                    ta.style.cssText = 'position:fixed;top:-1000px;left:0;opacity:0;';\n                    document.body.appendChild(ta);\n                    ta.select(); ta.setSelectionRange(0, text.length);\n                    const done = document.execCommand('copy');\n                    document.body.removeChild(ta);\n                    if (done) ok(); else showToast(`الدقائق المكتملة: ${text} — انسخها يدوياً`);\n                } catch (e) { showToast(`الدقائق المكتملة: ${text} — انسخها يدوياً`); }\n            };\n            if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {\n                navigator.clipboard.writeText(text).then(ok).catch(legacyCopy);\n            } else legacyCopy();\n        }\n\n        // المطلب 5: التنبيه على حواف لوحة المؤقت (بدلاً من الشريط الوامض أسفل الشاشة)\n        let timerEdgeAlertRef = null;\n        function activateTimerEdgeAlert() {\n            const p = document.getElementById('timerPanel');\n            if (!p) return;\n            if (p.classList.contains('hidden') || timerPanelMinimized) openTimerPanel();\n            p.classList.add('timer-edge-alert');\n            if (timerEdgeAlertRef) clearTimeout(timerEdgeAlertRef);\n            timerEdgeAlertRef = setTimeout(clearTimerEdgeAlert, 12000);\n        }\n        function clearTimerEdgeAlert() {\n            const p = document.getElementById('timerPanel');\n            if (p) p.classList.remove('timer-edge-alert');\n            if (timerEdgeAlertRef) { clearTimeout(timerEdgeAlertRef); timerEdgeAlertRef = null; }\n        }\n\n        function refreshTimerDisplay() {\n            let displayMs;\n            if (timerState.mode === 'countdown') { displayMs = Math.max(0, timerState.durationMs - currentElapsedMs()); }\n            else { displayMs = currentElapsedMs(); }\n            const text = formatClock(displayMs);\n            const dispEl = document.getElementById('timerDisplay');\n            if (dispEl) dispEl.innerText = text;\n            return { text, displayMs };\n        }\n\n        function updateHeaderBadge() {\n            const badge = document.getElementById('timerHeaderBadge');\n            const badgeD = document.getElementById('timerHeaderBadgeDesktop');\n            if (!badge || !badgeD) return;\n            if (!timerState.active) { badge.classList.add('hidden'); badgeD.classList.add('hidden'); return; }\n            const { text } = refreshTimerDisplay();\n            const shortText = text.split(':').slice(-2).join(':');\n            badge.innerText = shortText; badge.classList.remove('hidden');\n            badgeD.innerText = shortText; badgeD.classList.remove('hidden');\n        }\n\n        function timerTick() {\n            if (!timerState.active) return;\n            if (timerState.mode === 'countdown' && currentElapsedMs() >= timerState.durationMs) { finalizeTimer(true); return; }\n            refreshTimerDisplay();\n            updateHeaderBadge();\n        }\n        function ensureTimerTicking() {\n            if (timerIntervalRef) clearInterval(timerIntervalRef);\n            timerTick();\n            timerIntervalRef = setInterval(timerTick, 1000);\n        }\n\n        function refreshTimerUI() {\n            document.getElementById('timerTabBtn-countdown').classList.toggle('timer-tab-active', timerState.mode === 'countdown');\n            document.getElementById('timerTabBtn-stopwatch').classList.toggle('timer-tab-active', timerState.mode === 'stopwatch');\n            document.getElementById('timerCountdownControls').classList.toggle('hidden', timerState.mode !== 'countdown');\n            document.getElementById('timerStopwatchControls').classList.toggle('hidden', timerState.mode !== 'stopwatch');\n\n            document.getElementById('btnCountdownStart').classList.toggle('hidden', timerState.active && timerState.mode === 'countdown');\n            document.getElementById('btnCountdownStop').classList.toggle('hidden', !(timerState.active && timerState.mode === 'countdown'));\n            document.getElementById('btnStopwatchStart').classList.toggle('hidden', timerState.active && timerState.mode === 'stopwatch');\n            document.getElementById('btnStopwatchStop').classList.toggle('hidden', !(timerState.active && timerState.mode === 'stopwatch'));\n\n            if (timerState.finished && !timerState.active) {\n                document.getElementById('timerCopyMinutes').innerText = timerState.resultMinutes || 0;\n                document.getElementById('timerCopyRow').classList.remove('hidden');\n                document.getElementById('timerModeLabel').innerText = 'يمكنك نسخ عدد الدقائق المكتملة';\n            } else if (!timerState.active) {\n                document.getElementById('timerCopyRow').classList.add('hidden');\n                document.getElementById('timerModeLabel').innerText = timerState.mode === 'countdown' ? 'حدد المدة وابدأ' : 'اضغط ابدأ العد لتشغيل ساعة الإيقاف';\n            }\n\n            refreshTimerDisplay();\n            updateHeaderBadge();\n            if (timerState.active) ensureTimerTicking();\n        }\n\n        // استعادة حالة المؤقت عند فتح/إعادة فتح الصفحة (حتى بعد إغلاق المتصفح أو قفل الجهاز)،\n        // بالاعتماد على الفارق الزمني الحقيقي المخزَّن، لا على أي مؤقّت داخلي كان يعمل سابقاً.\n        function initTimerSystem() {\n            loadTimerState();\n            if (timerState.active && timerState.mode === 'countdown' && currentElapsedMs() >= timerState.durationMs) {\n                finalizeTimer(true);\n                return;\n            }\n            updateHeaderBadge();\n            if (timerState.active) ensureTimerTicking();\n        }\n\n        // --- Cloud Export Module (وحدة التصدير السحابي) ---\n        let cloudConfig = { url: '', key: '', source_system: 'professional_board' };\n        let cloudDomainMap = {};\n        let cloudDirectives = '';\n        const CLOUD_DOMAIN_KEYS = ['business','graphic','photo','editing','strategy','ai','health','unclassified'];\n        const CLOUD_DOMAIN_LABELS = { business:'أعمال (business)', graphic:'تصميم جرافيك (graphic)', photo:'تصوير (photo)', editing:'مونتاج (editing)', strategy:'استراتيجية (strategy)', ai:'ذكاء اصطناعي (ai)', health:'صحة/رياضة (health)', unclassified:'غير مصنف (unclassified)' };\n        const CLOUD_DEFAULT_DOMAIN_BY_CATEGORY = { 'Business':'business', 'Photography':'photo', 'AI':'ai', 'تصميم':'graphic', 'رياضة':'health', 'مونتاج':'editing' };\n\n        function initCloudModule() {\n            cloudConfig = JSON.parse(localStorage.getItem('prod_cloud_config')) || { url: '', key: '', source_system: 'professional_board' };\n            cloudDomainMap = JSON.parse(localStorage.getItem('prod_domain_map')) || {};\n            cloudDirectives = localStorage.getItem('prod_directives') || '';\n            const urlEl = document.getElementById('cloudUrl'); if (urlEl) urlEl.value = cloudConfig.url || '';\n            const keyEl = document.getElementById('cloudKey'); if (keyEl) keyEl.value = cloudConfig.key || '';\n            const srcEl = document.getElementById('cloudSourceSystem'); if (srcEl) srcEl.value = cloudConfig.source_system || 'professional_board';\n            const dirEl = document.getElementById('cloudDirectives'); if (dirEl) dirEl.value = cloudDirectives;\n            renderDomainMapRows();\n            const lastPush = localStorage.getItem('prod_last_push');\n            const lastPushEl = document.getElementById('cloudLastPush');\n            if (lastPushEl) lastPushEl.innerText = lastPush ? ('آخر رفع: ' + new Date(lastPush).toLocaleString('ar-EG')) : 'لم يتم الرفع بعد';\n        }\n\n        function toggleCloudKeyVisibility() {\n            const el = document.getElementById('cloudKey'); const icon = document.getElementById('cloudKeyEyeIcon');\n            if (!el) return;\n            el.type = el.type === 'password' ? 'text' : 'password';\n            if (icon) { icon.setAttribute('data-lucide', el.type === 'password' ? 'eye' : 'eye-off'); safeCreateIcons(); }\n        }\n\n        function collectCloudConfigFromForm() {\n            return {\n                url: (document.getElementById('cloudUrl')?.value || '').trim(),\n                key: (document.getElementById('cloudKey')?.value || '').trim(),\n                source_system: (document.getElementById('cloudSourceSystem')?.value || '').trim() || 'professional_board'\n            };\n        }\n\n        function saveCloudConfig() {\n            cloudConfig = collectCloudConfigFromForm();\n            localStorage.setItem('prod_cloud_config', JSON.stringify(cloudConfig));\n            const su = document.getElementById('syncUrl'); if (su && !su.value.trim()) su.value = cloudConf
